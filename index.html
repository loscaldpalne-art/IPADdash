<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRID // OS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* =========================================================
           テーマ定義（デフォルト黒を維持＋ガラス＆背景連動変数）
        ========================================================= */
        :root, [data-theme="obsidian"] {
            --bg: #09090b;
            --surface: #141418;
            --surface-alt: #1d1d24;
            --border: #2c2c36;
            --border-strong: #525263;
            --top-edge: rgba(255, 255, 255, 0.14);
            --shadow-rest: 0 4px 10px rgba(0, 0, 0, 0.45), 0 12px 24px rgba(0, 0, 0, 0.35);
            --shadow-lift: 0 10px 20px rgba(0, 0, 0, 0.55), 0 20px 36px rgba(0, 0, 0, 0.45);
            --fg: #f4f4f6;
            --muted: #8b8b9b;
            --accent: #ffffff;
            --accent-fg: #09090b;
            --danger: #ef4444;
            --grid-line: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.24);
        }
        [data-theme="paper"] {
            --bg: #e4e4df;
            --surface: #f4f4ef;
            --surface-alt: #e9e9e3;
            --border: #c5c5bc;
            --border-strong: #7a7a72;
            --top-edge: rgba(255, 255, 255, 0.85);
            --shadow-rest: 0 4px 10px rgba(0, 0, 0, 0.08), 0 10px 20px rgba(0, 0, 0, 0.06);
            --shadow-lift: 0 10px 18px rgba(0, 0, 0, 0.14), 0 18px 30px rgba(0, 0, 0, 0.1);
            --fg: #141413;
            --muted: #66665e;
            --accent: #141413;
            --accent-fg: #f4f4ef;
            --danger: #dc2626;
            --grid-line: rgba(0, 0, 0, 0.06);
            --glass-border: rgba(0, 0, 0, 0.18);
        }
        [data-theme="orange"] {
            --bg: #0f0f12;
            --surface: #18181c;
            --surface-alt: #222229;
            --border: #32323c;
            --border-strong: #ff5500;
            --top-edge: rgba(255, 255, 255, 0.12);
            --shadow-rest: 0 4px 10px rgba(0, 0, 0, 0.45), 0 12px 24px rgba(0, 0, 0, 0.35);
            --shadow-lift: 0 10px 20px rgba(0, 0, 0, 0.55), 0 20px 36px rgba(255, 85, 0, 0.16);
            --fg: #f4f4f5;
            --muted: #90909c;
            --accent: #ff5500;
            --accent-fg: #ffffff;
            --danger: #ef4444;
            --grid-line: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.22);
        }
        [data-theme="blueprint"] {
            --bg: #06101c;
            --surface: #0c1a2c;
            --surface-alt: #12253d;
            --border: #1e3b60;
            --border-strong: #38bdf8;
            --top-edge: rgba(56, 189, 248, 0.2);
            --shadow-rest: 0 4px 10px rgba(0, 0, 0, 0.45), 0 12px 24px rgba(0, 0, 0, 0.35);
            --shadow-lift: 0 10px 20px rgba(0, 0, 0, 0.55), 0 20px 36px rgba(56, 189, 248, 0.16);
            --fg: #e0f2fe;
            --muted: #7dd3fc;
            --accent: #38bdf8;
            --accent-fg: #06101c;
            --danger: #f87171;
            --grid-line: rgba(56, 189, 248, 0.07);
            --glass-border: rgba(125, 211, 252, 0.28);
        }
        [data-theme="terminal"] {
            --bg: #050b07;
            --surface: #0b160f;
            --surface-alt: #112217;
            --border: #1d3a27;
            --border-strong: #4ade80;
            --top-edge: rgba(74, 222, 128, 0.18);
            --shadow-rest: 0 4px 10px rgba(0, 0, 0, 0.5), 0 12px 24px rgba(0, 0, 0, 0.4);
            --shadow-lift: 0 10px 20px rgba(0, 0, 0, 0.6), 0 20px 36px rgba(74, 222, 128, 0.15);
            --fg: #dcfce7;
            --muted: #6ee7b7;
            --accent: #4ade80;
            --accent-fg: #050b07;
            --danger: #f87171;
            --grid-line: rgba(74, 222, 128, 0.06);
            --glass-border: rgba(110, 231, 183, 0.26);
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.16);
            --glass-blur: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* レコード等、明示的に丸くする要素 */
        .is-round { border-radius: 50% !important; }

        .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
        input, textarea, select { user-select: text; -webkit-user-select: text; }

        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            touch-action: manipulation;
        }

        /* ====== 背景レイヤー（デフォルト黒〜自由画像・グラデまで全対応） ====== */
        .bg-wallpaper {
            position: fixed;
            inset: -120px;
            z-index: 0;
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            transition: background-color 0.3s ease;
            pointer-events: none;
        }

        .bg-grid-lines {
            position: fixed;
            inset: -120px;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .bg-grid-lines.hidden { display: none; }

        .os-shell {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding-top: max(26px, env(safe-area-inset-top, 20px));
            padding-bottom: max(10px, env(safe-area-inset-bottom, 6px));
        }

        /* ====== トップバー ====== */
        .top-bar {
            height: 42px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
            gap: 10px;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .page-tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .page-tabs::-webkit-scrollbar { display: none; }

        .tab-chip {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 5px 11px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tab-chip:hover { color: var(--fg); }
        .tab-chip.active { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }

        .top-actions { display: flex; align-items: center; gap: 6px; }

        .btn-sharp {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            color: var(--fg);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 var(--top-edge), 0 2px 6px rgba(0, 0, 0, 0.2);
            padding: 5px 11px;
            font-size: 0.73rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s, background 0.18s;
        }
        .btn-sharp:hover { border-color: var(--border-strong); transform: translateY(-1px); }
        .btn-sharp:active { transform: scale(0.96); background: var(--surface-alt); }
        .btn-sharp.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
        .btn-sharp.danger { color: var(--danger); border-color: var(--danger); }

        /* ====== 編集インスペクタ ====== */
        .edit-inspector {
            max-height: 0;
            overflow: hidden;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 0 solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            opacity: 0;
            transition: max-height 0.28s cubic-bezier(0.22, 1, 0.36, 1), padding 0.28s ease, opacity 0.22s ease;
        }
        .editing .edit-inspector { max-height: 140px; padding: 8px 20px; border-bottom-width: 1px; opacity: 1; }
        .inspector-left { font-size: 0.74rem; color: var(--muted); }
        .inspector-left strong { color: var(--fg); }
        .inspector-controls { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

        /* ====== スワイプトラック ====== */
        .pages-track {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .pages-track::-webkit-scrollbar { display: none; }

        .page-pane {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow-y: auto;
            padding: 18px 20px 22px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .bento-grid {
            --cols: 6;
            --gap: 13px;
            --cell: 108px;
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            grid-auto-rows: var(--cell);
            grid-auto-flow: dense;
            gap: var(--gap);
        }

        /* ====== 浮かぶタイルデザイン ====== */
        .tile {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 var(--top-edge), var(--shadow-rest);
            color: var(--fg);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            container-type: size;
            transition:
                transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.2s ease,
                background-color 0.2s ease;
        }
        .tile:hover {
            transform: translateY(-3px);
            border-color: var(--border-strong);
            box-shadow: inset 0 1px 0 var(--top-edge), var(--shadow-lift);
        }
        .tile:active { transform: translateY(0) scale(0.97); }
        .tile.is-selected { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 3; transform: translateY(-2px); box-shadow: inset 0 1px 0 var(--top-edge), var(--shadow-lift); }
        .tile.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; transform: scale(0.96); }
        .tile.is-dragging { opacity: 0.28; transform: scale(0.94); }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: var(--surface-alt);
            border: 2px solid var(--accent);
            transform: translate(-50%, -50%) scale(1.04);
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.55);
        }

        /* ====== クリアガラスモード（背景が透ける建築ガラス） ====== */
        .glass-mode .top-bar,
        .glass-mode .edit-inspector,
        .glass-mode .tile,
        .glass-mode .dock-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(175%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(175%);
            border-color: var(--glass-border);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.34),
                inset 0 -1px 1px rgba(0, 0, 0, 0.14),
                0 8px 24px rgba(0, 0, 0, 0.24);
        }
        .glass-mode .tile:hover {
            border-color: rgba(255, 255, 255, 0.48);
            box-shadow:
                inset 0 1.5px 2px rgba(255, 255, 255, 0.45),
                0 14px 32px rgba(0, 0, 0, 0.32);
        }
        .glass-mode .dock-item {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }
        .glass-mode .w-head { border-bottom-color: var(--glass-border); }
        .glass-mode .w-input,
        .glass-mode .w-search-input,
        .glass-mode .w-todo-row,
        .glass-mode .w-sch-cell,
        .glass-mode .btn-sharp:not(.primary):not(.danger) {
            background: rgba(0, 0, 0, 0.22);
            border-color: var(--glass-border);
        }

        /* 1×1 正方形アプリタイル */
        .tile.is-app { align-items: center; justify-content: center; padding: 10px 6px 8px; gap: 8px; }
        .app-glyph {
            width: 38%; height: 38%; min-width: 28px; min-height: 28px; max-width: 44px; max-height: 44px;
            color: var(--fg); display: flex; align-items: center; justify-content: center;
            transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tile.is-app:hover .app-glyph { transform: scale(1.08); }
        .app-glyph svg { width: 100%; height: 100%; display: block; }
        .app-title {
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; text-align: center;
            max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
        }

        .tile-badge {
            position: absolute; top: 0; right: 0; background: var(--accent); color: var(--accent-fg);
            font-size: 0.62rem; font-weight: 700; padding: 2px 6px; z-index: 4;
            opacity: 0; transform: translateY(-4px); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
        }
        .editing .tile-badge { opacity: 1; transform: translateY(0); }

        /* ウィジェットサイズ */
        .tile.sz-2x1 { grid-column: span 2; grid-row: span 1; }
        .tile.sz-3x1 { grid-column: span 3; grid-row: span 1; }
        .tile.sz-4x1 { grid-column: span 4; grid-row: span 1; }
        .tile.sz-6x1 { grid-column: span 6; grid-row: span 1; }
        .tile.sz-2x2 { grid-column: span 2; grid-row: span 2; }
        .tile.sz-3x2 { grid-column: span 3; grid-row: span 2; }
        .tile.sz-4x2 { grid-column: span 4; grid-row: span 2; }
        .tile.sz-6x2 { grid-column: span 6; grid-row: span 2; }

        /* ウィジェット内部 */
        .w-panel { width: 100%; height: 100%; padding: 12px 15px; display: flex; flex-direction: column; overflow: hidden; }
        .w-head {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; color: var(--muted);
            border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 8px; flex-shrink: 0;
        }

        /* デジタル時計 */
        .w-clock-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
        .w-clock-time { font-size: clamp(1.8rem, min(19cqw, 36cqh), 6.2rem); font-weight: 800; line-height: 0.95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .w-clock-date { font-size: clamp(0.72rem, min(4.2cqw, 9cqh), 1.3rem); color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }

        /* 丸型アナログ時計 */
        .w-analog-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
        .w-analog-svg { height: 92%; max-width: 92%; aspect-ratio: 1; flex-shrink: 0; }
        .w-analog-meta { display: none; flex-direction: column; gap: 4px; }
        @container (min-width: 300px) { .w-analog-meta { display: flex; } }

        /* 検索ボックスウィジェット */
        .w-search-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 0; }
        .w-search-input { flex: 1; height: 100%; max-height: 44px; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 0 12px; font-size: 0.92rem; outline: none; min-width: 0; }
        .w-search-input:focus { border-color: var(--accent); }
        .w-search-btn { height: 100%; max-height: 44px; padding: 0 16px; }

        /* 天気 */
        .w-loc-btn { background: transparent; border: 1px solid var(--border); color: var(--fg); font-size: 0.66rem; font-weight: 700; padding: 2px 7px; cursor: pointer; letter-spacing: 0.05em; }
        .w-loc-btn:hover { border-color: var(--accent); color: var(--accent); }
        .w-weather-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .w-weather-temp { font-size: clamp(1.6rem, 11cqw, 2.5rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
        .w-weather-svg { width: 100%; flex: 1; min-height: 36px; max-height: 64px; overflow: visible; }
        .w-weather-hours { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
        .w-rain-bars { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; height: 22px; margin-top: 4px; }
        .w-rain-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .w-rain-fill { width: 100%; background: var(--accent); opacity: 0.68; min-height: 2px; }
        .w-rain-txt { font-size: 0.6rem; color: var(--muted); }

        /* タイマー */
        .w-timer-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
        .w-timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .w-timer-num { font-size: clamp(1.8rem, 15cqw, 3rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        .w-timer-btns { display: flex; gap: 5px; flex-wrap: wrap; }

        /* ====== 丸い本物のレコードプレイヤー (AUDIO DECK) ====== */
        .w-audio-body { display: flex; align-items: center; gap: 14px; flex: 1; min-height: 0; }
        .turntable-box {
            position: relative;
            width: clamp(68px, 38cqw, 110px);
            height: clamp(68px, 38cqw, 110px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vinyl-record {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                conic-gradient(from 35deg, transparent 0deg, rgba(255,255,255,0.22) 22deg, transparent 52deg, transparent 180deg, rgba(255,255,255,0.16) 204deg, transparent 234deg),
                repeating-radial-gradient(#0c0e14 0px, #0c0e14 2px, #1f2430 3px, #090b10 4px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
            animation: spinVinyl 6s linear infinite;
            animation-play-state: paused;
        }
        .vinyl-record.playing { animation-play-state: running; }
        @keyframes spinVinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .vinyl-label {
            width: 38%;
            height: 38%;
            background: var(--accent);
            border: 2px solid #090b10;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .vinyl-spindle {
            width: 30%;
            height: 30%;
            background: #090b10;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* レコードの針（トーンアーム） */
        .vinyl-arm {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 24%;
            height: 74%;
            pointer-events: none;
            transform-origin: 65% 12%;
            transform: rotate(-28deg);
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(1px 3px 4px rgba(0, 0, 0, 0.6));
        }
        .vinyl-arm.active { transform: rotate(16deg); }
        .vinyl-arm-pivot {
            position: absolute;
            top: 0;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #cbd5e1;
            border: 2px solid #334155;
        }
        .vinyl-arm-rod {
            position: absolute;
            top: 10px;
            right: 6.5px;
            width: 2.5px;
            height: 68%;
            background: #e2e8f0;
        }
        .vinyl-arm-head {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 7px;
            height: 12px;
            background: var(--accent);
            border: 1px solid #000;
            transform: rotate(18deg);
        }

        /* メモ・ToDo・時間割 */
        .w-textarea { width: 100%; flex: 1; background: transparent; border: none; color: var(--fg); font-size: 0.88rem; line-height: 1.5; resize: none; outline: none; }
        .w-input-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .w-input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 6px 8px; font-size: 0.82rem; outline: none; }
        .w-input:focus { border-color: var(--accent); }
        .w-todo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .w-todo-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--border); font-size: 0.82rem; }
        .w-todo-row.done span { text-decoration: line-through; color: var(--muted); }
        .w-todo-row span { flex: 1; word-break: break-word; }
        .w-chk { width: 15px; height: 15px; border: 1.5px solid var(--fg); background: transparent; color: var(--accent-fg); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .w-todo-row.done .w-chk { background: var(--accent); border-color: var(--accent); }

        .w-sch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; flex: 1; }
        .w-sch-cell { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); padding: 3px 7px; }
        .w-sch-cell span { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
        .w-sch-cell input { flex: 1; min-width: 0; background: transparent; border: none; color: var(--fg); font-size: 0.8rem; outline: none; }

        /* ====== 下部 Dock バー ====== */
        .dock-wrap { flex-shrink: 0; padding: 6px 20px 2px; display: flex; justify-content: center; }
        .dock-bar {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface); border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 var(--top-edge), var(--shadow-lift);
            padding: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none;
        }
        .dock-bar::-webkit-scrollbar { display: none; }
        .dock-item {
            position: relative; width: 56px; height: 56px;
            background: var(--bg); border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); color: var(--fg);
            text-decoration: none; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 3px; flex-shrink: 0; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s;
        }
        .dock-item:hover { transform: translateY(-2px); border-color: var(--border-strong); }
        .dock-item:active { transform: scale(0.94); }
        .dock-item.is-selected { outline: 2px solid var(--accent); outline-offset: -2px; }
        .dock-item svg { width: 22px; height: 22px; }
        .dock-item span { font-size: 0.56rem; font-weight: 600; max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

        /* ====== モーダル ====== */
        .modal-bg {
            position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.68);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
        }
        .modal-bg.open { opacity: 1; pointer-events: auto; }

        .modal-panel {
            width: 100%; max-width: 540px; background: var(--surface);
            border: 1px solid var(--border-strong); box-shadow: var(--shadow-lift);
            padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 86vh; overflow-y: auto;
            transform: translateY(14px) scale(0.98); transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal-bg.open .modal-panel { transform: translateY(0) scale(1); }
        .modal-panel h3 { font-size: 0.92rem; font-weight: 800; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; display: flex; justify-content: space-between; }
        .field input[type="text"], .field select {
            background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 9px 11px; font-size: 0.88rem; outline: none;
        }
        .field input[type="text"]:focus, .field select:focus { border-color: var(--accent); }
        .field input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .field input[type="color"] { width: 44px; height: 34px; border: 1px solid var(--border); background: var(--bg); padding: 2px; cursor: pointer; }

        .icon-picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 210px; overflow-y: auto; padding: 2px; }
        .ip-btn { aspect-ratio: 1; background: var(--bg); border: 1px solid var(--border); color: var(--fg); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; }
        .ip-btn.active { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
        .ip-btn svg { width: 100%; height: 100%; }

        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .theme-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--fg);
            padding: 9px 10px; text-align: left; cursor: pointer;
            transition: border-color 0.15s, transform 0.15s;
        }
        .theme-btn:hover { border-color: var(--border-strong); }
        .theme-btn.active { border-color: var(--accent); background: var(--surface-alt); }
        .theme-btn strong { display: block; font-size: 0.8rem; }
        .theme-btn span { font-size: 0.68rem; color: var(--muted); }

        .seg-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .seg-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .swatch-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .color-dot { width: 28px; height: 28px; border: 1px solid var(--border-strong); cursor: pointer; }
        .grad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grad-chip { height: 42px; border: 1px solid var(--border); cursor: pointer; }
        .grad-chip.active { outline: 2px solid var(--accent); outline-offset: -2px; }

        .city-chips { display: flex; flex-wrap: wrap; gap: 6px; }

        /* 検索モーダル */
        .search-modal { align-items: flex-start; padding-top: 10vh; }
        .search-box { width: 100%; max-width: 540px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lift); }
        .search-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .search-head input { flex: 1; background: transparent; border: none; color: var(--fg); font-size: 1rem; outline: none; }
        .search-list { max-height: 48vh; overflow-y: auto; }
        .search-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--fg); cursor: pointer; }
        .search-row:hover { background: var(--surface-alt); }
        .search-row svg { width: 20px; height: 20px; flex-shrink: 0; }

        .toast {
            position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: var(--accent-fg); padding: 8px 14px;
            font-size: 0.78rem; font-weight: 700; display: none; align-items: center; gap: 12px; z-index: 300;
            box-shadow: var(--shadow-lift);
        }
        .toast.show { display: flex; }

        @media (max-width: 720px) {
            .page-pane { padding: 12px; }
            .bento-grid { --cols: 4; --gap: 9px; }
            .tile.sz-6x2, .tile.sz-4x2, .tile.sz-3x2 { grid-column: span 4; }
            .tile.sz-6x1, .tile.sz-4x1, .tile.sz-3x1 { grid-column: span 4; }
        }
    </style>
</head>
<body data-theme="obsidian">

    <!-- 追加メニュー -->

                <button class="theme-btn" onclick="addWidget('analog','2x2')"><strong>ANALOG CLOCK</strong><span>洗練された丸型時計 (2×2)</span></button>
                <button class="theme-btn" onclick="addWidget('weather','2x2')"><strong>WEATHER</strong><span>場所選択・グラフ・降水確率 (2×2)</span></button>
                <button class="theme-btn" onclick="addWidget('timer','2x2')"><strong>TIMER</strong><span>バックグラウンド対応 (2×2)</span></button>
                <button class="theme-btn" onclick="addWidget('audio','2x2')"><strong>AUDIO DECK</strong><span>丸いレコード＆Lo-Fi再生 (2×2)</span></button>
                <button class="theme-btn" onclick="addWidget('note','3x2')"><strong>NOTES</strong><span>自動保存メモパッド (3×2)</span></button>
                <button class="theme-btn" onclick="addWidget('todo','3x2')"><strong>TODO</strong><span>チェック式タスク管理 (3×2)</span></button>
                <button class="theme-btn" onclick="addWidget('schedule','4x2')"><strong>TIMETABLE</strong><span>1〜6限の時間割 (4×2)</span></button>
            </div>
            <button class="btn-sharp" style="justify-content:center;" onclick="closeModal('addModal')">閉じる</button>
        </div>
    </div>

    <!-- 天気 場所選択モーダル -->
    <div class="modal-bg" id="cityModal" onclick="if(event.target===this) closeModal('cityModal')">

                    <button class="btn-sharp" onclick="selectWeatherCity('OSAKA', 34.6937, 135.5023)">大阪</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('NAGOYA', 35.1815, 136.9066)">名古屋</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('YOKOHAMA', 35.4437, 139.6380)">横浜</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('KYOTO', 35.0116, 135.7681)">京都</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('FUKUOKA', 33.5902, 130.4017)">福岡</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('SAPPORO', 43.0618, 141.3545)">札幌</button>
                    <button class="btn-sharp" onclick="selectWeatherCity('SENDAI', 38.2682, 140.8694)">仙台</button>

            <button class="btn-sharp" style="justify-content:center;" onclick="closeModal('cityModal')">閉じる</button>
        </div>
    </div>

    <!-- アプリ追加・編集モーダル -->
    <div class="modal-bg" id="appModal" onclick="if(event.target===this) closeModal('appModal')">
        <div class="modal-panel">
            <h3 class="mono" id="appModalTitle">APP CONFIG</h3>
            <div class="field"><label>表示名</label><input type="text" id="fName" placeholder="例：Notion"></div>
            <div class="field"><label>URL（アプリ起動URL / https://...）</label><input type="text" id="fUrl" placeholder="https://..."></div>
            <div class="field"><label>アイコンを選択</label><div class="icon-picker" id="iconPicker"></div></div>
            <div class="field"><label>配置先</label><select id="fTarget"></select></div>
            <div style="display:flex; align-items:center; gap:8px; font-size:0.82rem;">
                <input type="checkbox" id="fNewTab">

                <button class="btn-sharp primary" onclick="saveAppModal()">保存</button>
            </div>
        </div>
    </div>

    <!-- テーマ・クリアガラス・背景カスタマイズモーダル -->
    <div class="modal-bg" id="themeModal" onclick="if(event.target===this) closeModal('themeModal')">
        <div class="modal-panel">
            <h3 class="mono">THEME / GLASS / BACKGROUND</h3>

            <div class="field">
                <label>統一カラーテーマ（文字・アイコン色）</label>
                <div class="theme-grid">
                    <button class="theme-btn" data-t="obsidian" onclick="setTheme('obsidian')"><strong>OBSIDIAN</strong><span>黒基調 × 純白（デフォルト）</span></button>
                    <button class="theme-btn" data-t="paper" onclick="setTheme('paper')"><strong>PAPER</strong><span>白基調 × 墨黒</span></button>
                    <button class="theme-btn" data-t="orange" onclick="setTheme('orange')"><strong>INDUSTRIAL</strong><span>ダーク × オレンジ</span></button>
                    <button class="theme-btn" data-t="blueprint" onclick="setTheme('blueprint')"><strong>BLUEPRINT</strong><span>濃紺 × シアン</span></button>
                    <button class="theme-btn" data-t="terminal" onclick="setTheme('terminal')"><strong>TERMINAL</strong><span>黒緑 × ミント</span></button>
                </div>
            </div>

            <div class="field">
                <label>SURFACE STYLE（タイルの質感）</label>
                <div class="seg-row">
                    <button class="theme-btn" id="btnSolidMode" onclick="setGlassMode(false)"><strong>SOLID (デフォルト)</strong><span>現在のソリッドな黒</span></button>
                    <button class="theme-btn" id="btnGlassMode" onclick="setGlassMode(true)"><strong>CLEAR GLASS</strong><span>背景が透ける透明ガラス</span></button>

                    <label>ガラスの色（ティント）</label>

                        <div class="color-dot" style="background:#000000;" onclick="setGlassColor('#000000')" title="スモークブラック"></div>

                    <button class="btn-sharp" id="bgBtnGrad" style="justify-content:center;" onclick="setBgMode('gradient')">グラデ</button>

                    <div class="color-dot" style="background:#0f172a;" onclick="setCustomBgColor('#0f172a')"></div>
                    <div class="color-dot" style="background:#1e1b4b;" onclick="setCustomBgColor('#1e1b4b')"></div>
                    <div class="color-dot" style="background:#064e3b;" onclick="setCustomBgColor('#064e3b')"></div>

            </div>
        </div>

    <!-- クイック検索モーダル -->
    <div class="modal-bg search-modal" id="searchModal" onclick="if(event.target===this) closeModal('searchModal')">
        <div class="search-box">
            <div class="search-head">
                <span class="mono" style="font-size:0.78rem; color:var(--muted);">CMD+K</span>
                <input type="text" id="searchInput" placeholder="アプリを検索 / Google検索..." autocomplete="off">
            </div>
            <div class="search-list" id="searchList"></div>
        </div>
    </div>

    <script>
        /* =========================================================
           1. 全アプリ対応・統一ミニマルSVGアイコン集
        ========================================================= */
        const GLYPHS = {
            settings:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/></svg>`,

        function captureRects() {
            const map = new Map();

            return map;
        }

        function playFlip(prevRects) {
            if (!prevRects || !prevRects.size) return;
            document.querySelectorAll('.tile[data-uid]').forEach(el => {
                const first = prevRects.get(el.dataset.uid);
                if (!first) return;
                const last = el.getBoundingClientRect();
                const dx = first.left - last.left, dy = first.top - last.top;
                if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
                el.style.transition = 'none';
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                el.getBoundingClientRect();
                requestAnimationFrame(() => {
                    el.style.transition = 'transform 0.34s cubic-bezier(0.22, 1, 0.36, 1)';
                    el.style.transform = '';
                    setTimeout(() => { el.style.transition = ''; }, 360);
                });

            const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#ffffff');
            return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [255, 255, 255];

        function uploadBgImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const max = 1920;
                    let w = img.width, h = img.height;
                    if (w > max || h > max) {
                        const r = Math.min(max / w, max / h);
                        w = Math.round(w * r); h = Math.round(h * r);
                    }
                    const cvs = document.createElement('canvas');
                    cvs.width = w; cvs.height = h;
                    cvs.getContext('2d').drawImage(img, 0, 0, w, h);
                    state.bgMode = 'image';
                    state.bgImage = cvs.toDataURL('image/jpeg', 0.82);
                    saveState();
                    applyTheme();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        let audioCtx = null, isPlaying = false, songIdx = 0, step = 0, audInt = null;
        const TRACKS = [

            { name: '02 / STUDY TAPE', chords: [[293.7,349.2,440,523.3],[246.9,293.7,370,440],[196,246.9,293.7,370],[220,277.2,329.6,415.3]] },
            { name: '03 / RAIN LOUNGE', chords: [[220,261.6,329.6,415.3],[196,246.9,293.7,370],[164.8,196,246.9,329.6],[174.6,220,261.6,349.2]] }
        ];
        function playChord(freqs) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            freqs.forEach(f => {
                const o = audioCtx.createOscillator(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(f, now);
                fl.type = 'lowpass'; fl.frequency.setValueAtTime(750, now);
                g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.04, now + 0.12);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
                o.connect(fl); fl.connect(g); g.connect(audioCtx.destination);
                o.start(now); o.stop(now + 2.2);
            });
        }
        function toggleAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = !isPlaying; clearInterval(audInt);
            if (isPlaying) {
                playChord(TRACKS[songIdx].chords[step]); step = (step + 1) % 4;
                audInt = setInterval(() => { playChord(TRACKS[songIdx].chords[step]); step = (step + 1) % 4; }, 2200);
            }
            syncAudioUI();
        }
        function nextAudio() {

        const weatherCache = {};
        let activeWeatherWidget = null;
        function getDefaultWeather(city) {
            return { city: city || 'TOKYO', cond: 'CLEAR / CLOUDY', temp: 18, hi: 21, lo: 12, hours: ['12H','15H','18H','21H','00H'], temps: [18,21,17,14,12], rain: [10,20,40,15,5] };
        }
        async function loadWeatherForWidget(w) {
            const lat = w.lat ?? 35.6762, lon = w.lon ?? 139.6503, city = (w.city || 'TOKYO').toUpperCase();
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`);
                if (!res.ok) return;
                const d = await res.json();
                const ch = new Date().getHours();
                const hrs = [], tmps = [], rns = [];
                for (let i = 0; i < 5; i++) {
                    const idx = ch + i * 3;
                    hrs.push(`${String(idx % 24).padStart(2,'0')}H`);
                    tmps.push(Math.round(d.hourly.temperature_2m[idx] ?? 18));
                    rns.push(d.hourly.precipitation_probability[idx] ?? 10);
                }
                const c = d.current.weather_code;
                weatherCache[w.id] = {
                    city, cond: c <= 1 ? 'CLEAR' : c <= 3 ? 'PARTLY CLOUDY' : c <= 48 ? 'CLOUDY' : 'RAIN',
                    temp: Math.round(d.current.temperature_2m), hi: Math.round(d.daily.temperature_2m_max[0]), lo: Math.round(d.daily.temperature_2m_min[0]),
                    hours: hrs, temps: tmps, rain: rns
                };
                document.querySelectorAll(`.js-weather-panel[data-wid="${w.id}"]`).forEach(el => { el.innerHTML = buildWeatherInner(w); });
            } catch (e) {}
        }
        function buildWeatherInner(w) {
            const wd = weatherCache[w.id] || getDefaultWeather(w.city);
            const minT = Math.min(...wd.temps) - 1, maxT = Math.max(...wd.temps) + 1;
            const span = Math.max(1, maxT - minT);
            const pts = wd.temps.map((t, i) => [i * 60, Math.round(34 - ((t - minT) / span) * 24)]);
            const poly = pts.map(p => p.join(',')).join(' ');
            return `
                <div class="w-head mono">
                    <button type="button" class="w-loc-btn mono" onclick="if(!isEditMode){ event.stopPropagation(); openCityModal('${w.id}'); }">${escapeHtml(wd.city)} ▾</button>
                    <span>H:${wd.hi}° L:${wd.lo}°</span>
                </div>
                <div class="w-weather-top">
                    <div class="w-weather-temp mono">${wd.temp}°C</div>
                    <span class="mono" style="font-size:0.68rem; color:var(--muted);">${wd.cond}</span>
                </div>
                <svg class="w-weather-svg" viewBox="0 0 240 42">
                    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${poly}"/>
                    ${pts.map(([x, y], i) => `<rect x="${x-2.5}" y="${y-2.5}" width="5" height="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.8"/><text x="${x}" y="${Math.max(8, y-6)}" text-anchor="${i===0?'start':(i===4?'end':'middle')}" fill="var(--fg)" font-size="9" font-weight="700">${wd.temps[i]}°</text>`).join('')}
                </svg>
                <div class="w-weather-hours mono">${wd.hours.map(h => `<span>${h}</span>`).join('')}</div>
                <div class="w-rain-bars">${wd.rain.map(r => `<div class="w-rain-col"><div class="w-rain-fill" style="height:${Math.max(2, Math.round(r*0.14))}px"></div><span class="w-rain-txt mono">${r}%</span></div>`).join('')}</div>
            `;
        }
        function findWidgetById(wid) {

        function openCityModal(wid) {

        function selectWeatherCity(name, lat, lon) {

        async function searchCityGeo() {

                    const sp = document.createElement('span'); sp.textContent = t.text;
                    row.append(chk, sp); ul.appendChild(row);
                });
            });
        }
        function handleInlineSearch(form) {
            const q = form.querySelector('input').value.trim();
            if (!q) return;
            const apps = [...state.dock, ...state.pages.flatMap(p => p.items).filter(x => x.type === 'app')];
            const hit = apps.find(a => a.name.toLowerCase().includes(q.toLowerCase()));
            if (hit && isSafeUrl(hit.url)) {
                if (hit.newTab) window.open(hit.url, '_blank', 'noopener');
                else window.location.href = hit.url;
            } else {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank', 'noopener');
            }
        }

        function buildWidgetPanel(w) {

                            <line class="js-s-hand" x1="50" y1="58" x2="50" y2="13" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="square"/>

        /* =========================================================
           7. ドラッグ＆ドロップ＋滑らかFLIP確定
        ========================================================= */
        let dragState = null;

        function startSafeDrag(el, loc, idx, e) {
            const rc = el.getBoundingClientRect();
            const ghost = el.cloneNode(true);
            ghost.className = 'drag-ghost';
            ghost.style.width = `${rc.width}px`; ghost.style.height = `${rc.height}px`;
            ghost.style.left = `${e.clientX}px`; ghost.style.top = `${e.clientY}px`;
            document.body.appendChild(ghost);
            el.classList.add('is-dragging');
            document.getElementById('pagesTrack').style.overflowX = 'hidden';
            dragState = { el, loc, idx, ghost, dropLoc: null, dropIdx: null };
        }

        window.addEventListener('pointermove', e => {
            if (!dragState) return;
            dragState.ghost.style.left = `${e.clientX}px`;
            dragState.ghost.style.top = `${e.clientY}px`;
            document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
            dragState.dropLoc = null; dragState.dropIdx = null;
            const under = document.elementFromPoint(e.clientX, e.clientY);
            const targetTile = under?.closest('.tile, .dock-item');
            if (targetTile && targetTile !== dragState.el) {
                targetTile.classList.add('drop-target');
                dragState.dropLoc = targetTile.dataset.loc === 'dock' ? 'dock' : Number(targetTile.dataset.loc);
                dragState.dropIdx = Number(targetTile.dataset.idx);
            }
        });

        function endSafeDrag() {
            if (!dragState) return;
            const { el, loc, idx, ghost, dropLoc, dropIdx } = dragState;
            ghost.remove();
            el.classList.remove('is-dragging');
            document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
            document.getElementById('pagesTrack').style.overflowX = 'auto';
            if (dropLoc !== null && dropIdx !== null && !(dropLoc === loc && dropIdx === idx)) {
                const srcArr = loc === 'dock' ? state.dock : state.pages[loc].items;
                const dstArr = dropLoc === 'dock' ? state.dock : state.pages[dropLoc].items;
                const moving = srcArr[idx];
                if (!(dropLoc === 'dock' && moving.type === 'widget')) {
                    const prevRects = captureRects();
                    pushUndo();
                    srcArr.splice(idx, 1); dstArr.splice(dropIdx, 0, moving);
                    selected = { loc: dropLoc, idx: dropIdx };
                    saveState(); renderAll(prevRects);
                }
            }
            dragState = null;
        }
        window.addEventListener('pointerup', endSafeDrag);
        window.addEventListener('pointercancel', endSafeDrag);

        /* =========================================================
           8. 全体レンダリング
        ========================================================= */
        function createTile(item, loc, idx) {
            const isSel = selected && selected.loc === loc && selected.idx === idx;
            const el = document.createElement(item.type === 'app' ? 'a' : 'div');
            el.dataset.loc = String(loc); el.dataset.idx = String(idx); el.dataset.uid = item._uid;

            if (loc === 'dock') {
                el.className = 'dock-item' + (isSel ? ' is-selected' : '');
                el.href = isSafeUrl(item.url) ? item.url : '#';
                if (item.newTab) { el.target = '_blank'; el.rel = 'noopener'; }
                el.innerHTML = (GLYPHS[item.icon] || GLYPHS.web) + `<span>${escapeHtml(item.name)}</span>`;
            } else {
                el.className = 'tile ' + (item.type === 'app' ? 'is-app' : `sz-${item.size || '2x2'}`) + (isSel ? ' is-selected' : '');
                if (item.type === 'app') {
                    el.href = isSafeUrl(item.url) ? item.url : '#';
                    if (item.newTab) { el.target = '_blank'; el.rel = 'noopener'; }
                    el.innerHTML = `<div class="app-glyph">${GLYPHS[item.icon] || GLYPHS.web}</div><div class="app-title">${escapeHtml(item.name)}</div>`;
                } else {
                    el.appendChild(buildWidgetPanel(item));
                }
                const badge = document.createElement('span');
                badge.className = 'tile-badge mono';
                badge.textContent = item.type === 'app' ? `${idx + 1}` : (item.size || '2x2').toUpperCase();
                el.appendChild(badge);
            }

            let sx = 0, sy = 0, lpTimer = null, moved = false;
            el.addEventListener('pointerdown', e => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                sx = e.clientX; sy = e.clientY; moved = false;
                if (!isEditMode) lpTimer = setTimeout(() => { toggleEditMode(true); selectItem(loc, idx); }, 450);
            });
            el.addEventListener('pointermove', e => {
                if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
                    clearTimeout(lpTimer);
                    if (isEditMode && !dragState && !moved) { moved = true; startSafeDrag(el, loc, idx, e); }
                }
            });
            const clearLP = () => clearTimeout(lpTimer);
            el.addEventListener('pointerup', clearLP); el.addEventListener('pointercancel', clearLP);
            el.addEventListener('click', e => {
                if (isEditMode) { e.preventDefault(); if (!moved) selectItem(loc, idx); }
            });
            return el;
        }

        function renderAll(prevRects = null) {
            ensureUids();
            const tabs = document.getElementById('pageTabs'); tabs.innerHTML = '';
            state.pages.forEach((pg, i) => {
                const b = document.createElement('button');
                b.className = 'tab-chip mono' + (i === currentPage ? ' active' : '');
                b.textContent = pg.title || `0${i + 1}`;
                b.onclick = () => goToPage(i);
                tabs.appendChild(b);
            });

            const track = document.getElementById('pagesTrack'); track.innerHTML = '';
            state.pages.forEach((pg, pIdx) => {
                const pane = document.createElement('section'); pane.className = 'page-pane';
                let et = null;
                pane.addEventListener('pointerdown', e => {
                    if (e.target === pane || e.target.classList.contains('bento-grid')) et = setTimeout(() => toggleEditMode(true), 450);
                });
                pane.addEventListener('pointermove', () => clearTimeout(et));
                pane.addEventListener('pointerup', () => clearTimeout(et));

                const grid = document.createElement('div'); grid.className = 'bento-grid';
                pg.items.forEach((item, iIdx) => grid.appendChild(createTile(item, pIdx, iIdx)));
                pane.appendChild(grid); track.appendChild(pane);
            });

            const dock = document.getElementById('dockBar'); dock.innerHTML = '';
            state.dock.forEach((app, idx) => dock.appendChild(createTile(app, 'dock', idx)));

            requestAnimationFrame(() => {
                track.scrollTo({ left: currentPage * track.clientWidth, behavior: 'instant' });
                recalcGridCells();
                if (prevRects) playFlip(prevRects);
            });
            updateInspector(); updateClocks(); renderTimers(); renderTodos();
        }

        function goToPage(i) {
            currentPage = Math.max(0, Math.min(state.pages.length - 1, i));
            const track = document.getElementById('pagesTrack');
            track.scrollTo({ left: currentPage * track.clientWidth, behavior: 'smooth' });
            document.querySelectorAll('.tab-chip').forEach((c, idx) => c.classList.toggle('active', idx === currentPage));
        }

        document.getElementById('pagesTrack').addEventListener('scroll', () => {
            const track = document.getElementById('pagesTrack');
            const w = track.clientWidth || 1;
            const idx = Math.round(track.scrollLeft / w);
            if (idx !== currentPage) {
                currentPage = idx;
                document.querySelectorAll('.tab-chip').forEach((c, i) => c.classList.toggle('active', i === idx));
            }
        });

        /* =========================================================
           9. 編集・移動・リサイズ
        ========================================================= */
        function toggleEditMode(force) {
            isEditMode = typeof force === 'boolean' ? force : !isEditMode;
            document.getElementById('osShell').classList.toggle('editing', isEditMode);
            document.getElementById('editBtn').classList.toggle('primary', isEditMode);
            document.getElementById('editBtn').textContent = isEditMode ? 'DONE [Esc]' : 'EDIT [E]';
            if (isEditMode && !selected && state.pages[currentPage].items.length) selected = { loc: currentPage, idx: 0 };
            if (!isEditMode) selected = null;
            renderAll();
        }
        function selectItem(loc, idx) {
            selected = { loc, idx };
            document.querySelectorAll('.is-selected').forEach(x => x.classList.remove('is-selected'));
            const el = document.querySelector(`[data-loc="${loc}"][data-idx="${idx}"]`);
            if (el) el.classList.add('is-selected');
            updateInspector();
        }
        function getSelectedItem() {
            if (!selected) return null;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc]?.items;
            return arr ? arr[selected.idx] : null;
        }
        function updateInspector() {
            const info = document.getElementById('selInfo'), btnResize = document.getElementById('btnResize'), btnEdit = document.getElementById('btnEditSel');
            const item = getSelectedItem();
            if (!item) { info.innerHTML = '<span>SELECT A TILE (OR ARROWS)</span>'; btnResize.style.display = 'none'; btnEdit.style.display = 'none'; return; }
            const label = item.type === 'app' ? item.name : `${item.widgetType.toUpperCase()} [${item.size}]`;
            info.innerHTML = `SELECTED: <strong>${escapeHtml(label)}</strong>`;
            btnResize.style.display = item.type === 'widget' ? 'inline-flex' : 'none';
            btnEdit.style.display = (item.type === 'app' || item.widgetType === 'weather') ? 'inline-flex' : 'none';
        }
        function moveSelected(dir) {
            if (!selected) return;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc].items;
            const target = selected.idx + dir;
            if (target < 0 || target >= arr.length) return;
            const prev = captureRects(); pushUndo();
            [arr[selected.idx], arr[target]] = [arr[target], arr[selected.idx]];
            selected.idx = target; saveState(); renderAll(prev);
        }
        function cycleSelectedSize() {
            const item = getSelectedItem();
            if (!item || item.type !== 'widget') return;
            const sizes = item.widgetType === 'search' ? ['3x1', '4x1', '6x1', '2x1'] : ['2x1', '2x2', '3x2', '4x2', '6x2'];
            const next = sizes[(sizes.indexOf(item.size) + 1) % sizes.length];
            const prev = captureRects(); pushUndo(); item.size = next; saveState(); renderAll(prev);
        }
        function deleteSelectedItem() {
            if (!selected) return;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc].items;
            const removed = arr[selected.idx];
            if (!removed) return;
            const prev = captureRects(); pushUndo(); arr.splice(selected.idx, 1);
            selected = arr.length ? { loc: selected.loc, idx: Math.min(selected.idx, arr.length - 1) } : null;
            saveState(); renderAll(prev); showUndoToast(`REMOVED: ${removed.name || removed.widgetType}`);
        }
        function editSelectedItem() {
            const item = getSelectedItem();
            if (!item) return;
            if (item.type === 'app') openAppModal(selected.loc, selected.idx);
            else if (item.widgetType === 'weather') openCityModal(item.id);
        }
        function addPage() {
            pushUndo();
            state.pages.push({ title: `0${state.pages.length + 1} PAGE`, items: [] });
            saveState(); currentPage = state.pages.length - 1; renderAll();
        }

        /* =========================================================
           10. キーボード操作
        ========================================================= */
        document.addEventListener('keydown', e => {
            const inInput = e.target.matches('input, textarea, select');
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !inInput) { e.preventDefault(); undoAction(); return; }
            if (e.key === 'Escape') {
                const openM = document.querySelector('.modal-bg.open');
                if (openM) openM.classList.remove('open');
                else if (isEditMode) toggleEditMode(false);
                return;
            }
            if (inInput || document.querySelector('.modal-bg.open')) return;

            const k = e.key.toLowerCase();
            if (k === 'e') { e.preventDefault(); toggleEditMode(); return; }
            if (k === 'n') { e.preventDefault(); openModal('addModal'); return; }
            if (e.key === '/') { e.preventDefault(); openSearch(); return; }
            if ((e.shiftKey && e.key === 'ArrowLeft') || e.key === '[') { e.preventDefault(); if (!isEditMode) toggleEditMode(true); moveSelected(-1); return; }
            if ((e.shiftKey && e.key === 'ArrowRight') || e.key === ']') { e.preventDefault(); if (!isEditMode) toggleEditMode(true); moveSelected(1); return; }

            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                e.preventDefault();
                const items = state.pages[currentPage].items;
                if (!items.length) return;
                if (!selected || selected.loc !== currentPage) { selectItem(currentPage, 0); return; }
                const cols = window.innerWidth <= 720 ? 4 : (state.cols || 6);
                let ni = selected.idx;
                if (e.key === 'ArrowLeft') ni = Math.max(0, selected.idx - 1);
                if (e.key === 'ArrowRight') ni = Math.min(items.length - 1, selected.idx + 1);
                if (e.key === 'ArrowUp') ni = Math.max(0, selected.idx - cols);
                if (e.key === 'ArrowDown') ni = Math.min(items.length - 1, selected.idx + cols);
                selectItem(currentPage, ni);
                return;
            }
            if (e.key === 'Enter' && selected) {
                e.preventDefault();
                const item = getSelectedItem();
                if (!item) return;
                if (isEditMode) {
                    if (item.type === 'app') openAppModal(selected.loc, selected.idx);
                    else cycleSelectedSize();
                } else if (item.type === 'app' && isSafeUrl(item.url)) {
                    if (item.newTab) window.open(item.url, '_blank', 'noopener');
                    else window.location.href = item.url;
                }
                return;
            }
            if ((e.key === 'Backspace' || e.key === 'Delete') && isEditMode && selected) {
                e.preventDefault(); deleteSelectedItem();
            }
        });

        /* =========================================================
           11. モーダル・検索・時計
        ========================================================= */
        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        function addWidget(widgetType, size) {
            const prev = captureRects(); pushUndo();
            const wObj = { type: 'widget', widgetType, size, id: `w_${widgetType}_${Date.now()}` };
            if (widgetType === 'weather') { wObj.city = 'TOKYO'; wObj.lat = 35.6762; wObj.lon = 139.6503; }
            state.pages[currentPage].items.unshift(wObj);
            saveState(); renderAll(prev); closeModal('addModal');
        }

        let editRef = null, pickedIcon = 'web';
        function buildIconPicker(activeKey) {
            const box = document.getElementById('iconPicker'); box.innerHTML = '';
            Object.keys(GLYPHS).forEach(k => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'ip-btn' + (k === activeKey ? ' active' : '');
                b.innerHTML = GLYPHS[k]; b.title = k;
                b.onclick = () => {
                    pickedIcon = k;
                    box.querySelectorAll('.ip-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                box.appendChild(b);
            });
        }
        function openAppModal(loc = null, idx = -1) {
            editRef = loc !== null ? { loc, idx } : null;
            const app = editRef ? (loc === 'dock' ? state.dock : state.pages[loc].items)[idx] : { name: '', url: 'https://', icon: 'web', newTab: false };
            document.getElementById('appModalTitle').textContent = editRef ? 'EDIT APP' : 'NEW APP';
            document.getElementById('fName').value = app.name;
            document.getElementById('fUrl').value = app.url;
            document.getElementById('fNewTab').checked = !!app.newTab;
            pickedIcon = app.icon || 'web'; buildIconPicker(pickedIcon);

            const sel = document.getElementById('fTarget'); sel.innerHTML = '';
            state.pages.forEach((p, i) => {
                const o = document.createElement('option'); o.value = String(i); o.textContent = p.title || `PAGE ${i + 1}`;
                sel.appendChild(o);
            });
            const dOpt = document.createElement('option'); dOpt.value = 'dock'; dOpt.textContent = 'BOTTOM DOCK';
            sel.appendChild(dOpt); sel.value = editRef ? String(loc) : String(currentPage);
            openModal('appModal');
        }
        function saveAppModal() {
            const name = document.getElementById('fName').value.trim(), url = document.getElementById('fUrl').value.trim();
            const newTab = document.getElementById('fNewTab').checked, rawTarget = document.getElementById('fTarget').value;
            const dest = rawTarget === 'dock' ? 'dock' : Number(rawTarget);
            if (!name || !url) { alert('名前とURLを入力してください'); return; }
            const prev = captureRects(); pushUndo();
            const obj = { type: 'app', name, url, icon: pickedIcon, newTab, _uid: editRef ? (editRef.loc === 'dock' ? state.dock : state.pages[editRef.loc].items)[editRef.idx]._uid : 'u_' + (uidCounter++) };
            if (editRef) {
                const srcArr = editRef.loc === 'dock' ? state.dock : state.pages[editRef.loc].items;
                if (editRef.loc === dest) srcArr[editRef.idx] = obj;
                else { srcArr.splice(editRef.idx, 1); (dest === 'dock' ? state.dock : state.pages[dest].items).push(obj); }
            } else (dest === 'dock' ? state.dock : state.pages[dest].items).push(obj);
            saveState(); renderAll(prev); closeModal('appModal');
        }
        function exportJson() {
            const data = JSON.stringify(state, null, 2);
            navigator.clipboard?.writeText(data).then(() => alert('クリップボードにコピーしました。'), () => prompt('コピーしてください:', data));
        }
        function importJson() {
            const raw = prompt('書き出したJSONデータを貼り付けてください:');
            if (!raw) return;
            try {
                const parsed = JSON.parse(raw);
                if (!parsed.pages || !parsed.dock) throw new Error();
                pushUndo(); state = { ...structuredClone(DEFAULT_APPEARANCE), ...parsed }; ensureUids();
                saveState(); applyTheme(); renderAll(); closeModal('themeModal');
            } catch (e) { alert('無効なJSONデータです'); }
        }
        function resetAll() {
            if (!confirm('全設定と配置を初期状態に戻しますか？')) return;
            pushUndo(); state = structuredClone(DEFAULT_STATE); ensureUids(); saveState();
            currentPage = 0; selected = null; applyTheme(); renderAll(); closeModal('themeModal');
        }

        function openSearch() {
            openModal('searchModal');
            const inp = document.getElementById('searchInput'); inp.value = ''; renderSearch('');
            setTimeout(() => inp.focus(), 50);
        }
        function renderSearch(q) {
            const list = document.getElementById('searchList'); list.innerHTML = '';
            const query = q.trim().toLowerCase();
            const apps = [...state.dock, ...state.pages.flatMap(p => p.items).filter(x => x.type === 'app')];
            const seen = new Set();
            const matches = apps.filter(a => {
                if (seen.has(a.name)) return false;
                seen.add(a.name);
                return !query || a.name.toLowerCase().includes(query) || a.url.toLowerCase().includes(query);
            }).slice(0, 8);
            matches.forEach(a => {
                const row = document.createElement('a'); row.className = 'search-row';
                row.href = isSafeUrl(a.url) ? a.url : '#';
                if (a.newTab) { row.target = '_blank'; row.rel = 'noopener'; }
                row.onclick = () => closeModal('searchModal');
                row.innerHTML = `${GLYPHS[a.icon] || GLYPHS.web}<span style="font-weight:700; flex:1;">${escapeHtml(a.name)}</span><span class="mono" style="font-size:0.72rem; color:var(--muted);">${escapeHtml(a.url)}</span>`;
                list.appendChild(row);
            });
            if (query) {
                const row = document.createElement('a'); row.className = 'search-row';
                row.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`; row.target = '_blank';
                row.onclick = () => closeModal('searchModal');
                row.innerHTML = `${GLYPHS.google}<span style="font-weight:700;">Google で「${escapeHtml(q)}」を検索</span>`;
                list.appendChild(row);
            }
        }
        document.getElementById('searchInput').addEventListener('input', e => renderSearch(e.target.value));
        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.querySelector('#searchList .search-row')?.click();
        });

        function updateClocks() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            const hh = String(h).padStart(2, '0'), mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
            document.querySelectorAll('.js-clk-time').forEach(el => el.textContent = `${hh}:${mm}:${ss}`);
            document.querySelectorAll('.js-clk-date').forEach(el => el.textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }));
            document.querySelectorAll('.js-clk-short').forEach(el => el.textContent = now.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' }));
            const hd = (h % 12 + m / 60) * 30, md = (m + s / 60) * 6, sd = s * 6;
            document.querySelectorAll('.js-h-hand').forEach(el => el.setAttribute('transform', `rotate(${hd} 50 50)`));
            document.querySelectorAll('.js-m-hand').forEach(el => el.setAttribute('transform', `rotate(${md} 50 50)`));
            document.querySelectorAll('.js-s-hand').forEach(el => el.setAttribute('transform', `rotate(${sd} 50 50)`));
        }
        setInterval(updateClocks, 1000);

        applyTheme();
        renderAll();
    </script>
</body>
</html>
