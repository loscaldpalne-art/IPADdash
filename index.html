.modal-bg.open .modal-panel{transform:translateY(0) scale(1)}
.modal-panel h3{font-size:.92rem;font-weight:800;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between}
.field input[type="text"],.field select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:9px 11px;font-size:.88rem;outline:none}.field input[type="text"]:focus,.field select:focus{border-color:var(--accent)}
.field input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer}.field input[type="color"]{width:44px;height:34px;border:1px solid var(--border);background:var(--bg);padding:2px;cursor:pointer}
.icon-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-height:200px;overflow-y:auto;padding:2px}
.ip-btn{aspect-ratio:1;background:var(--bg);border:1px solid var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:8px}.ip-btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.ip-btn svg{width:100%;height:100%}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.theme-btn{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:9px 10px;text-align:left;cursor:pointer;transition:border-color .15s}.theme-btn:hover{border-color:var(--border-strong)}.theme-btn.active{border-color:var(--accent);background:var(--surface-alt)}.theme-btn strong{display:block;font-size:.8rem}.theme-btn span{font-size:.68rem;color:var(--muted)}
.seg-row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.seg-row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.swatch-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.color-dot{width:28px;height:28px;border:1px solid var(--border-strong);cursor:pointer}
.grad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grad-chip{height:40px;border:1px solid var(--border);cursor:pointer}.grad-chip.active{outline:2px solid var(--accent);outline-offset:-2px}
.city-chips{display:flex;flex-wrap:wrap;gap:6px}
.search-modal{align-items:flex-start;padding-top:10vh}.search-box{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-lift)}
.search-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}.search-head input{flex:1;background:transparent;border:none;color:var(--fg);font-size:1rem;outline:none}
.search-list{max-height:48vh;overflow-y:auto}.search-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--fg);cursor:pointer}.search-row:hover{background:var(--surface-alt)}.search-row svg{width:20px;height:20px;flex-shrink:0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:8px 14px;font-size:.78rem;font-weight:700;display:none;align-items:center;gap:12px;z-index:300;box-shadow:var(--shadow-lift)}.toast.show{display:flex}
@media (max-width:720px){.top-bar{padding:max(26px,env(safe-area-inset-top,26px)) 12px 5px}.page-pane{padding:12px}.bento-grid{--cols:4;--gap:9px}.tile.sz-6x2,.tile.sz-4x2,.tile.sz-3x2,.tile.sz-6x1,.tile.sz-4x1,.tile.sz-3x1{grid-column:span 4}}
</style>
</head>
<body data-theme="obsidian">

<div class="bg-layer bg-wallpaper" id="bgWallpaper"></div>
<canvas class="bg-layer bg-canvas hidden" id="bgCanvas"></canvas>
<div class="bg-layer bg-grid-lines" id="bgGridLines"></div>

<!-- 画面を自由に泳ぐ 3D多角形(6〜20角形)ペット + 水面波紋 -->
<canvas class="pet-overlay-canvas" id="petCanvas"></canvas>
<div class="pet-hitbox" id="petHit" title="タップで起こす / ドラッグで移動"></div>

<div class="os-shell" id="osShell">
    <header class="top-bar">
        <div class="page-tabs" id="pageTabs"></div>
        <div class="top-actions">
            <button class="btn-sharp mono" onclick="openSearch()">SEARCH [/]</button>
            <button class="btn-sharp mono" onclick="openThemeModal()">THEME</button>
            <button class="btn-sharp mono" id="editBtn" onclick="toggleEditMode()">EDIT [E]</button>
        </div>
    </header>

    <div class="edit-inspector">
        <div class="inspector-left mono" id="selInfo">SELECT A TILE (OR USE ARROWS)</div>
        <div class="inspector-controls">
            <button class="btn-sharp" onclick="moveSelected(-1)">◀ 前へ</button>
            <button class="btn-sharp" onclick="moveSelected(1)">次へ ▶</button>
            <button class="btn-sharp" id="btnResize" style="display:none" onclick="cycleSelectedSize()">サイズ変更</button>
            <button class="btn-sharp" id="btnEditSel" onclick="editSelectedItem()">設定</button>
            <button class="btn-sharp danger" onclick="deleteSelectedItem()">削除</button>
            <button class="btn-sharp" id="btnUndo" onclick="undoAction()" style="display:none">元に戻す</button>
            <button class="btn-sharp primary" onclick="openModal('addModal')">＋ 追加 [N]</button>
            <button class="btn-sharp" onclick="addPage()">＋ ページ</button>
            <button class="btn-sharp primary" onclick="toggleEditMode(false)">完了 [Esc]</button>
        </div>
    </div>

    <main class="pages-track" id="pagesTrack"></main>
    <footer class="dock-wrap"><nav class="dock-bar" id="dockBar"></nav></footer>
</div>

<div class="toast mono" id="undoToast"><span id="toastMsg">UPDATED</span><button class="btn-sharp" style="padding:3px 8px" onclick="undoAction()">UNDO</button></div>

<!-- 追加モーダル -->
<div class="modal-bg" id="addModal" onclick="if(event.target===this)closeModal('addModal')">
    <div class="modal-panel">
        <h3 class="mono">ADD TO GRID</h3>
        <button class="btn-sharp primary" style="justify-content:center;padding:11px" onclick="closeModal('addModal');openAppModal()">＋ 新しいアプリアイコンを追加</button>
        <div style="font-size:.74rem;color:var(--muted);font-weight:700">長方形ウィジェットパネルを追加</div>
        <div class="theme-grid">
            <button class="theme-btn" onclick="addWidget('search','6x1')"><strong>SEARCH BOX</strong><span>アプリ＆Web検索バー (6×1)</span></button>
            <button class="theme-btn" onclick="addWidget('clock','2x2')"><strong>DIGITAL CLOCK</strong><span>拡大対応の大型時計 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('analog','2x2')"><strong>ANALOG CLOCK</strong><span>洗練された丸型時計 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('progress','2x2')"><strong>TIME PROGRESS</strong><span>年/月/日/時の進行度％ (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('weather','2x2')"><strong>WEATHER</strong><span>場所選択・グラフ・降水確率 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('genart','2x2')"><strong>GEN-ART</strong><span>6種の高速変形幾何学 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('audio','2x2')"><strong>AUDIO DECK</strong><span>丸型レコード＋ビート演奏 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('calc','2x2')"><strong>CALCULATOR</strong><span>ミニマル電卓 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('timer','2x2')"><strong>TIMER</strong><span>バックグラウンド対応 (2×2)</span></button>
            <button class="theme-btn" onclick="addWidget('note','3x2')"><strong>NOTES</strong><span>自動保存メモパッド (3×2)</span></button>
            <button class="theme-btn" onclick="addWidget('todo','3x2')"><strong>TODO</strong><span>チェック式タスク管理 (3×2)</span></button>
            <button class="theme-btn" onclick="addWidget('schedule','4x2')"><strong>TIMETABLE</strong><span>1〜6限の時間割 (4×2)</span></button>
        </div>
        <button class="btn-sharp" style="justify-content:center" onclick="closeModal('addModal')">閉じる</button>
    </div>
</div>

<!-- 進行度設定モーダル -->
<div class="modal-bg" id="progModal" onclick="if(event.target===this)closeModal('progModal')">
    <div class="modal-panel">
        <h3 class="mono">PROGRESS SETTINGS</h3>
        <div class="field">
            <label>表示する単位（複数選択）</label>
            <div class="city-chips">
                <button class="btn-sharp prog-u-btn" data-u="year" onclick="toggleProgUnit('year')">YEAR (1年)</button>
                <button class="btn-sharp prog-u-btn" data-u="month" onclick="toggleProgUnit('month')">MONTH (1ヶ月)</button>
                <button class="btn-sharp prog-u-btn" data-u="week" onclick="toggleProgUnit('week')">WEEK (1週間)</button>
                <button class="btn-sharp prog-u-btn" data-u="day" onclick="toggleProgUnit('day')">DAY (1日)</button>
                <button class="btn-sharp prog-u-btn" data-u="hour" onclick="toggleProgUnit('hour')">HOUR (1時間)</button>
            </div>
        </div>
        <div class="field">
            <label>小数点の桁数</label>
            <select id="fProgDec" onchange="setProgCfg('decimals',Number(this.value))">
                <option value="0">整数 (例: 42%)</option>
                <option value="1">小数1桁 (例: 42.3%)</option>
                <option value="2">小数2桁 (例: 42.38%)</option>
                <option value="4">小数4桁 (例: 42.3812%)</option>
            </select>
        </div>
        <div class="field">
            <label>バーの見た目</label>
            <div class="seg-row">
                <button class="theme-btn" id="pStyleBar" onclick="setProgCfg('style','bar')"><strong>LINE BAR</strong><span>滑らかな進行ライン</span></button>
                <button class="theme-btn" id="pStyleBlk" onclick="setProgCfg('style','blocks')"><strong>12 BLOCKS</strong><span>12分割の目盛り</span></button>
            </div>
        </div>
        <button class="btn-sharp primary" style="justify-content:center" onclick="closeModal('progModal')">完了</button>
    </div>
</div>

<!-- 天気場所選択モーダル -->
<div class="modal-bg" id="cityModal" onclick="if(event.target===this)closeModal('cityModal')">
    <div class="modal-panel">
        <h3 class="mono">WEATHER LOCATION</h3>
        <div class="field">
            <label>よく使う都市</label>
            <div class="city-chips">
                <button class="btn-sharp" onclick="selectWeatherCity('TOKYO',35.6762,139.6503)">東京</button>
                <button class="btn-sharp" onclick="selectWeatherCity('OSAKA',34.6937,135.5023)">大阪</button>
                <button class="btn-sharp" onclick="selectWeatherCity('NAGOYA',35.1815,136.9066)">名古屋</button>
                <button class="btn-sharp" onclick="selectWeatherCity('YOKOHAMA',35.4437,139.6380)">横浜</button>
                <button class="btn-sharp" onclick="selectWeatherCity('KYOTO',35.0116,135.7681)">京都</button>
                <button class="btn-sharp" onclick="selectWeatherCity('FUKUOKA',33.5902,130.4017)">福岡</button>
                <button class="btn-sharp" onclick="selectWeatherCity('SAPPORO',43.0618,141.3545)">札幌</button>
                <button class="btn-sharp" onclick="selectWeatherCity('NAHA',26.2124,127.6809)">那覇</button>
            </div>
        </div>
        <div class="field"><label>都市名検索</label><div style="display:flex;gap:6px"><input type="text" id="cityQueryInput" style="flex:1" placeholder="例：渋谷, London..." onkeydown="if(event.key==='Enter')searchCityGeo()"><button class="btn-sharp primary" onclick="searchCityGeo()">検索</button></div></div>
        <div id="citySearchResults" style="display:flex;flex-direction:column;gap:5px"></div>
        <button class="btn-sharp" style="justify-content:center" onclick="useGpsWeather()">現在地（GPS）を取得</button>
        <button class="btn-sharp" style="justify-content:center" onclick="closeModal('cityModal')">閉じる</button>
    </div>
</div>

<!-- 内蔵電卓アプリモーダル -->
<div class="modal-bg" id="calcAppModal" onclick="if(event.target===this)closeModal('calcAppModal')">
    <div class="modal-panel" style="max-width:340px">
        <h3 class="mono"><span>CALCULATOR // INTERNAL</span><button class="btn-sharp" onclick="closeModal('calcAppModal')">✕</button></h3>
        <div id="appCalcScreen" class="calc-screen mono" style="font-size:1.8rem;padding:12px">0</div>
        <div id="appCalcGrid" class="calc-keys" style="height:260px;gap:6px"></div>
    </div>
</div>

<!-- 内蔵ボイスメモアプリモーダル -->
<div class="modal-bg" id="voiceAppModal" onclick="if(event.target===this)closeModal('voiceAppModal')">
    <div class="modal-panel" style="max-width:420px">
        <h3 class="mono"><span>VOICE MEMO // INTERNAL</span><button class="btn-sharp" onclick="closeModal('voiceAppModal')">✕</button></h3>
        <div class="canvas-stage" style="height:90px"><canvas id="voiceWaveCanvas"></canvas></div>
        <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="mono" id="voiceTimer" style="font-size:1.4rem;font-weight:800">00:00</span>
            <button class="btn-sharp primary mono" id="voiceRecBtn" onclick="toggleVoiceRec()">REC START</button>
        </div>
        <div id="voiceClipsList" style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto"></div>
        <div style="font-size:.7rem;color:var(--muted)">※マイクはHTTPSまたはlocalhost（a-Shellローカルサーバー等）で動作します。</div>
    </div>
</div>

<!-- アプリ設定モーダル -->
<div class="modal-bg" id="appModal" onclick="if(event.target===this)closeModal('appModal')">
    <div class="modal-panel">
        <h3 class="mono" id="appModalTitle">APP CONFIG</h3>
        <div class="field"><label>表示名</label><input type="text" id="fName" placeholder="例：Notion"></div>
        <div class="field"><label>URL（電卓: internal://calc / ボイスメモ: internal://voicememo）</label><input type="text" id="fUrl" placeholder="https://..."></div>
        <div class="field"><label>アイコンを選択</label><div class="icon-picker" id="iconPicker"></div></div>
        <div class="field"><label>配置先</label><select id="fTarget"></select></div>
        <div style="display:flex;align-items:center;gap:8px;font-size:.82rem"><input type="checkbox" id="fNewTab"><label for="fNewTab" style="cursor:pointer">別タブで開く（Web向け）</label></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px"><button class="btn-sharp" onclick="closeModal('appModal')">キャンセル</button><button class="btn-sharp primary" onclick="saveAppModal()">保存</button></div>
    </div>
</div>

<!-- テーマ・ガラス・背景・ペット設定モーダル -->
<div class="modal-bg" id="themeModal" onclick="if(event.target===this)closeModal('themeModal')">
    <div class="modal-panel">
        <h3 class="mono">THEME / GLASS / BACKGROUND</h3>
        <div class="field">
            <label>統一カラーテーマ</label>
            <div class="theme-grid">
                <button class="theme-btn" data-t="obsidian" onclick="setTheme('obsidian')"><strong>OBSIDIAN</strong><span>黒基調 × 純白</span></button>
                <button class="theme-btn" data-t="paper" onclick="setTheme('paper')"><strong>PAPER</strong><span>白基調 × 墨黒</span></button>
                <button class="theme-btn" data-t="orange" onclick="setTheme('orange')"><strong>INDUSTRIAL</strong><span>ダーク × オレンジ</span></button>
                <button class="theme-btn" data-t="blueprint" onclick="setTheme('blueprint')"><strong>BLUEPRINT</strong><span>濃紺 × シアン</span></button>
                <button class="theme-btn" data-t="terminal" onclick="setTheme('terminal')"><strong>TERMINAL</strong><span>黒緑 × ミント</span></button>
            </div>
        </div>
        <div class="field">
            <label>SURFACE STYLE（タイルの質感）</label>
            <div class="seg-row">
                <button class="theme-btn" id="btnSolidMode" onclick="setGlassMode(false)"><strong>SOLID (デフォルト)</strong><span>ソリッドな黒</span></button>
                <button class="theme-btn" id="btnGlassMode" onclick="setGlassMode(true)"><strong>CLEAR GLASS</strong><span>背景が透けるガラス</span></button>
            </div>
        </div>
        <div id="glassControls" style="display:none;flex-direction:column;gap:10px;border:1px solid var(--border);padding:12px;background:var(--bg)">
            <div class="field"><label><span>透明度</span><span class="mono" id="lblGlassOp">18%</span></label><input type="range" id="rngGlassOp" min="6" max="75" value="18" oninput="updateGlass('glassOpacity',this.value/100)"></div>
            <div class="field"><label><span>ぼかし強度</span><span class="mono" id="lblGlassBlur">18px</span></label><input type="range" id="rngGlassBlur" min="0" max="32" value="18" oninput="updateGlass('glassBlur',Number(this.value))"></div>
            <div class="field"><label>ガラスの色</label><div class="swatch-row"><input type="color" id="inpGlassColor" value="#ffffff" oninput="updateGlass('glassColor',this.value)"><div class="color-dot" style="background:#fff" onclick="setGlassColor('#ffffff')"></div><div class="color-dot" style="background:#000" onclick="setGlassColor('#000000')"></div><div class="color-dot" style="background:#38bdf8" onclick="setGlassColor('#38bdf8')"></div><div class="color-dot" style="background:#a855f7" onclick="setGlassColor('#a855f7')"></div><div class="color-dot" style="background:#f43f5e" onclick="setGlassColor('#f43f5e')"></div><div class="color-dot" style="background:#4ade80" onclick="setGlassColor('#4ade80')"></div></div></div>
        </div>
        <div class="field">
            <label>BACKGROUND（背景＆ライブCanvasアニメーション）</label>
            <div class="seg-row-4">
                <button class="btn-sharp" id="bgBtnDefault" style="justify-content:center" onclick="setBgMode('default')">標準(黒)</button>
                <button class="btn-sharp" id="bgBtnColor" style="justify-content:center" onclick="setBgMode('color')">単色</button>
                <button class="btn-sharp" id="bgBtnGrad" style="justify-content:center" onclick="setBgMode('gradient')">グラデ</button>
                <button class="btn-sharp" id="bgBtnImage" style="justify-content:center" onclick="setBgMode('image')">画像</button>
            </div>
            <div class="seg-row-4" style="grid-template-columns:repeat(3,1fr);margin-top:4px">
                <button class="btn-sharp" id="bgBtnAurora" style="justify-content:center" onclick="setBgMode('aurora')">AURORA (動く)</button>
                <button class="btn-sharp" id="bgBtnRipple" style="justify-content:center" onclick="setBgMode('ripple')">RIPPLE (波紋)</button>
                <button class="btn-sharp" id="bgBtnGeo" style="justify-content:center" onclick="setBgMode('geoflow')">GEO (幾何学)</button>
            </div>
        </div>
        <div id="bgColorBox" style="display:none" class="field"><label>背景カラー</label><div class="swatch-row"><input type="color" id="inpBgColor" value="#09090b" oninput="setCustomBgColor(this.value)"><div class="color-dot" style="background:#09090b" onclick="setCustomBgColor('#09090b')"></div><div class="color-dot" style="background:#0f172a" onclick="setCustomBgColor('#0f172a')"></div><div class="color-dot" style="background:#1e1b4b" onclick="setCustomBgColor('#1e1b4b')"></div><div class="color-dot" style="background:#064e3b" onclick="setCustomBgColor('#064e3b')"></div><div class="color-dot" style="background:#dcdcd6" onclick="setCustomBgColor('#dcdcd6')"></div></div></div>
        <div id="bgGradBox" style="display:none" class="field"><label>グラデーション</label><div class="grad-grid" id="gradGrid"></div></div>
        <div id="bgImageBox" style="display:none" class="field"><label>画像URL / 写真</label><div style="display:flex;gap:6px"><input type="text" id="inpBgImgUrl" style="flex:1" placeholder="https://..."><button class="btn-sharp primary" onclick="setBgImageUrl()">適用</button></div><input type="file" accept="image/*" style="margin-top:4px" onchange="uploadBgImage(event)"></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:.8rem">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="chkBgGrid" onchange="toggleBgGrid(this.checked)">背景の方眼グリッド線を表示する</label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="chkPetOn" onchange="togglePetEnabled(this.checked)">3D変形・幾何学ペットを表示する</label>
        </div>
        <div class="field">
            <label><span>ペットの星角数 (6〜20 / 自動変形)</span><span class="mono" id="lblPetN">AUTO</span></label>
            <div style="display:flex;gap:6px;align-items:center">
                <button class="btn-sharp" id="btnPetAuto" onclick="setPetPoints(0)">AUTO (6〜20)</button>
                <input type="range" id="rngPetN" min="6" max="20" value="8" style="flex:1" oninput="setPetPoints(Number(this.value))">
            </div>
        </div>
        <div class="field"><label>列数</label><select id="fCols" onchange="setCols(this.value)"><option value="5">5列</option><option value="6">6列（標準）</option><option value="8">8列（高密度）</option></select></div>
        <div class="field"><label>バックアップ (JSON)</label><div style="display:flex;gap:6px"><button class="btn-sharp" style="flex:1;justify-content:center" onclick="exportJson()">コピー</button><button class="btn-sharp" style="flex:1;justify-content:center" onclick="importJson()">復元</button></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px"><button class="btn-sharp danger" onclick="resetAll()">初期化</button><button class="btn-sharp primary" onclick="closeModal('themeModal')">閉じる</button></div>
    </div>
</div>

<!-- クイック検索モーダル -->
<div class="modal-bg search-modal" id="searchModal" onclick="if(event.target===this)closeModal('searchModal')">
    <div class="search-box">
        <div class="search-head"><span class="mono" style="font-size:.78rem;color:var(--muted)">CMD+K</span><input type="text" id="searchInput" placeholder="アプリを検索 / Google検索..." autocomplete="off"></div>
        <div class="search-list" id="searchList"></div>
    </div>
</div>

<script>
const wrapSvg=(b,e='fill="none" stroke="currentColor" stroke-width="1.8"')=>`<svg viewBox="0 0 24 24" ${e}>${b}</svg>`;

function captureRects(){const m=new Map();document.querySelectorAll('.tile[data-uid]').forEach(el=>m.set(el.dataset.uid,el.getBoundingClientRect()));return m}
function playFlip(prev){
  if(!prev||!prev.size)return;
  document.querySelectorAll('.tile[data-uid]').forEach(el=>{
    const f=prev.get(el.dataset.uid);if(!f)return;const l=el.getBoundingClientRect(),dx=f.left-l.left,dy=f.top-l.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;el.getBoundingClientRect();
    requestAnimationFrame(()=>{el.style.transition='transform .34s cubic-bezier(.22,1,.36,1)';el.style.transform='';setTimeout(()=>{el.style.transition=''},360)});
  });
}

const petCanvas=document.getElementById('petCanvas'),petCtx=petCanvas.getContext('2d'),petHit=document.getElementById('petHit');
let pet={
  x:180,y:160,vx:.45,vy:.28,spin:0,rx:0.35,ry:0.2,
  n:8,targetN:8,morphAmt:1,morphDir:0,
  ripples:[],wake:0,idleSec:0,sleepLevel:0,blink:0,nextBlink:140,
  dragging:false,lx:0,ly:0,sx:0,sy:0,moved:false,stepDist:0,
  zzz:[],lastMorphTime:0
};
const SATELLITES=[
  {r:28,spd:.024,tx:.95,ty:.35,ph:0,sz:2.6,kind:'dot'},
  {r:36,spd:-.017,tx:-.75,ty:1.1,ph:2.1,sz:3.2,kind:'diamond'},
  {r:44,spd:.012,tx:.35,ty:-1.25,ph:4.2,sz:2.2,kind:'ring'}
];

function resizePetCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  petCanvas.width=Math.round(window.innerWidth*dpr);petCanvas.height=Math.round(window.innerHeight*dpr);
  petCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resizePetCanvas);resizePetCanvas();

function spawnPetRipple(x,y,maxR=48,alpha=.55){pet.ripples.push({x,y,r:6,maxR,a:alpha})}
function triggerPetMorph(newN){
  const n=newN||Math.floor(6+Math.random()*15); // 6〜20
  if(n===pet.n&&pet.morphDir===0)return;
  pet.targetN=n;pet.morphDir=-1;
}
function wakeAndMovePet(){
  pet.wake=1;pet.idleSec=0;pet.sleepLevel=0;
  spawnPetRipple(pet.x,pet.y,95,.85);spawnPetRipple(pet.x,pet.y,55,.65);
  if(!state.petPoints)triggerPetMorph();
  const angle=Math.random()*Math.PI*2,spd=6.5+Math.random()*3;
  pet.vx=Math.cos(angle)*spd;pet.vy=Math.sin(angle)*spd;
}

petHit.addEventListener('pointerdown',e=>{
  e.stopPropagation();pet.dragging=true;pet.moved=false;pet.idleSec=0;pet.sleepLevel=0;pet.wake=.8;
  pet.sx=pet.lx=e.clientX;pet.sy=pet.ly=e.clientY;petHit.setPointerCapture(e.pointerId);
});
petHit.addEventListener('pointermove',e=>{
  if(!pet.dragging)return;
  if(Math.hypot(e.clientX-pet.sx,e.clientY-pet.sy)>6)pet.moved=true;
  pet.vx=(e.clientX-pet.lx)*.5;pet.vy=(e.clientY-pet.ly)*.5;
  pet.x=e.clientX;pet.y=e.clientY;pet.lx=e.clientX;pet.ly=e.clientY;
  if(Math.random()<.45)spawnPetRipple(pet.x,pet.y,54,.55);
});
petHit.addEventListener('pointerup',()=>{if(!pet.dragging)return;pet.dragging=false;if(!pet.moved)wakeAndMovePet()});
petHit.addEventListener('pointercancel',()=>{pet.dragging=false});

function proj3D(vx,vy,vz,rx,ry){
  // Rotate X
  const y1=vy*Math.cos(rx)-vz*Math.sin(rx),z1=vy*Math.sin(rx)+vz*Math.cos(rx);
  // Rotate Y
  const x2=vx*Math.cos(ry)+z1*Math.sin(ry),z2=-vx*Math.sin(ry)+z1*Math.cos(ry);
  const f=200,sc=f/(f-z2);
  return {x:x2*sc,y:y1*sc,z:z2,sc};
}

function draw3DPet(ctx,t,acc,fg){
  // 3D衛星の座標計算
  const sats=SATELLITES.map(s=>{
    const a=t*0.001*s.spd*40+s.ph;
    const lx=Math.cos(a)*s.r,ly=Math.sin(a)*s.r,lz=0;
    const p=proj3D(lx,ly,lz,s.tx+pet.rx*.5,s.ty+pet.ry*.5);
    return {...s,...p};
  });

  const drawSat=s=>{
    ctx.save();ctx.translate(pet.x+s.x,pet.y+s.y);
    const sz=s.sz*s.sc;ctx.globalAlpha=(s.z<0?.35:.85)*(1-pet.sleepLevel*.35);
    ctx.strokeStyle=fg;ctx.fillStyle=acc;ctx.lineWidth=1.1;
    if(s.kind==='dot'){ctx.beginPath();ctx.arc(0,0,sz,0,Math.PI*2);ctx.fill()}
    else if(s.kind==='diamond'){ctx.rotate(t*.002);ctx.fillRect(-sz,-sz,sz*2,sz*2)}
    else{ctx.beginPath();ctx.arc(0,0,sz*1.3,0,Math.PI*2);ctx.stroke()}
    ctx.restore();
  };

  // 奥の衛星を描画
  sats.filter(s=>s.z<0).forEach(drawSat);

  // 3D星形多面体本体
  const R=16*(1+pet.wake*.16+Math.sin(t*.003)*.04);
  const spikeRatio=0.45+0.48*(1-pet.morphAmt); // morphAmt 1->トゲ深い, 0->円に近づく
  const rIn=R*spikeRatio,Z=R*0.62;
  const pts=pet.n*2,rim=[];
  for(let i=0;i<pts;i++){
    const a=(i/pts)*Math.PI*2+pet.spin,rad=(i%2===0)?R:rIn;
    rim.push(proj3D(Math.cos(a)*rad,Math.sin(a)*rad,0,pet.rx,pet.ry));
  }
  const apexF=proj3D(0,0,Z,pet.rx,pet.ry),apexB=proj3D(0,0,-Z,pet.rx,pet.ry);

  ctx.save();ctx.translate(pet.x,pet.y);
  ctx.globalAlpha=.84-pet.sleepLevel*.28+pet.wake*.16;

  // 背面頂点へのエッジ（奥行き）
  ctx.strokeStyle=fg;ctx.lineWidth=.75;ctx.globalAlpha*=.35;
  ctx.beginPath();
  rim.forEach(p=>{ctx.moveTo(apexB.x,apexB.y);ctx.lineTo(p.x,p.y)});
  ctx.stroke();

  // 前面の半透明ファセットとエッジ
  ctx.globalAlpha=.88-pet.sleepLevel*.25;
  for(let i=0;i<pts;i++){
    const p1=rim[i],p2=rim[(i+1)%pts];
    ctx.fillStyle=(i%2===0)?'rgba(255,255,255,0.08)':'rgba(255,255,255,0.02)';
    ctx.beginPath();ctx.moveTo(apexF.x,apexF.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.closePath();ctx.fill();
  }
  // 外周輪郭＆前面稜線
  ctx.strokeStyle=fg;ctx.lineWidth=1.35;
  ctx.beginPath();rim.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
  ctx.strokeStyle=acc;ctx.lineWidth=1.0;
  ctx.beginPath();rim.forEach((p,i)=>{if(i%2===0){ctx.moveTo(apexF.x,apexF.y);ctx.lineTo(p.x,p.y)}});ctx.stroke();

  // 縦線2本の可愛い目（移動方向や指をチラ見、瞬き・眠気・音楽ダンス対応）
  const lookX=Math.max(-3,Math.min(3,pet.vx*1.5+(ptr.x*window.innerWidth-pet.x)*.008));
  const lookY=Math.max(-2.5,Math.min(2.5,pet.vy*1.5+(ptr.y*window.innerHeight-pet.y)*.008));
  const ex=apexF.x*.45+lookX,ey=apexF.y*.45+lookY;
  const eyeGap=3.4;

  ctx.save();ctx.translate(ex,ey);
  // 目のバックプレート（視認性確保用）
  ctx.fillStyle='rgba(9,9,11,0.55)';
  ctx.beginPath();ctx.arc(0,0,7.2,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#ffffff';ctx.lineCap='round';
  if(pet.sleepLevel>0.85){
    // すやすや寝顔（- -）
    ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(-eyeGap-1.5,0);ctx.quadraticCurveTo(-eyeGap,1.4,-eyeGap+1.5,0);
    ctx.moveTo(eyeGap-1.5,0);ctx.quadraticCurveTo(eyeGap,1.4,eyeGap+1.5,0);
    ctx.stroke();
  }else if(isPlaying&&Math.sin(t*.004)>.2){
    // 音楽に合わせてご機嫌アーチ（^ ^）
    ctx.lineWidth=1.7;
    ctx.beginPath();
    ctx.moveTo(-eyeGap-1.6,1);ctx.quadraticCurveTo(-eyeGap,-2.2,-eyeGap+1.6,1);
    ctx.moveTo(eyeGap-1.6,1);ctx.quadraticCurveTo(eyeGap,-2.2,eyeGap+1.6,1);
    ctx.stroke();
  }else{
    // 縦線2本の目（瞬き＆眠気トロン対応）
    const openH=(1-pet.blink)*(1-pet.sleepLevel*.65)*(4.4+pet.wake*1.6);
    const h=Math.max(0.4,openH);
    ctx.lineWidth=1.9;
    ctx.beginPath();
    ctx.moveTo(-eyeGap,-h/2);ctx.lineTo(-eyeGap,h/2);
    ctx.moveTo(eyeGap,-h/2);ctx.lineTo(eyeGap,h/2);
    ctx.stroke();
  }
  ctx.restore();

  // 居眠りZ粒子
  if(pet.sleepLevel>0.82&&Math.random()<.03){
    pet.zzz.push({x:8,y:-12,vy:-.28,a:1,s:1});
  }
  pet.zzz=pet.zzz.filter(z=>z.a>.03);
  pet.zzz.forEach(z=>{
    z.y+=z.vy;z.x+=Math.sin(z.y*.2)*.15;z.a*=.985;
    ctx.fillStyle=acc;ctx.globalAlpha=z.a;ctx.font='700 8px monospace';ctx.fillText('z',z.x,z.y);
  });
  ctx.restore();

  // 手前の衛星を描画
  sats.filter(s=>s.z>=0).forEach(drawSat);
}

const bgCanvas=document.getElementById('bgCanvas'),bgCtx=bgCanvas.getContext('2d');

const orbs=[
  {x:.2,y:.25,vx:.0005,vy:.0004,r:.42,c:'rgba(56,189,248,0.48)'},
  {x:.8,y:.3,vx:-.0004,vy:.0005,r:.45,c:'rgba(139,92,246,0.45)'},

const stars=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0006,vy:(Math.random()-.5)*.0006,s:1+Math.random()*2}));

function mainAnimLoop(t){
  const cs=getComputedStyle(document.body);
  const fg=cs.getPropertyValue('--fg').trim()||'#ffffff',acc=cs.getPropertyValue('--accent').trim()||'#38bdf8';

  const bm=state.bgMode;
  if(['aurora','ripple','geoflow'].includes(bm)&&bgCanvas.width&&bgCanvas.height){
    const w=bgCanvas.width,h=bgCanvas.height;bgCtx.clearRect(0,0,w,h);
    if(bm==='aurora'){
      orbs.forEach((o,i)=>{
        o.x+=o.vx+Math.sin(t*.0003+i)*.0004;o.y+=o.vy+Math.cos(t*.00025+i)*.0004;
        o.x+=(ptr.x-o.x)*.0018*(i===0?1:.3);o.y+=(ptr.y-o.y)*.0018*(i===0?1:.3);

        const g=bgCtx.createRadialGradient(o.x*w,o.y*h,0,o.x*w,o.y*h,o.r*Math.max(w,h));
        g.addColorStop(0,o.c);g.addColorStop(1,'transparent');bgCtx.fillStyle=g;bgCtx.fillRect(0,0,w,h);
      });
      bgCtx.fillStyle='rgba(255,255,255,0.45)';stars.forEach(s=>{s.x=(s.x+s.vx+1)%1;s.y=(s.y+s.vy+1)%1;bgCtx.fillRect(s.x*w,s.y*h,s.s,s.s)});
    }else if(bm==='ripple'){
      bgCtx.strokeStyle=acc;ripples=ripples.filter(r=>r.a>.02);

      ripples.forEach(r=>{r.r+=.005;r.a*=.975;bgCtx.globalAlpha=r.a;bgCtx.lineWidth=1.5;bgCtx.beginPath();bgCtx.arc(r.x*w,r.y*h,r.r*Math.max(w,h)*.6,0,Math.PI*2);bgCtx.stroke()});
      bgCtx.globalAlpha=1;
    }else{
      bgCtx.strokeStyle=acc;
      stars.forEach((s,i)=>{
        const dx=s.x-ptr.x,dy=s.y-ptr.y,d=Math.hypot(dx,dy);if(d<.18&&d>.001){s.x+=dx/d*.002;s.y+=dy/d*.002}
        s.x=(s.x+s.vx+1)%1;s.y=(s.y+s.vy+1)%1;bgCtx.globalAlpha=.45;bgCtx.fillStyle=acc;bgCtx.fillRect(s.x*w-1.5,s.y*h-1.5,3,3);
        for(let j=i+1;j<stars.length;j++){const s2=stars[j],dist=Math.hypot((s.x-s2.x)*w,(s.y-s2.y)*h);if(dist<170){bgCtx.globalAlpha=(1-dist/170)*.35;bgCtx.beginPath();bgCtx.moveTo(s.x*w,s.y*h);bgCtx.lineTo(s2.x*w,s2.y*h);bgCtx.stroke()}}
      });

    }
  }

  // ペット更新（自律移動・眠気・瞬き・6-20角形モーフィング・水面波紋）
  if(state.petEnabled!==false){
    const W=window.innerWidth,H=window.innerHeight;
    petCtx.clearRect(0,0,W,H);

    // モーフィング補間
    if(pet.morphDir===-1){
      pet.morphAmt-=.08;
      if(pet.morphAmt<=0){pet.morphAmt=0;pet.n=pet.targetN;pet.morphDir=1}
    }else if(pet.morphDir===1){
      pet.morphAmt+=.08;
      if(pet.morphAmt>=1){pet.morphAmt=1;pet.morphDir=0}
    }
    if(!state.petPoints&&t-pet.lastMorphTime>9500){pet.lastMorphTime=t;triggerPetMorph()}

    // 瞬き＆眠気
    pet.nextBlink--;
    if(pet.nextBlink<=0){pet.blink=1;pet.nextBlink=130+Math.random()*180}
    pet.blink*=.72;
    if(!pet.dragging&&pet.wake<.05){
      pet.idleSec+=.016;
      if(pet.idleSec>10)pet.sleepLevel=Math.min(1,pet.sleepLevel+.004);
    }else{pet.idleSec=0;pet.sleepLevel=Math.max(0,pet.sleepLevel-.05)}

    if(!pet.dragging){
      const spd=Math.hypot(pet.vx,pet.vy);
      const maxIdleSpd=pet.sleepLevel>.8?.15:.55;
      if(spd>maxIdleSpd){pet.vx*=.95;pet.vy*=.95}
      else{pet.vx+=Math.cos(t*.0006)*.012;pet.vy+=Math.sin(t*.0008)*.012}
      pet.x+=pet.vx;pet.y+=pet.vy;
      if(pet.x<42){pet.x=42;pet.vx=Math.abs(pet.vx)}if(pet.x>W-42){pet.x=W-42;pet.vx=-Math.abs(pet.vx)}
      if(pet.y<64){pet.y=64;pet.vy=Math.abs(pet.vy)}if(pet.y>H-92){pet.y=H-92;pet.vy=-Math.abs(pet.vy)}
      pet.stepDist+=spd;
      if(pet.stepDist>26){pet.stepDist=0;spawnPetRipple(pet.x,pet.y,44,.38)}
    }

    pet.wake*=.94;
    const spinRate=(.008+pet.wake*.05)*(1-pet.sleepLevel*.7);
    pet.spin+=spinRate;
    pet.rx=Math.sin(t*.0008)*.42+pet.vy*.08;
    pet.ry=Math.cos(t*.0007)*.42+pet.vx*.08;
    petHit.style.transform=`translate3d(${pet.x}px,${pet.y}px,0)`;

    pet.ripples=pet.ripples.filter(r=>r.a>.02);
    pet.ripples.forEach(r=>{
      r.r+=(r.maxR-r.r)*.06;r.a*=.94;
      petCtx.strokeStyle=acc;petCtx.globalAlpha=r.a;petCtx.lineWidth=1.1;
      petCtx.beginPath();petCtx.arc(r.x,r.y,r.r,0,Math.PI*2);petCtx.stroke();
    });
    petCtx.globalAlpha=1;
    draw3DPet(petCtx,t,acc,fg);
  }

  // GEN-ART ウィジェット
  document.querySelectorAll('.js-gen-cvs').forEach(c=>{
    if(c.width!==c.clientWidth||c.height!==c.clientHeight){c.width=c.clientWidth;c.height=c.clientHeight}
    const ctx=c.getContext('2d'),w=c.width,h=c.height;if(!w||!h)return;ctx.clearRect(0,0,w,h);
    const cx=w/2,cy=h/2,R=Math.min(w,h)*.38,m=genMode%6;ctx.strokeStyle=acc;ctx.lineWidth=1.35;
    if(m===0){const lobes=3+Math.round(sysBattery*5);for(let l=0;l<3;l++){ctx.globalAlpha=.85-l*.25;ctx.beginPath();for(let i=0;i<=80;i++){const a=i/80*Math.PI*2,r=R*(.72+.28*Math.sin(a*lobes+t*.0018*(l+1)));const px=cx+Math.cos(a+t*.0004*l)*r,py=cy+Math.sin(a+t*.0004*l)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.stroke()}}
    else if(m===1){for(let l=0;l<2;l++){ctx.strokeStyle=l?fg:acc;ctx.globalAlpha=l?.55:.9;ctx.beginPath();for(let i=0;i<=18;i++){const a=i/18*Math.PI*2+t*(l?-.003:.004),r=(i%2===0?R*1.05:R*.38)*(1+.15*Math.sin(t*.01+i));const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.stroke()}}
    else if(m===2){for(let l=0;l<5;l++){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.0025*(l%2?1:-1)*(l*.4+1));const s=R*(1-l*.16);ctx.globalAlpha=1-l*.15;ctx.strokeStyle=l%2?fg:acc;ctx.strokeRect(-s,-s,s*2,s*2);ctx.restore()}}
    else if(m===3){ctx.beginPath();for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,px=cx+Math.sin(a*3+t*.004)*R*.9,py=cy+Math.sin(a*4+t*.003)*R*.9;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
    else if(m===4){for(let l=1;l<=4;l++){ctx.strokeStyle=l%2?acc:fg;ctx.beginPath();const sa=t*.003*(l%2?1:-1.4);ctx.arc(cx,cy,R*l*.25,sa,sa+Math.PI*1.3);ctx.stroke()}}
    else{ctx.beginPath();for(let i=0;i<90;i++){const a=i*.35+t*.008,r=(i/90)*R*1.05,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
    ctx.globalAlpha=1;
  });

  requestAnimationFrame(mainAnimLoop);
}

function hexToRgb(h){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#ffffff');return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[255,255,255]}

   4. 進行度ウィジェット / 内蔵アプリ / タイマー / オーディオ / 天気
========================================================= */
function calcProgressValues(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const y0=new Date(y,0,1),y1=new Date(y+1,0,1),m0=new Date(y,m,1),m1=new Date(y,m+1,1);
  const d0=new Date(y,m,now.getDate()),d1=new Date(y,m,now.getDate()+1),dow=(now.getDay()+6)%7;
  const w0=new Date(y,m,now.getDate()-dow),w1=new Date(y,m,now.getDate()-dow+7),h0=new Date(y,m,now.getDate(),now.getHours()),h1=new Date(y,m,now.getDate(),now.getHours()+1);
  return{year:{label:'YEAR',pct:(now-y0)/(y1-y0)*100},month:{label:'MONTH',pct:(now-m0)/(m1-m0)*100},week:{label:'WEEK',pct:(now-w0)/(w1-w0)*100},day:{label:'DAY',pct:(now-d0)/(d1-d0)*100},hour:{label:'HOUR',pct:(now-h0)/(h1-h0)*100}};
}
function renderProgressWidgets(){
  const vals=calcProgressValues(),cfg=state.progCfg||DEFAULT_APPEARANCE.progCfg,units=cfg.units?.length?cfg.units:['year','day'],dec=cfg.decimals??2,st=cfg.style||'bar';
  document.querySelectorAll('.js-prog-list').forEach(box=>{

let audioCtx=null,isPlaying=false,beatOn=true,songIdx=0,step=0,audInt=null,beatInt=null,beatStep=0;
const TRACKS=[
  {name:'01 / MIDNIGHT CHORDS',chords:[[261.6,311.1,392,466.2],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,349.2]]},
  {name:'02 / STUDY TAPE',chords:[[293.7,349.2,440,523.3],[246.9,293.7,370,440],[196,246.9,293.7,370],[220,277.2,329.6,415.3]]},
  {name:'03 / RAIN LOUNGE',chords:[[220,261.6,329.6,415.3],[196,246.9,293.7,370],[164.8,196,246.9,329.6],[174.6,220,261.6,349.2]]}
];
function playChord(freqs){if(!audioCtx)return;const now=audioCtx.currentTime;freqs.forEach(f=>{const o=audioCtx.createOscillator(),fl=audioCtx.createBiquadFilter(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,now);fl.type='lowpass';fl.frequency.setValueAtTime(750,now);g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(.04,now+.12);g.gain.exponentialRampToValueAtTime(.0001,now+2.1);o.connect(fl);fl.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+2.2)})}
function playSoftDrum(kind){
  if(!audioCtx||!beatOn)return;const now=audioCtx.currentTime;
  if(kind==='kick'){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(110,now);o.frequency.exponentialRampToValueAtTime(42,now+.12);g.gain.setValueAtTime(.14,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.19)}
  else{const bs=audioCtx.sampleRate*.04,b=audioCtx.createBuffer(1,bs,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;const s=audioCtx.createBufferSource();s.buffer=b;const hp=audioCtx.createBiquadFilter(),g=audioCtx.createGain();hp.type='highpass';hp.frequency.value=kind==='snare'?1800:5500;g.gain.setValueAtTime(kind==='snare'?.035:.015,now);g.gain.exponentialRampToValueAtTime(.0001,now+.04);s.connect(hp);hp.connect(g);g.connect(audioCtx.destination);s.start(now)}
}
function toggleAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
  isPlaying=!isPlaying;clearInterval(audInt);clearInterval(beatInt);
  if(isPlaying){playChord(TRACKS[songIdx].chords[step]);step=(step+1)%4;audInt=setInterval(()=>{playChord(TRACKS[songIdx].chords[step]);step=(step+1)%4},2200);beatStep=0;beatInt=setInterval(()=>{const p=beatStep%8;playSoftDrum(p===0||p===3?'kick':p===4?'snare':'hat');beatStep++},275)}
  syncAudioUI();
}
function nextAudio(){songIdx=(songIdx+1)%TRACKS.length;step=0;if(isPlaying)playChord(TRACKS[songIdx].chords[0]);syncAudioUI()}

async function loadWeatherForWidget(w){
  try{
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat??35.6762}&longitude=${w.lon??139.6503}&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`);
    if(!res.ok)return;const d=await res.json(),ch=new Date().getHours(),hrs=[],tmps=[],rns=[];
    for(let i=0;i<5;i++){const idx=ch+i*3;hrs.push(`${String(idx%24).padStart(2,'0')}H`);tmps.push(Math.round(d.hourly.temperature_2m[idx]??18));rns.push(d.hourly.precipitation_probability[idx]??10)}

      b.textContent=k==='*'?'×':k==='/'?'÷':k==='DEL'?'⌫':k;
      b.addEventListener('pointerdown',e=>{if(!isEditMode)e.stopPropagation()});
      b.onclick=e=>{e.stopPropagation();if(k==='C'){expr='';scr.textContent='0'}else if(k==='DEL'){expr=expr.slice(0,-1);scr.textContent=expr||'0'}else if(k==='='){try{if(/^[0-9+\-*/().\s]+$/.test(expr)){const v=Function(`"use strict";return(${expr})`)();expr=Number.isFinite(v)?String(Math.round(v*1e8)/1e8):'';scr.textContent=expr||'ERR'}}catch(er){scr.textContent='ERR';expr=''}}else{expr+=k;scr.textContent=expr}};
      grid.appendChild(b);
    });
    p.append(scr,grid);
  }else if(w.widgetType==='note'){
    const key=w.storageKey||`grid_note_${w.id}`;
    p.innerHTML=`<div class="w-head mono"><span>NOTES</span><span>AUTO-SAVE</span></div>`;
    const ta=document.createElement('textarea');ta.className='w-textarea';ta.placeholder='メモを入力...';ta.value=localStorage.getItem(key)||'';
    ta.oninput=()=>localStorage.setItem(key,ta.value);ta.addEventListener('pointerdown',e=>{if(!isEditMode)e.stopPropagation()});
    p.appendChild(ta);
  }else if(w.widgetType==='todo'){
    p.innerHTML=`<div class="w-head mono"><span>TODO</span><button class="btn-sharp" style="padding:2px 6px;font-size:.65rem" onclick="event.stopPropagation();todos=todos.filter(x=>!x.done);saveTodos()">CLEAR</button></div><form class="w-input-row" onsubmit="event.preventDefault();const i=this.querySelector('input');if(i.value.trim()){todos.unshift({text:i.value.trim(),done:false});i.value='';saveTodos()}"><input class="w-input" placeholder="タスク追加..." onpointerdown="if(!isEditMode)event.stopPropagation()"><button class="btn-sharp primary" type="submit">＋</button></form><div class="w-todo-list js-todo-ul"></div>`;
  }else if(w.widgetType==='schedule'){
    const skey=`grid_sch_${w.id}`,arr=JSON.parse(localStorage.getItem(skey)||'["","","","","",""]');
    p.innerHTML=`<div class="w-head mono"><span>TIMETABLE</span><span>1-6</span></div>`;
    const g=document.createElement('div');g.className='w-sch-grid';
    for(let i=0;i<6;i++){
      const c=document.createElement('div');c.className='w-sch-cell';c.innerHTML=`<span class="mono">${i+1}</span>`;
      const inp=document.createElement('input');inp.placeholder=`${i+1}限`;inp.value=arr[i]||'';
      inp.oninput=()=>{arr[i]=inp.value;localStorage.setItem(skey,JSON.stringify(arr))};
      inp.addEventListener('pointerdown',e=>{if(!isEditMode)e.stopPropagation()});
      c.appendChild(inp);g.appendChild(c);
    }
    p.appendChild(g);
  }
  return p;
}

let dragState=null;
function startSafeDrag(el,loc,idx,e){
  const rc=el.getBoundingClientRect(),ghost=el.cloneNode(true);
  ghost.className='drag-ghost';ghost.style.width=`${rc.width}px`;ghost.style.height=`${rc.height}px`;
  ghost.style.left=`${e.clientX}px`;ghost.style.top=`${e.clientY}px`;document.body.appendChild(ghost);
  el.classList.add('is-dragging');document.getElementById('pagesTrack').style.overflowX='hidden';
  dragState={el,loc,idx,ghost,dropLoc:null,dropIdx:null};
}
window.addEventListener('pointermove',e=>{
  if(!dragState)return;dragState.ghost.style.left=`${e.clientX}px`;dragState.ghost.style.top=`${e.clientY}px`;
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));dragState.dropLoc=null;dragState.dropIdx=null;
  const tt=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile,.dock-item');
  if(tt&&tt!==dragState.el){tt.classList.add('drop-target');dragState.dropLoc=tt.dataset.loc==='dock'?'dock':Number(tt.dataset.loc);dragState.dropIdx=Number(tt.dataset.idx)}
});
function endSafeDrag(){
  if(!dragState)return;const{el,loc,idx,ghost,dropLoc,dropIdx}=dragState;ghost.remove();el.classList.remove('is-dragging');
  document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));document.getElementById('pagesTrack').style.overflowX='auto';
  if(dropLoc!==null&&dropIdx!==null&&!(dropLoc===loc&&dropIdx===idx)){
    const src=loc==='dock'?state.dock:state.pages[loc].items,dst=dropLoc==='dock'?state.dock:state.pages[dropLoc].items,mv=src[idx];
    if(!(dropLoc==='dock'&&mv.type==='widget')){const prev=captureRects();pushUndo();src.splice(idx,1);dst.splice(dropIdx,0,mv);selected={loc:dropLoc,idx:dropIdx};saveState();renderAll(prev)}
  }
  dragState=null;
}
window.addEventListener('pointerup',endSafeDrag);window.addEventListener('pointercancel',endSafeDrag);

function createTile(item,loc,idx){
  const isSel=selected&&selected.loc===loc&&selected.idx===idx,el=document.createElement(item.type==='app'?'a':'div');
  el.dataset.loc=String(loc);el.dataset.idx=String(idx);el.dataset.uid=item._uid;
  if(loc==='dock'){
    el.className='dock-item'+(isSel?' is-selected':'');el.href=isSafeUrl(item.url)?item.url:'#';
    if(item.newTab){el.target='_blank';el.rel='noopener'}
    el.innerHTML=glyph(item.icon)+`<span>${esc(item.name)}</span>`;
  }else{
    el.className='tile '+(item.type==='app'?'is-app':`sz-${item.size||'2x2'}`)+(isSel?' is-selected':'')+(!initialAnimated?' animate-in':'');
    if(!initialAnimated)el.style.animationDelay=`${Math.min(idx*18,280)}ms`;
    if(item.type==='app'){
      el.href=isSafeUrl(item.url)?item.url:'#';if(item.newTab){el.target='_blank';el.rel='noopener'}
      el.innerHTML=`<div class="app-glyph">${glyph(item.icon)}</div><div class="app-title">${esc(item.name)}</div>`;
    }else el.appendChild(buildWidgetPanel(item));
    const b=document.createElement('span');b.className='tile-badge mono';b.textContent=item.type==='app'?`${idx+1}`:(item.size||'2x2').toUpperCase();el.appendChild(b);
  }
  let sx=0,sy=0,lp=null,mv=false;
  el.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;sx=e.clientX;sy=e.clientY;mv=false;if(!isEditMode)lp=setTimeout(()=>{toggleEditMode(true);selectItem(loc,idx)},450)});
  el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8){clearTimeout(lp);if(isEditMode&&!dragState&&!mv){mv=true;startSafeDrag(el,loc,idx,e)}}});
  const cl=()=>clearTimeout(lp);el.addEventListener('pointerup',cl);el.addEventListener('pointercancel',cl);
  el.addEventListener('click',e=>{
    if(isEditMode){e.preventDefault();if(!mv)selectItem(loc,idx);return}
    if(item.type==='app'&&(item.url==='internal://calc'||item.url==='internal://voicememo')){e.preventDefault();launchAppUrl(item.url,false)}
  });
  return el;
}

function renderAll(prevRects=null){
  ensureUids();
  const tabs=document.getElementById('pageTabs');tabs.innerHTML='';
  state.pages.forEach((pg,i)=>{const b=document.createElement('button');b.className='tab-chip mono'+(i===currentPage?' active':'');b.textContent=pg.title||`0${i+1}`;b.onclick=()=>goToPage(i);tabs.appendChild(b)});
  const track=document.getElementById('pagesTrack');track.innerHTML='';
  state.pages.forEach((pg,pIdx)=>{
    const pane=document.createElement('section');pane.className='page-pane';let et=null;
    pane.addEventListener('pointerdown',e=>{if(e.target===pane||e.target.classList.contains('bento-grid'))et=setTimeout(()=>toggleEditMode(true),450)});
    pane.addEventListener('pointermove',()=>clearTimeout(et));pane.addEventListener('pointerup',()=>clearTimeout(et));
    const grid=document.createElement('div');grid.className='bento-grid';
    pg.items.forEach((it,iIdx)=>grid.appendChild(createTile(it,pIdx,iIdx)));
    pane.appendChild(grid);track.appendChild(pane);
  });
  const dock=document.getElementById('dockBar');dock.innerHTML='';
  state.dock.forEach((ap,idx)=>dock.appendChild(createTile(ap,'dock',idx)));
  requestAnimationFrame(()=>{track.scrollTo({left:currentPage*track.clientWidth,behavior:'instant'});recalcGridCells();if(prevRects)playFlip(prevRects);initialAnimated=true});
  updateInspector();updateClocks();renderTimers();renderTodos();renderProgressWidgets();
}
function goToPage(i){currentPage=Math.max(0,Math.min(state.pages.length-1,i));const tr=document.getElementById('pagesTrack');tr.scrollTo({left:currentPage*tr.clientWidth,behavior:'smooth'});document.querySelectorAll('.tab-chip').forEach((c,idx)=>c.classList.toggle('active',idx===currentPage))}
document.getElementById('pagesTrack').addEventListener('scroll',()=>{const tr=document.getElementById('pagesTrack'),idx=Math.round(tr.scrollLeft/(tr.clientWidth||1));if(idx!==currentPage){currentPage=idx;document.querySelectorAll('.tab-chip').forEach((c,i)=>c.classList.toggle('active',i===idx))}});

/* =========================================================
   6. 編集 & キーボード & モーダル
========================================================= */
function toggleEditMode(force){
  isEditMode=typeof force==='boolean'?force:!isEditMode;
  document.getElementById('osShell').classList.toggle('editing',isEditMode);
  document.getElementById('editBtn').classList.toggle('primary',isEditMode);
  document.getElementById('editBtn').textContent=isEditMode?'DONE [Esc]':'EDIT [E]';
  if(isEditMode&&!selected&&state.pages[currentPage].items.length)selected={loc:currentPage,idx:0};
  if(!isEditMode)selected=null;renderAll();
}
function selectItem(loc,idx){selected={loc,idx};document.querySelectorAll('.is-selected').forEach(x=>x.classList.remove('is-selected'));document.querySelector(`[data-loc="${loc}"][data-idx="${idx}"]`)?.classList.add('is-selected');updateInspector()}
function getSelectedItem(){if(!selected)return null;const arr=selected.loc==='dock'?state.dock:state.pages[selected.loc]?.items;return arr?arr[selected.idx]:null}
function updateInspector(){
  const info=document.getElementById('selInfo'),br=document.getElementById('btnResize'),be=document.getElementById('btnEditSel'),it=getSelectedItem();
  if(!it){info.innerHTML='<span>SELECT A TILE (OR ARROWS)</span>';br.style.display='none';be.style.display='none';return}
  info.innerHTML=`SELECTED: <strong>${esc(it.type==='app'?it.name:`${it.widgetType.toUpperCase()} [${it.size}]`)}</strong>`;
  br.style.display=it.type==='widget'?'inline-flex':'none';be.style.display=(it.type==='app'||it.widgetType==='weather'||it.widgetType==='progress')?'inline-flex':'none';
}
function moveSelected(dir){if(!selected)return;const arr=selected.loc==='dock'?state.dock:state.pages[selected.loc].items,t=selected.idx+dir;if(t<0||t>=arr.length)return;const prev=captureRects();pushUndo();[arr[selected.idx],arr[t]]=[arr[t],arr[selected.idx]];selected.idx=t;saveState();renderAll(prev)}
function cycleSelectedSize(){const it=getSelectedItem();if(!it||it.type!=='widget')return;const sz=it.widgetType==='search'?['3x1','4x1','6x1','2x1']:['2x1','2x2','3x2','4x2','6x2'];const prev=captureRects();pushUndo();it.size=sz[(sz.indexOf(it.size)+1)%sz.length];saveState();renderAll(prev)}
function deleteSelectedItem(){if(!selected)return;const arr=selected.loc==='dock'?state.dock:state.pages[selected.loc].items,rem=arr[selected.idx];if(!rem)return;const prev=captureRects();pushUndo();arr.splice(selected.idx,1);selected=arr.length?{loc:selected.loc,idx:Math.min(selected.idx,arr.length-1)}:null;saveState();renderAll(prev);showUndoToast(`REMOVED: ${rem.name||rem.widgetType}`)}
function editSelectedItem(){const it=getSelectedItem();if(!it)return;if(it.type==='app')openAppModal(selected.loc,selected.idx);else if(it.widgetType==='weather')openCityModal(it.id);else if(it.widgetType==='progress')openProgModal()}
function addPage(){pushUndo();state.pages.push({title:`0${state.pages.length+1} PAGE`,items:[]});saveState();currentPage=state.pages.length-1;renderAll()}

document.addEventListener('keydown',e=>{
  const inIn=e.target.matches('input,textarea,select');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!inIn){e.preventDefault();undoAction();return}
  if(e.key==='Escape'){const m=document.querySelector('.modal-bg.open');if(m)m.classList.remove('open');else if(isEditMode)toggleEditMode(false);return}
  if(inIn||document.querySelector('.modal-bg.open'))return;
  const k=e.key.toLowerCase();
  if(k==='e'){e.preventDefault();toggleEditMode();return}if(k==='n'){e.preventDefault();openModal('addModal');return}if(e.key==='/'){e.preventDefault();openSearch();return}
  if((e.shiftKey&&e.key==='ArrowLeft')||e.key==='['){e.preventDefault();if(!isEditMode)toggleEditMode(true);moveSelected(-1);return}
  if((e.shiftKey&&e.key==='ArrowRight')||e.key===']'){e.preventDefault();if(!isEditMode)toggleEditMode(true);moveSelected(1);return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();const items=state.pages[currentPage].items;if(!items.length)return;if(!selected||selected.loc!==currentPage){selectItem(currentPage,0);return}
    const cols=window.innerWidth<=720?4:(state.cols||6);let ni=selected.idx;
    if(e.key==='ArrowLeft')ni=Math.max(0,selected.idx-1);if(e.key==='ArrowRight')ni=Math.min(items.length-1,selected.idx+1);
    if(e.key==='ArrowUp')ni=Math.max(0,selected.idx-cols);if(e.key==='ArrowDown')ni=Math.min(items.length-1,selected.idx+cols);
    selectItem(currentPage,ni);return;
  }
  if(e.key==='Enter'&&selected){
    e.preventDefault();const it=getSelectedItem();if(!it)return;
    if(isEditMode){if(it.type==='app')openAppModal(selected.loc,selected.idx);else cycleSelectedSize()}
    else if(it.type==='app')launchAppUrl(it.url,it.newTab);return;
  }
  if((e.key==='Backspace'||e.key==='Delete')&&isEditMode&&selected){e.preventDefault();deleteSelectedItem()}
});

const openModal=id=>document.getElementById(id).classList.add('open');
const closeModal=id=>document.getElementById(id).classList.remove('open');
function addWidget(wt,sz){const prev=captureRects();pushUndo();const w=W(wt,sz);if(wt==='weather'){w.city='TOKYO';w.lat=35.6762;w.lon=139.6503}state.pages[currentPage].items.unshift(w);saveState();renderAll(prev);closeModal('addModal')}

let editRef=null,pickedIcon='web';
function buildIconPicker(act){
  const box=document.getElementById('iconPicker');box.innerHTML='';
  Object.keys(G_RAW).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='ip-btn'+(k===act?' active':'');b.innerHTML=glyph(k);b.title=k;b.onclick=()=>{pickedIcon=k;box.querySelectorAll('.ip-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')};box.appendChild(b)});
}
function openAppModal(loc=null,idx=-1){
  editRef=loc!==null?{loc,idx}:null;const ap=editRef?(loc==='dock'?state.dock:state.pages[loc].items)[idx]:{name:'',url:'https://',icon:'web',newTab:false};
  document.getElementById('appModalTitle').textContent=editRef?'EDIT APP':'NEW APP';
  document.getElementById('fName').value=ap.name;document.getElementById('fUrl').value=ap.url;document.getElementById('fNewTab').checked=!!ap.newTab;
  pickedIcon=ap.icon||'web';buildIconPicker(pickedIcon);
  const sel=document.getElementById('fTarget');sel.innerHTML='';
  state.pages.forEach((p,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=p.title||`PAGE ${i+1}`;sel.appendChild(o)});
  const dO=document.createElement('option');dO.value='dock';dO.textContent='BOTTOM DOCK';sel.appendChild(dO);sel.value=editRef?String(loc):String(currentPage);
  openModal('appModal');
}
function saveAppModal(){
  const name=document.getElementById('fName').value.trim(),url=document.getElementById('fUrl').value.trim(),newTab=document.getElementById('fNewTab').checked,rt=document.getElementById('fTarget').value,dest=rt==='dock'?'dock':Number(rt);
  if(!name||!url)return alert('名前とURLを入力してください');
  const prev=captureRects();pushUndo();
  const obj={type:'app',name,url,icon:pickedIcon,newTab,_uid:editRef?(editRef.loc==='dock'?state.dock:state.pages[editRef.loc].items)[editRef.idx]._uid:'u_'+(uidCounter++)};
  if(editRef){const sa=editRef.loc==='dock'?state.dock:state.pages[editRef.loc].items;if(editRef.loc===dest)sa[editRef.idx]=obj;else{sa.splice(editRef.idx,1);(dest==='dock'?state.dock:state.pages[dest].items).push(obj)}}
  else(dest==='dock'?state.dock:state.pages[dest].items).push(obj);
  saveState();renderAll(prev);closeModal('appModal');
}
function exportJson(){const d=JSON.stringify(state,null,2);navigator.clipboard?.writeText(d).then(()=>alert('コピーしました'),()=>prompt('コピー:',d))}
function importJson(){const r=prompt('JSONを貼付:');if(!r)return;try{const p=JSON.parse(r);if(!p.pages||!p.dock)throw 0;pushUndo();state={...structuredClone(DEFAULT_APPEARANCE),...p};ensureUids();saveState();applyTheme();renderAll();closeModal('themeModal')}catch(e){alert('無効なJSONです')}}
function resetAll(){if(!confirm('全設定と配置を初期化しますか？'))return;pushUndo();state=structuredClone(DEFAULT_STATE);ensureUids();saveState();currentPage=0;selected=null;applyTheme();renderAll();closeModal('themeModal')}

function openSearch(){openModal('searchModal');const i=document.getElementById('searchInput');i.value='';renderSearch('');setTimeout(()=>i.focus(),50)}
function renderSearch(q){
  const list=document.getElementById('searchList');list.innerHTML='';const qr=q.trim().toLowerCase(),seen=new Set();
  const matches=[...state.dock,...state.pages.flatMap(p=>p.items).filter(x=>x.type==='app')].filter(a=>{if(seen.has(a.name))return false;seen.add(a.name);return!qr||a.name.toLowerCase().includes(qr)||a.url.toLowerCase().includes(qr)}).slice(0,8);
  matches.forEach(a=>{
    const r=document.createElement('a');r.className='search-row';r.href=isSafeUrl(a.url)?a.url:'#';if(a.newTab){r.target='_blank';r.rel='noopener'}
    r.onclick=e=>{closeModal('searchModal');if(a.url==='internal://calc'||a.url==='internal://voicememo'){e.preventDefault();launchAppUrl(a.url,false)}};
    r.innerHTML=`${glyph(a.icon)}<span style="font-weight:700;flex:1">${esc(a.name)}</span><span class="mono" style="font-size:.72rem;color:var(--muted)">${esc(a.url)}</span>`;
    list.appendChild(r);
  });
  if(qr){const r=document.createElement('a');r.className='search-row';r.href=`https://www.google.com/search?q=${encodeURIComponent(q)}`;r.target='_blank';r.onclick=()=>closeModal('searchModal');r.innerHTML=`${glyph('google')}<span style="font-weight:700">Google で「${esc(q)}」を検索</span>`;list.appendChild(r)}
}
document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#searchList .search-row')?.click()});

function updateClocks(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),hh=String(h).padStart(2,'0'),mm=String(m).padStart(2,'0'),ss=String(s).padStart(2,'0');
  document.querySelectorAll('.js-clk-time').forEach(e=>e.textContent=`${hh}:${mm}:${ss}`);
  document.querySelectorAll('.js-clk-date').forEach(e=>e.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}));
  document.querySelectorAll('.js-clk-short').forEach(e=>e.textContent=n.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}));
  document.querySelectorAll('.js-h-hand').forEach(e=>e.setAttribute('transform',`rotate(${(h%12+m/60)*30} 50 50)`));
  document.querySelectorAll('.js-m-hand').forEach(e=>e.setAttribute('transform',`rotate(${(m+s/60)*6} 50 50)`));
  document.querySelectorAll('.js-s-hand').forEach(e=>e.setAttribute('transform',`rotate(${s*6} 50 50)`));
  renderProgressWidgets();
}
setInterval(updateClocks,1000);

applyTheme();
renderAll();
requestAnimationFrame(mainAnimLoop);
</script>
