<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iPadOS Home</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --icon-size: 72px;
            --icon-radius: 22.5%;
            --glass: rgba(255, 255, 255, 0.16);
            --glass-strong: rgba(28, 32, 42, 0.72);
            --glass-border: rgba(255, 255, 255, 0.22);
            --accent: #0a84ff;
            --text: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--text);
            background-color: #0b1220;
            touch-action: manipulation;
        }

        /* 壁紙レイヤー */
        .wallpaper {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            transition: background 0.4s ease, filter 0.3s ease;
        }

        .wallpaper.wp-1 {
            background:
                radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.55), transparent 48%),
                radial-gradient(circle at 82% 25%, rgba(99, 102, 241, 0.55), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.42), transparent 52%),
                radial-gradient(circle at 20% 85%, rgba(30, 64, 175, 0.7), transparent 55%),
                linear-gradient(135deg, #091326 0%, #0f172a 100%);
        }
        .wallpaper.wp-2 {
            background:
                radial-gradient(circle at 25% 25%, rgba(244, 63, 94, 0.48), transparent 48%),
                radial-gradient(circle at 78% 20%, rgba(245, 158, 11, 0.42), transparent 48%),
                radial-gradient(circle at 55% 75%, rgba(139, 92, 246, 0.52), transparent 55%),
                linear-gradient(150deg, #1b1026 0%, #0d111d 100%);
        }
        .wallpaper.wp-3 {
            background:
                radial-gradient(circle at 30% 18%, rgba(34, 211, 238, 0.35), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.35), transparent 50%),
                linear-gradient(160deg, #07090f 0%, #111827 55%, #090d16 100%);
        }
        .wallpaper.wp-4 {
            background:
                radial-gradient(circle at 20% 30%, rgba(52, 211, 153, 0.48), transparent 48%),
                radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.48), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(6, 95, 70, 0.6), transparent 55%),
                linear-gradient(145deg, #06211c 0%, #091522 100%);
        }
        .wallpaper.wp-5 {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.14), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(148, 163, 184, 0.16), transparent 50%),
                linear-gradient(145deg, #1c1f26 0%, #0c0e12 100%);
        }

        /* 全体レイアウト */
        .os-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        }

        /* ステータスバー */
        .status-bar {
            height: 44px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-date {
            color: var(--text-sub);
            font-weight: 500;
        }

        .status-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .pill-btn:active { transform: scale(0.95); }
        .pill-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .pill-btn svg {
            width: 14px;
            height: 14px;
        }

        /* スワイプ可能なページコンテナ */
        .pages-viewport {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .pages-viewport::-webkit-scrollbar { display: none; }

        .page {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            padding: 16px 36px 8px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .page::-webkit-scrollbar { display: none; }

        /* iPad風アイコン配列グリッド */
        .app-grid {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 24px 16px;
            align-content: start;
        }

        .app-slot {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        .app-icon-wrap {
            position: relative;
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: var(--icon-radius);
            background: #ffffff;
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.34),
                0 2px 6px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.15s;
        }

        .app-slot:active .app-icon-wrap {
            transform: scale(0.9);
            filter: brightness(0.85);
        }

        .app-icon-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .app-icon-wrap img.favicon-img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            border-radius: 14%;
        }

        .app-label {
            font-size: 0.76rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            max-width: 92px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.75);
        }

        /* 編集モード（iPad風の揺れと削除バッジ） */
        @keyframes jiggle {
            0% { transform: rotate(-1.3deg); }
            50% { transform: rotate(1.3deg); }
            100% { transform: rotate(-1.3deg); }
        }

        .editing .app-slot {
            animation: jiggle 0.28s infinite ease-in-out;
        }
        .editing .app-slot:nth-child(2n) {
            animation-delay: -0.14s;
        }

        .badge-delete {
            display: none;
            position: absolute;
            top: -6px;
            left: calc(50% - var(--icon-size) / 2 - 6px);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(215, 220, 230, 0.92);
            color: #111827;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .dock .badge-delete {
            left: -6px;
        }

        .editing .badge-delete {
            display: flex;
        }

        .badge-delete svg {
            width: 12px;
            height: 12px;
        }

        /* 編集モード中のページ管理バー */
        .edit-toolbar {
            display: none;
            justify-content: center;
            gap: 8px;
            padding: 4px 16px 8px;
            flex-shrink: 0;
        }

        .editing .edit-toolbar {
            display: flex;
        }

        /* ウィジェットページ（iPadOSスタイル） */
        .widgets-grid {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            padding-bottom: 20px;
        }

        .widget {
            background: rgba(22, 28, 40, 0.56);
            backdrop-filter: blur(26px) saturate(160%);
            -webkit-backdrop-filter: blur(26px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        .widget-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-clock-big {
            font-size: 3.4rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .widget-clock-sub {
            margin-top: 6px;
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .timer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .timer-num {
            font-size: 2.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .timer-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .w-btn {
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .w-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .w-textarea {
            width: 100%;
            min-height: 145px;
            flex: 1;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-size: 0.92rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .todo-add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .w-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .todo-scroll {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 0.88rem;
        }

        .todo-row.done span {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .todo-row span { flex: 1; word-break: break-word; }

        .todo-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.45);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .todo-row.done .todo-check {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* 下部：ページドット・検索ピル・Dock */
        .bottom-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 0;
        }

        .page-dots-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-dots {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: none;
        }

        .dot.active {
            background: #ffffff;
            transform: scale(1.25);
        }

        .spotlight-trigger {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 0.76rem;
            font-weight: 500;
            cursor: pointer;
        }

        .spotlight-trigger svg {
            width: 12px;
            height: 12px;
            opacity: 0.9;
        }

        /* iPadOS Dock */
        .dock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 30px;
            padding: 11px 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            max-width: calc(100vw - 24px);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .dock::-webkit-scrollbar { display: none; }

        .dock .app-slot {
            gap: 0;
        }

        .dock .app-icon-wrap {
            width: 64px;
            height: 64px;
        }

        .dock .app-label {
            display: none;
        }

        /* モーダル共通 */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-backdrop.open { display: flex; }

        .sheet {
            width: 100%;
            max-width: 440px;
            background: rgba(28, 32, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .sheet h3 {
            font-size: 1.08rem;
            font-weight: 700;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .field input, .field select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
        }

        .field select option { background: #1c202a; color: #fff; }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .check-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.86rem;
            cursor: pointer;
        }

        .sheet-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .move-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Spotlight 検索モーダル */
        .spotlight-box {
            align-items: flex-start;
            padding-top: 10vh;
        }

        .spotlight-panel {
            width: 100%;
            max-width: 560px;
            background: rgba(30, 34, 46, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .spotlight-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spotlight-input-row svg {
            width: 20px;
            height: 20px;
            color: var(--text-sub);
            flex-shrink: 0;
        }

        .spotlight-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.08rem;
            outline: none;
        }

        .spotlight-results {
            max-height: 50vh;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spot-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            transition: background 0.12s;
        }

        .spot-item:hover, .spot-item:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .spot-mini-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .spot-mini-icon svg { width: 100%; height: 100%; }
        .spot-mini-icon img { width: 72%; height: 72%; object-fit: contain; }

        .spot-meta {
            display: flex;
            flex-direction: column;
        }

        .spot-name { font-size: 0.94rem; font-weight: 600; }
        .spot-sub { font-size: 0.75rem; color: var(--text-sub); }

        /* 壁紙ピッカー */
        .wp-swatches {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .wp-swatch {
            height: 54px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }

        .wp-swatch.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        /* レスポンシブ */
        @media (max-width: 900px) {
            .app-grid { grid-template-columns: repeat(5, 1fr); }
        }

        @media (max-width: 680px) {
            :root { --icon-size: 62px; }
            .page { padding: 12px 18px 8px; }
            .app-grid { grid-template-columns: repeat(4, 1fr); gap: 18px 10px; }
            .widgets-grid { grid-template-columns: 1fr; }
            .dock { gap: 12px; padding: 9px 14px; border-radius: 26px; }
            .dock .app-icon-wrap { width: 54px; height: 54px; }
        }
    </style>
</head>
<body>

    <div class="wallpaper wp-1" id="wallpaper"></div>

    <div class="os-shell" id="osShell">
        <!-- 上部ステータスバー -->
        <header class="status-bar">
            <div class="status-left">
                <span id="statusTime">00:00</span>
                <span class="status-date" id="statusDate">---</span>
            </div>
            <div class="status-actions">
                <button class="pill-btn" onclick="openWallpaperModal()" title="壁紙変更">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    <span>壁紙</span>
                </button>
                <button class="pill-btn" onclick="openAddModal()" title="アプリを追加">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    <span>追加</span>
                </button>
                <button class="pill-btn" id="editToggleBtn" onclick="toggleEditMode()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    <span id="editBtnText">編集</span>
                </button>
            </div>
        </header>

        <!-- 編集モード中のページ管理 -->
        <div class="edit-toolbar">
            <button class="pill-btn" onclick="addPage()">＋ ページを追加</button>
            <button class="pill-btn" id="removePageBtn" onclick="removeCurrentPage()">この空ページを削除</button>
            <button class="pill-btn" onclick="resetDefaults()">初期設定に戻す</button>
        </div>

        <!-- スワイプ可能なホーム画面ページ -->
        <main class="pages-viewport" id="pagesViewport"></main>

        <!-- ページドット・検索・Dock -->
        <footer class="bottom-area">
            <div class="page-dots-bar">
                <div class="page-dots" id="pageDots"></div>
                <button class="spotlight-trigger" onclick="openSpotlight()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

        function makeMonogramSvg(name, url) {
            const colors = ['#0a84ff', '#5e5ce6', '#bf5af2', '#ff375f', '#ff9f0a', '#30d158', '#64d2ff', '#007aff'];
            let hash = 0;
            const seed = (name || url || 'A');
            for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            const bg = colors[Math.abs(hash) % colors.length];
            const char = (name.trim()[0] || 'A').toUpperCase();
            return `<svg viewBox="0 0 100 100"><defs><linearGradient id="mg${Math.abs(hash)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg}"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0.35"/></linearGradient></defs><rect width="100" height="100" fill="${bg}"/><rect width="100" height="100" fill="url(#mg${Math.abs(hash)})" opacity="0.5"/><text x="50" y="64" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="700" font-family="-apple-system, sans-serif">${escapeXml(char)}</text></svg>`;
        }

        function escapeXml(str) {
            return String(str).replace(/[<>&'"]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', "'":'&apos;', '"':'&quot;' }[c]));
        }

        function getDomainFromUrl(url) {
            try {
                if (/^https?:/i.test(url)) return new URL(url).hostname;
            } catch (e) {}
            return '';
        }

        function renderIconElement(app) {
            const wrap = document.createElement('div');
            wrap.className = 'app-icon-wrap';

            if (app.iconType && app.iconType.startsWith('svg:')) {
                const key = app.iconType.slice(4);
                if (BRAND_SVGS[key]) {
                    wrap.innerHTML = BRAND_SVGS[key];
                    return wrap;
                }
            }

            if (app.iconType === 'custom' && app.iconUrl) {
                const img = document.createElement('img');
                img.className = 'favicon-img';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.borderRadius = '0';
                img.style.objectFit = 'cover';
                img.src = app.iconUrl;
                img.onerror = () => { wrap.innerHTML = makeMonogramSvg(app.name, app.url); };
                wrap.appendChild(img);
                return wrap;
            }

            // URLから高解像度ファビコンを自動取得（失敗時はクリーンなSVGモノグラム）
            const domain = getDomainFromUrl(app.url);
            if (domain) {
                const img = document.createElement('img');
                img.className = 'favicon-img';
                img.alt = app.name;
                img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128`;
                img.onerror = () => { wrap.innerHTML = makeMonogramSvg(app.name, app.url); };
                wrap.appendChild(img);
                return wrap;
            }

            wrap.innerHTML = makeMonogramSvg(app.name, app.url);
            return wrap;
        }

        function isSafeUrl(url) {
            return !/^\s*javascript:/i.test(url);
        }

        /* =========================================================
           3. ホーム画面・Dock・ウィジェットページの描画
        ========================================================= */
        function createAppSlot(app, loc, idx) {
            const slot = document.createElement('a');
            slot.className = 'app-slot';
            slot.href = isSafeUrl(app.url) ? app.url : '#';
            if (app.newTab) {
                slot.target = '_blank';
                slot.rel = 'noopener';
            }

            // 削除バッジ
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'badge-delete';
            delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>`;
            delBtn.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                deleteApp(loc, idx);
            });

            // 長押しでiPad風の編集モードへ
            let pressTimer = null;
            let moved = false;
            slot.addEventListener('pointerdown', () => {
                moved = false;
                if (isEditMode) return;
                pressTimer = setTimeout(() => {
                    if (!moved) toggleEditMode(true);
                }, 520);
            });
            slot.addEventListener('pointermove', () => { moved = true; clearTimeout(pressTimer); });
            slot.addEventListener('pointerup', () => clearTimeout(pressTimer));
            slot.addEventListener('pointercancel', () => clearTimeout(pressTimer));

            slot.addEventListener('click', e => {
                if (isEditMode) {
                    e.preventDefault();
                    openEditModal(loc, idx);
                }
            });

            const iconEl = renderIconElement(app);
            const label = document.createElement('span');
            label.className = 'app-label';
            label.textContent = app.name;

            slot.append(delBtn, iconEl, label);
            return slot;
        }

        function renderAll() {

                            <button class="w-btn" onclick="setTimer(10)">10分</button>
                            <button class="w-btn" onclick="setTimer(5)">5分</button>
                            <button class="w-btn" onclick="addMinute()">+1分</button>
                            <button class="w-btn" onclick="resetTimer()">リセット</button>
                        </div>
                    </div>
                    <div class="widget">
                        <div class="widget-title"><span>Notes (自動保存)</span><span id="wMemoStatus"></span></div>
                        <textarea class="w-textarea" id="wMemo" placeholder="メモを入力..."></textarea>
                    </div>
                    <div class="widget">
                        <div class="widget-title"><span>ToDo</span><button class="w-btn" style="padding:3px 8px; font-size:0.7rem;" onclick="clearDoneTodos()">完了削除</button></div>
                        <form class="todo-add-row" onsubmit="addTodo(event)">
                            <input type="text" class="w-input" id="wTodoInput" placeholder="タスクを追加..." autocomplete="off">
                            <button type="submit" class="w-btn primary">追加</button>
                        </form>
                        <div class="todo-scroll" id="wTodoList"></div>
                    </div>
                </div>
            `;
            viewport.appendChild(widgetPage);

            // Dockを描画
            const dock = document.getElementById('dock');
            dock.innerHTML = '';
            state.dock.forEach((app, idx) => dock.appendChild(createAppSlot(app, 'dock', idx)));

            // ページドットを描画
            const totalPages = state.pages.length + 1;
            const dotsEl = document.getElementById('pageDots');
            dotsEl.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'dot' + (i === currentPageIdx ? ' active' : '');
                dot.onclick = () => goToPage(i);
                dotsEl.appendChild(dot);
            }

            viewport.scrollLeft = prevScroll;
            initWidgets();
            updateClock();
            updateRemovePageButton();
        }

        function goToPage(idx) {
            const viewport = document.getElementById('pagesViewport');
            viewport.scrollTo({ left: idx * viewport.clientWidth, behavior: 'smooth' });
        }

        document.getElementById('pagesViewport').addEventListener('scroll', () => {
            const viewport = document.getElementById('pagesViewport');
            const w = viewport.clientWidth || 1;
            const idx = Math.round(viewport.scrollLeft / w);
            if (idx !== currentPageIdx) {
                currentPageIdx = idx;
                document.querySelectorAll('#pageDots .dot').forEach((d, i) => {
                    d.classList.toggle('active', i === idx);
                });
                updateRemovePageButton();
            }
        });

        function updateRemovePageButton() {
            const btn = document.getElementById('removePageBtn');
            const isAppPage = currentPageIdx < state.pages.length;
            const isEmpty = isAppPage && state.pages[currentPageIdx].length === 0;
            btn.style.display = (isAppPage && isEmpty && state.pages.length > 1) ? 'inline-flex' : 'none';
        }

        /* =========================================================
           4. 編集モード・追加・移動・削除
        ========================================================= */
        function toggleEditMode(force) {
            isEditMode = typeof force === 'boolean' ? force : !isEditMode;
            document.getElementById('osShell').classList.toggle('editing', isEditMode);
            document.getElementById('editToggleBtn').classList.toggle('active', isEditMode);
            document.getElementById('editBtnText').textContent = isEditMode ? '完了' : '編集';
        }

        function addPage() {
            state.pages.push([]);
            saveState();
            renderAll();
            goToPage(state.pages.length - 1);
        }

        function removeCurrentPage() {
            if (currentPageIdx >= state.pages.length || state.pages.length <= 1) return;
            if (state.pages[currentPageIdx].length > 0) return;
            state.pages.splice(currentPageIdx, 1);
            saveState();
            currentPageIdx = Math.max(0, currentPageIdx - 1);
            renderAll();
            goToPage(currentPageIdx);
        }

        function deleteApp(loc, idx) {
            const arr = loc === 'dock' ? state.dock : state.pages[loc];
            arr.splice(idx, 1);
            saveState();
            renderAll();
        }

        function resetDefaults() {
            if (!confirm('配置やアイコンを初期状態に戻しますか？')) return;
            state = structuredClone(DEFAULT_STATE);
            saveState();
            renderAll();
            goToPage(0);
        }

        function populateLocSelect(selected) {
            const sel = document.getElementById('fTargetLoc');
            sel.innerHTML = '';
            state.pages.forEach((_, i) => {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = `ホーム ${i + 1}ページ目`;
                sel.appendChild(opt);
            });
            const dockOpt = document.createElement('option');
            dockOpt.value = 'dock';
            dockOpt.textContent = '下部のDock';
            sel.appendChild(dockOpt);
            sel.value = String(selected);
        }

        document.getElementById('fIconType').addEventListener('change', e => {
            document.getElementById('customIconField').style.display = e.target.value === 'custom' ? 'flex' : 'none';
        });

        function openAddModal() {
            editingRef = null;
            document.getElementById('appModalTitle').textContent = 'アプリを追加';
            document.getElementById('fName').value = '';
            document.getElementById('fUrl').value = 'https://';
            document.getElementById('fIconType').value = 'auto';
            document.getElementById('fIconUrl').value = '';
            document.getElementById('fNewTab').checked = false;
            document.getElementById('customIconField').style.display = 'none';
            document.getElementById('reorderField').style.display = 'none';
            const defaultPage = Math.min(currentPageIdx, state.pages.length - 1);
            populateLocSelect(defaultPage);
            document.getElementById('appModal').classList.add('open');
        }

        function openEditModal(loc, idx) {
            editingRef = { loc, index: idx };
            const app = (loc === 'dock' ? state.dock : state.pages[loc])[idx];
            document.getElementById('appModalTitle').textContent = 'アプリを編集';
            document.getElementById('fName').value = app.name;
            document.getElementById('fUrl').value = app.url;
            document.getElementById('fIconType').value = app.iconType || 'auto';
            document.getElementById('fIconUrl').value = app.iconUrl || '';
            document.getElementById('fNewTab').checked = !!app.newTab;
            document.getElementById('customIconField').style.display = app.iconType === 'custom' ? 'flex' : 'none';
            document.getElementById('reorderField').style.display = 'flex';
            populateLocSelect(loc);
            document.getElementById('appModal').classList.add('open');
        }

        function closeAppModal() {
            document.getElementById('appModal').classList.remove('open');
        }

        function shiftEditingApp(dir) {
            if (!editingRef) return;
            const arr = editingRef.loc === 'dock' ? state.dock : state.pages[editingRef.loc];
            const target = editingRef.index + dir;
            if (target < 0 || target >= arr.length) return;
            [arr[editingRef.index], arr[target]] = [arr[target], arr[editingRef.index]];
            editingRef.index = target;
            saveState();
            renderAll();
        }

        function saveAppModal() {
            const name = document.getElementById('fName').value.trim();
            const url = document.getElementById('fUrl').value.trim();
            const iconType = document.getElementById('fIconType').value;
            const iconUrl = document.getElementById('fIconUrl').value.trim();
            const newTab = document.getElementById('fNewTab').checked;
            const rawLoc = document.getElementById('fTargetLoc').value;
            const targetLoc = rawLoc === 'dock' ? 'dock' : Number(rawLoc);

            if (!name || !url) {
                alert('表示名とURLを入力してください');
                return;
            }

            const newApp = { name, url, iconType, iconUrl, newTab };

            if (editingRef) {
                const oldArr = editingRef.loc === 'dock' ? state.dock : state.pages[editingRef.loc];
                if (editingRef.loc === targetLoc) {
                    oldArr[editingRef.index] = newApp;
                } else {
                    oldArr.splice(editingRef.index, 1);
                    const newArr = targetLoc === 'dock' ? state.dock : state.pages[targetLoc];
                    newArr.push(newApp);
                }
            } else {
                const newArr = targetLoc === 'dock' ? state.dock : state.pages[targetLoc];
                newArr.push(newApp);
            }

            saveState();
            renderAll();
            closeAppModal();
        }

        /* =========================================================
           5. 壁紙管理
        ========================================================= */
        function applyWallpaper() {
            const el = document.getElementById('wallpaper');
            el.className = 'wallpaper';
            el.style.backgroundImage = '';
            if (state.customWallpaper) {
                el.style.backgroundImage = `url("${state.customWallpaper}")`;
            } else {
                el.classList.add(state.wallpaper || 'wp-1');
            }
            document.querySelectorAll('.wp-swatch').forEach(s => {
                s.classList.toggle('active', !state.customWallpaper && s.dataset.wp === state.wallpaper);
            });
        }

        function openWallpaperModal() { document.getElementById('wpModal').classList.add('open'); }
        function closeWallpaperModal() { document.getElementById('wpModal').classList.remove('open'); }

        function setWallpaperPreset(wp) {
            state.wallpaper = wp;
            state.customWallpaper = '';
            saveState();
            applyWallpaper();
        }

        function setWallpaperUrl() {
            const url = document.getElementById('wpCustomUrl').value.trim();
            if (!url) return;
            state.customWallpaper = url;
            saveState();
            applyWallpaper();
        }

        function handleWallpaperFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    state.customWallpaper = ev.target.result;
                    saveState();
                    applyWallpaper();
                } catch (err) {
                    alert('画像サイズが大きすぎるため保存できませんでした。小さい画像かURLをお試しください。');
                }
            };
            reader.readAsDataURL(file);
        }

        /* =========================================================
           6. Spotlight検索（アプリ絞り込み＋Web検索）
        ========================================================= */
        function openSpotlight() {
            document.getElementById('spotlightModal').classList.add('open');
            const inp = document.getElementById('spotlightInput');
            inp.value = '';
            renderSpotlightResults('');
            setTimeout(() => inp.focus(), 50);
        }

        function closeSpotlight() {
            document.getElementById('spotlightModal').classList.remove('open');
        }

        function getAllAppsUnique() {
            const map = new Map();
            [...state.dock, ...state.pages.flat()].forEach(a => {
                if (!map.has(a.name + a.url)) map.set(a.name + a.url, a);
            });
            return Array.from(map.values());
        }

        function renderSpotlightResults(query) {
            const box = document.getElementById('spotlightResults');
            box.innerHTML = '';
            const q = query.trim().toLowerCase();

            // 登録済みアプリのマッチ
            const matches = getAllAppsUnique().filter(a =>
                !q || a.name.toLowerCase().includes(q) || a.url.toLowerCase().includes(q)
            ).slice(0, 6);

            matches.forEach(app => {
                const a = document.createElement('a');
                a.className = 'spot-item';
                a.href = isSafeUrl(app.url) ? app.url : '#';
                if (app.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
                a.onclick = () => closeSpotlight();

                const iconWrap = renderIconElement(app);
                iconWrap.className = 'spot-mini-icon';

                const meta = document.createElement('div');
                meta.className = 'spot-meta';
                const n = document.createElement('span');
                n.className = 'spot-name';
                n.textContent = app.name;
                const s = document.createElement('span');
                s.className = 'spot-sub';
                s.textContent = app.url;
                meta.append(n, s);

                a.append(iconWrap, meta);
                box.appendChild(a);
            });

            // Web / アプリ検索アクション
            if (q) {
                const engines = [
                    { label: `Google で「${query}」を検索`, sub: 'Webブラウザで開く', url: `https://www.google.com/search?q=${encodeURIComponent(query)}`, icon: 'svg:google', newTab: true },
                    { label: `Googleアプリ で「${query}」を検索`, sub: 'Googleアプリを起動', url: `google://search?q=${encodeURIComponent(query)}`, icon: 'svg:google', newTab: false },
                    { label: `Googleドライブ で「${query}」を検索`, sub: 'ドライブ内を検索', url: `https://drive.google.com/drive/search?q=${encodeURIComponent(query)}`, icon: 'svg:drive', newTab: false },
                    { label: `YouTube で「${query}」を検索`, sub: 'YouTubeを開く', url: `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, icon: 'svg:youtube', newTab: false }
                ];
                engines.forEach(eng => {
                    const a = document.createElement('a');
                    a.className = 'spot-item';
                    a.href = eng.url;
                    if (eng.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
                    a.onclick = () => closeSpotlight();

                    const iconWrap = renderIconElement({ name: eng.label, url: eng.url, iconType: eng.icon });
                    iconWrap.className = 'spot-mini-icon';

                    const meta = document.createElement('div');
                    meta.className = 'spot-meta';
                    const n = document.createElement('span');
                    n.className = 'spot-name';
                    n.textContent = eng.label;
                    const s = document.createElement('span');
                    s.className = 'spot-sub';
                    s.textContent = eng.sub;
                    meta.append(n, s);

                    a.append(iconWrap, meta);
                    box.appendChild(a);
                });
            }
        }

        document.getElementById('spotlightInput').addEventListener('input', e => {
            renderSpotlightResults(e.target.value);
        });

        document.getElementById('spotlightInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const first = document.querySelector('#spotlightResults .spot-item');
                if (first) first.click();
            } else if (e.key === 'Escape') {
                closeSpotlight();
            }
        });

        // キーボードショートカット（Cmd+K / スラッシュでSpotlight、左右キーでページ切替）
        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openSpotlight();
            } else if (e.key === 'Escape') {
                closeSpotlight();
                closeAppModal();
                closeWallpaperModal();
            }
        });

        /* =========================================================
           7. 時計・バックグラウンド対応タイマー・メモ・ToDo
        ========================================================= */
        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('statusTime').textContent = `${hh}:${mm}`;
            const dateStr = now.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
            document.getElementById('statusDate').textContent = dateStr;

            const wc = document.getElementById('wClock');
            const wd = document.getElementById('wDate');
            if (wc) wc.textContent = `${hh}:${mm}:${ss}`;
            if (wd) wd.textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }
        setInterval(updateClock, 1000);

        let durationSec = 25 * 60;
        let remainingSec = durationSec;
        let endTime = null;
        let timerInterval = null;

        function renderTimerDisplay() {
            const el = document.getElementById('wTimer');
            const btn = document.getElementById('wStartBtn');
            const st = document.getElementById('wTimerStatus');
            if (!el) return;
            const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
            const s = String(remainingSec % 60).padStart(2, '0');
            el.textContent = `${m}:${s}`;
            if (btn) btn.textContent = timerInterval ? '停止' : '開始';
            if (st) st.textContent = timerInterval ? '計測中' : (remainingSec === 0 ? '終了' : 'Ready');
        }

        function tickTimer() {
            if (!endTime) return;
            remainingSec = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
            if (remainingSec <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                endTime = null;
            }
            renderTimerDisplay();
        }

        function toggleTimer() {
            if (timerInterval) {
                tickTimer();
                clearInterval(timerInterval);
                timerInterval = null;
                endTime = null;
            } else {
                if (remainingSec <= 0) remainingSec = durationSec;
                endTime = Date.now() + remainingSec * 1000;
                timerInterval = setInterval(tickTimer, 250);
            }
            renderTimerDisplay();
        }

        function setTimer(min) {
            clearInterval(timerInterval);
            timerInterval = null;
            endTime = null;
            durationSec = min * 60;
            remainingSec = durationSec;
            renderTimerDisplay();
        }

        function addMinute() {
            remainingSec += 60;
            if (endTime) endTime += 60000;
            renderTimerDisplay();
        }

        function resetTimer() { setTimer(durationSec / 60); }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && endTime) tickTimer();
        });

        let todos = JSON.parse(localStorage.getItem('ipad_dashboard_todos') || '[]');

        function renderTodos() {
            const list = document.getElementById('wTodoList');
            if (!list) return;
            list.innerHTML = '';
            todos.forEach((t, i) => {
                const row = document.createElement('div');
                row.className = 'todo-row' + (t.done ? ' done' : '');

                const chk = document.createElement('button');
                chk.type = 'button';
                chk.className = 'todo-check';
                if (t.done) chk.innerHTML = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>`;
                chk.onclick = () => {
                    todos[i].done = !todos[i].done;
                    localStorage.setItem('ipad_dashboard_todos', JSON.stringify(todos));
                    renderTodos();
                };

                const span = document.createElement('span');
                span.textContent = t.text;

                row.append(chk, span);
                list.appendChild(row);
            });
        }

        function addTodo(e) {
            e.preventDefault();
            const inp = document.getElementById('wTodoInput');
            const text = inp.value.trim();
            if (!text) return;
            todos.unshift({ text, done: false });
            localStorage.setItem('ipad_dashboard_todos', JSON.stringify(todos));
            inp.value = '';
            renderTodos();
        }

        function clearDoneTodos() {
            todos = todos.filter(t => !t.done);
            localStorage.setItem('ipad_dashboard_todos', JSON.stringify(todos));
            renderTodos();
        }

        function initWidgets() {
            renderTimerDisplay();
            const memo = document.getElementById('wMemo');
            if (memo) {
                memo.value = localStorage.getItem('ipad_dashboard_memo') || '';
                let t;
                memo.oninput = () => {
                    localStorage.setItem('ipad_dashboard_memo', memo.value);
                    const st = document.getElementById('wMemoStatus');
                    if (st) {
                        st.textContent = '保存済み';
                        clearTimeout(t);
                        t = setTimeout(() => { st.textContent = ''; }, 1000);
                    }
                };
            }
            renderTodos();
        }

        // 初期起動
        applyWallpaper();
        renderAll();
    </script>
</body>
</html>
