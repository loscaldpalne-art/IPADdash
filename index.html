<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRID // OS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* =========================================================
           テーマ定義（全体色統一・直角・ミニマル）
        ========================================================= */
        :root, [data-theme="obsidian"] {
            --bg: #0b0b0d;
            --surface: #131317;
            --surface-alt: #1b1b21;
            --border: #2a2a33;
            --border-strong: #4a4a58;
            --fg: #f4f4f6;
            --muted: #8a8a98;
            --accent: #ffffff;
            --accent-fg: #0b0b0d;
            --danger: #ef4444;
        }
        [data-theme="paper"] {
            --bg: #eaeae6;
            --surface: #f4f4f0;
            --surface-alt: #e1e1dc;
            --border: #c8c8c0;
            --border-strong: #888880;
            --fg: #141413;
            --muted: #686862;
            --accent: #141413;
            --accent-fg: #f4f4f0;
            --danger: #dc2626;
        }
        [data-theme="orange"] {
            --bg: #111113;
            --surface: #18181b;
            --surface-alt: #222227;
            --border: #32323a;
            --border-strong: #ff5500;
            --fg: #f4f4f5;
            --muted: #8e8e98;
            --accent: #ff5500;
            --accent-fg: #ffffff;
            --danger: #ef4444;
        }
        [data-theme="blueprint"] {
            --bg: #08121e;
            --surface: #0d1b2c;
            --surface-alt: #13253b;
            --border: #1e3a5f;
            --border-strong: #38bdf8;
            --fg: #e0f2fe;
            --muted: #7dd3fc;
            --accent: #38bdf8;
            --accent-fg: #08121e;
            --danger: #f87171;
        }
        [data-theme="terminal"] {
            --bg: #070d09;
            --surface: #0c1610;
            --surface-alt: #122118;
            --border: #1c3827;
            --border-strong: #4ade80;
            --fg: #dcfce7;
            --muted: #6ee7b7;
            --accent: #4ade80;
            --accent-fg: #070d09;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* 完全カクカク保証 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .mono {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
        }

        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            touch-action: manipulation;
        }

        /* 背景全面塗り（iPadOSセーフエリアの黒帯を根本排除） */
        .bg-bleed {
            position: fixed;
            inset: -120px;
            background: var(--bg);
            background-image:
                linear-gradient(to right, var(--border) 1px, transparent 1px),
                linear-gradient(to bottom, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.28;
            z-index: 0;
            pointer-events: none;
        }

        .os-shell {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            padding-top: max(26px, env(safe-area-inset-top, 20px));
            padding-bottom: max(10px, env(safe-area-inset-bottom, 6px));
        }

        /* ====== トップバー ====== */
        .top-bar {
            height: 40px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
            gap: 10px;
        }

        .page-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .page-tabs::-webkit-scrollbar { display: none; }

        .tab-chip {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-chip.active {
            color: var(--accent-fg);
            background: var(--accent);
            border-color: var(--accent);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sharp {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            color: var(--fg);
            border: 1px solid var(--border);
            padding: 5px 11px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-sharp:hover { border-color: var(--border-strong); }
        .btn-sharp:active { background: var(--surface-alt); }
        .btn-sharp.primary {
            background: var(--accent);
            color: var(--accent-fg);
            border-color: var(--accent);
        }
        .btn-sharp.danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-sharp svg { width: 13px; height: 13px; }

        /* ====== 編集インスペクタバー（編集モード時のみ展開） ====== */
        .edit-inspector {
            display: none;
            padding: 8px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .editing .edit-inspector { display: flex; }

        .inspector-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.74rem;
            color: var(--muted);
        }
        .inspector-left strong { color: var(--fg); }

        .inspector-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* ====== ページスワイプビューポート ====== */
        .pages-track {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .pages-track::-webkit-scrollbar { display: none; }

        .page-pane {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow-y: auto;
            padding: 18px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 正方形アイコン＋長方形ウィジェットの厳密グリッド */
        .bento-grid {
            --cols: 6;
            --gap: 12px;
            --cell: 108px;
            width: 100%;
            max-width: 880px;
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            grid-auto-rows: var(--cell);
            grid-auto-flow: dense;
            gap: var(--gap);
        }

        /* ====== タイル共通 ====== */
        .tile {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--fg);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.12s, background-color 0.12s;
        }
        .tile:hover { border-color: var(--border-strong); }
        .tile:active { background: var(--surface-alt); }

        /* 選択・ドラッグ状態 */
        .tile.is-selected {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            z-index: 3;
        }
        .tile.drop-target {
            outline: 2px dashed var(--accent);
            outline-offset: -2px;
            background: var(--surface-alt);
        }
        .tile.is-dragging {
            opacity: 0.35;
        }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            background: var(--surface-alt);
            border: 2px solid var(--accent);
            opacity: 0.92;
            transform: translate(-50%, -50%);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
        }

        /* アプリ（1x1 完全正方形） */
        .tile.is-app {
            align-items: center;
            justify-content: center;
            padding: 10px 6px 8px;
            gap: 8px;
        }
        .app-glyph {
            width: 38%;
            height: 38%;
            min-width: 28px;
            min-height: 28px;
            max-width: 44px;
            max-height: 44px;
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-glyph svg { width: 100%; height: 100%; display: block; }
        .app-title {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }

        /* 編集モード用左上番号/削除バッジ */
        .tile-badge {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            background: var(--accent);
            color: var(--accent-fg);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            z-index: 4;
        }
        .editing .tile-badge { display: block; }

        /* ウィジェットサイズ（長方形パネル） */
        .tile.sz-2x1 { grid-column: span 2; grid-row: span 1; }
        .tile.sz-2x2 { grid-column: span 2; grid-row: span 2; }
        .tile.sz-3x2 { grid-column: span 3; grid-row: span 2; }
        .tile.sz-4x2 { grid-column: span 4; grid-row: span 2; }
        .tile.sz-6x2 { grid-column: span 6; grid-row: span 2; }

        /* ウィジェット内部レイアウト */
        .w-panel {
            width: 100%;
            height: 100%;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .w-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        /* 時計ウィジェット */
        .w-clock-time {
            font-size: clamp(2rem, 4.2vw, 3.2rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }
        .w-clock-date {
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
            margin-top: 6px;
        }

        /* 天気ウィジェット */
        .w-weather-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .w-weather-temp {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .w-weather-svg { width: 100%; height: 42px; overflow: visible; }
        .w-weather-hours {
            display: flex;
            justify-content: space-between;
            font-size: 0.66rem;
            color: var(--muted);
        }
        .w-rain-bars {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
            height: 20px;
            margin-top: 4px;
        }
        .w-rain-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .w-rain-fill { width: 100%; background: var(--accent); opacity: 0.65; min-height: 2px; }
        .w-rain-txt { font-size: 0.6rem; color: var(--muted); }

        /* タイマーウィジェット */
        .w-timer-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .w-timer-num { font-size: 2.3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        .w-timer-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

        /* オーディオデッキ（レコード）ウィジェット */
        .w-audio-body {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }
        .w-disc {
            width: 72px;
            height: 72px;
            border: 2px solid var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }
        .w-disc-inner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent);
            background: var(--surface-alt);
        }
        .w-disc.playing {
            animation: spinStep 4s linear infinite;
        }
        @keyframes spinStep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* メモ・ToDo・時間割 */
        .w-textarea {
            width: 100%;
            flex: 1;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 0.88rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }
        .w-input-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .w-input {
            flex: 1;
            min-width: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 8px;
            font-size: 0.82rem;
            outline: none;
        }
        .w-input:focus { border-color: var(--accent); }
        .w-todo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .w-todo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .w-todo-row.done span { text-decoration: line-through; color: var(--muted); }
        .w-todo-row span { flex: 1; word-break: break-word; }
        .w-chk {
            width: 15px;
            height: 15px;
            border: 1.5px solid var(--fg);
            background: transparent;
            color: var(--accent-fg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .w-todo-row.done .w-chk { background: var(--accent); border-color: var(--accent); }

        .w-sch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            flex: 1;
        }
        .w-sch-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            padding: 3px 7px;
        }
        .w-sch-cell span { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
        .w-sch-cell input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 0.8rem;
            outline: none;
        }

        /* ====== 下部 Dock バー ====== */
        .dock-wrap {
            flex-shrink: 0;
            padding: 8px 20px 2px;
            display: flex;
            justify-content: center;
        }
        .dock-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px;
            max-width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .dock-bar::-webkit-scrollbar { display: none; }
        .dock-item {
            position: relative;
            width: 56px;
            height: 56px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .dock-item:hover { border-color: var(--border-strong); }
        .dock-item.is-selected { outline: 2px solid var(--accent); outline-offset: -2px; }
        .dock-item svg { width: 22px; height: 22px; }
        .dock-item span {
            font-size: 0.56rem;
            font-weight: 600;
            max-width: 50px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
        }

        /* ====== モーダル ====== */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.72);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-bg.open { display: flex; }

        .modal-panel {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 86vh;
            overflow-y: auto;
        }
        .modal-panel h3 {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
        .field input, .field select, .field textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 9px 11px;
            font-size: 0.88rem;
            outline: none;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); }

        .icon-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .ip-btn {
            aspect-ratio: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 10px;
        }
        .ip-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-fg);
        }
        .ip-btn svg { width: 100%; height: 100%; }

        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .theme-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 10px;
            text-align: left;
            cursor: pointer;
        }
        .theme-btn.active { border-color: var(--accent); background: var(--surface-alt); }
        .theme-btn strong { display: block; font-size: 0.82rem; }
        .theme-btn span { font-size: 0.7rem; color: var(--muted); }

        /* 検索モーダル */
        .search-modal { align-items: flex-start; padding-top: 10vh; }
        .search-box {
            width: 100%;
            max-width: 540px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
        }
        .search-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
        .search-head input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 1rem;
            outline: none;
        }
        .search-list { max-height: 48vh; overflow-y: auto; }
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: var(--fg);
            cursor: pointer;
        }
        .search-row:hover, .search-row.focused { background: var(--surface-alt); }
        .search-row svg { width: 20px; height: 20px; flex-shrink: 0; }

        /* トースト（元に戻す通知） */
        .toast {
            position: fixed;
            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--accent-fg);
            padding: 8px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 300;
        }
        .toast.show { display: flex; }

        @media (max-width: 720px) {
            .page-pane { padding: 12px; }
            .bento-grid { --cols: 4; --gap: 8px; }
            .tile.sz-6x2 { grid-column: span 4; }
            .tile.sz-4x2 { grid-column: span 4; }
            .tile.sz-3x2 { grid-column: span 4; }
        }
    </style>
</head>
<body data-theme="obsidian">

    <div class="bg-bleed"></div>

    <div class="os-shell" id="osShell">
        <!-- トップバー -->
        <header class="top-bar">
            <div class="page-tabs" id="pageTabs"></div>
            <div class="top-actions">
                <button class="btn-sharp mono" onclick="openSearch()">SEARCH [/]</button>
                <button class="btn-sharp mono" onclick="openThemeModal()">THEME</button>
                <button class="btn-sharp mono" id="editBtn" onclick="toggleEditMode()">EDIT [E]</button>
            </div>
        </header>

        <!-- 編集インスペクタ（編集モード時のみ表示・絶対バグらない操作系） -->
        <div class="edit-inspector">
            <div class="inspector-left mono" id="selInfo">SELECT A TILE (OR USE ARROWS)</div>
            <div class="inspector-controls">
                <button class="btn-sharp" onclick="moveSelected(-1)" title="前へ (Shift+←)">◀ 前へ</button>
                <button class="btn-sharp" onclick="moveSelected(1)" title="次へ (Shift+→)">次へ ▶</button>
                <button class="btn-sharp" id="btnResize" style="display:none;" onclick="cycleSelectedSize()">サイズ変更</button>
                <button class="btn-sharp" id="btnEditSel" onclick="editSelectedItem()">設定</button>
                <button class="btn-sharp danger" onclick="deleteSelectedItem()">削除</button>

        /* =========================================================

        const GLYPHS = {

            web:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><ellipse cx="12" cy="12" rx="4" ry="9"/></svg>`,
            book:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5h8v14H2zM14 5h8v14h-8z"/><line x1="10" y1="5" x2="14" y2="5"/></svg>`,

        };

        /* =========================================================
           2. 状態管理・Undoスタック
        ========================================================= */
        const STORAGE_KEY = 'grid_os_v1';

        const DEFAULT_STATE = {
            theme: 'obsidian',
            cols: 6,
            dock: [
                { type: 'app', name: 'ロイロノート', url: 'https://loilonote.app', icon: 'loilo', newTab: false },
                { type: 'app', name: 'Google', url: 'https://www.google.com/', icon: 'google', newTab: true },
                { type: 'app', name: 'Classroom', url: 'https://classroom.google.com/', icon: 'classroom', newTab: false },
                { type: 'app', name: 'ドライブ', url: 'https://drive.google.com/', icon: 'drive', newTab: false },
                { type: 'app', name: 'YouTube', url: 'https://www.youtube.com/', icon: 'youtube', newTab: false },
                { type: 'app', name: 'Notion', url: 'https://www.notion.so/', icon: 'notion', newTab: true }
            ],
            pages: [
                {
                    title: '01 MAIN',
                    items: [
                        { type: 'widget', widgetType: 'clock', size: '3x2', id: 'w_clk_1' },
                        { type: 'widget', widgetType: 'weather', size: '3x2', id: 'w_wth_1' },
                        { type: 'app', name: 'ロイロノート', url: 'https://loilonote.app', icon: 'loilo', newTab: false },
                        { type: 'app', name: 'Google', url: 'https://www.google.com/', icon: 'google', newTab: true },
                        { type: 'app', name: 'Classroom', url: 'https://classroom.google.com/', icon: 'classroom', newTab: false },
                        { type: 'app', name: 'ドライブ', url: 'https://drive.google.com/', icon: 'drive', newTab: false },
                        { type: 'app', name: 'ドキュメント', url: 'https://docs.google.com/document/', icon: 'docs', newTab: false },
                        { type: 'app', name: 'スプレッドシート', url: 'https://docs.google.com/spreadsheets/', icon: 'sheets', newTab: false },
                        { type: 'app', name: 'スライド', url: 'https://docs.google.com/presentation/', icon: 'slides', newTab: false },
                        { type: 'app', name: 'マップ', url: 'https://maps.google.com/', icon: 'maps', newTab: false },
                        { type: 'app', name: 'YouTube', url: 'https://www.youtube.com/', icon: 'youtube', newTab: false },
                        { type: 'app', name: 'Gmail', url: 'https://mail.google.com/', icon: 'gmail', newTab: false },
                        { type: 'app', name: 'Meet', url: 'https://meet.google.com/', icon: 'meet', newTab: false },
                        { type: 'app', name: 'Gemini', url: 'https://gemini.google.com/', icon: 'gemini', newTab: true }
                    ]
                },
                {
                    title: '02 WORKSPACE',
                    items: [
                        { type: 'widget', widgetType: 'note', size: '3x2', id: 'w_note_1', storageKey: 'ipad_dashboard_memo' },
                        { type: 'widget', widgetType: 'todo', size: '3x2', id: 'w_todo_1' },
                        { type: 'widget', widgetType: 'timer', size: '2x2', id: 'w_tmr_1' },
                        { type: 'widget', widgetType: 'audio', size: '2x2', id: 'w_aud_1' },
                        { type: 'app', name: 'Notion', url: 'https://www.notion.so/', icon: 'notion', newTab: true },
                        { type: 'app', name: 'Canva', url: 'https://www.canva.com/', icon: 'canva', newTab: true },
                        { type: 'app', name: 'GitHub', url: 'https://github.com/', icon: 'github', newTab: true },
                        { type: 'app', name: 'Wikipedia', url: 'https://ja.wikipedia.org/', icon: 'wikipedia', newTab: true },
                        { type: 'app', name: 'DeepL', url: 'https://www.deepl.com/ja/translator', icon: 'deepl', newTab: true },
                        { type: 'app', name: '翻訳', url: 'https://translate.google.com/', icon: 'translate', newTab: true },
                        { type: 'app', name: 'カレンダー', url: 'https://calendar.google.com/', icon: 'calendar', newTab: false },
                        { type: 'widget', widgetType: 'schedule', size: '4x2', id: 'w_sch_1' }
                    ]
                }
            ]
        };

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || structuredClone(DEFAULT_STATE);
        let undoStack = [];
        let isEditMode = false;
        let currentPage = 0;
        let selected = null; // { loc: 'dock' | number, idx: number }

        function pushUndo() {
            undoStack.push(JSON.stringify(state));
            if (undoStack.length > 25) undoStack.shift();
            document.getElementById('btnUndo').style.display = 'inline-flex';
        }

        function undoAction() {
            if (!undoStack.length) return;
            state = JSON.parse(undoStack.pop());
            saveState();
            selected = null;
            renderAll();
            document.getElementById('btnUndo').style.display = undoStack.length ? 'inline-flex' : 'none';
            document.getElementById('undoToast').classList.remove('show');
        }

        function showUndoToast(msg) {
            const t = document.getElementById('undoToast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tm);
            t._tm = setTimeout(() => t.classList.remove('show'), 4000);
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function isSafeUrl(url) {
            return !/^\s*javascript:/i.test(url);
        }

        function escapeHtml(s) {
            return String(s).replace(/[<>&"']/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;', "'":'&#39;' }[c]));
        }

        /* =========================================================
           3. テーマ・列数・正方形サイズの精密計算
        ========================================================= */
        function applyTheme() {
            document.body.dataset.theme = state.theme || 'obsidian';
            document.querySelectorAll('.theme-btn[data-t]').forEach(b => {
                b.classList.toggle('active', b.dataset.t === (state.theme || 'obsidian'));
            });
            document.getElementById('fCols').value = String(state.cols || 6);
            recalcGridCells();
        }

        function setTheme(t) { state.theme = t; saveState(); applyTheme(); }
        function setCols(c) { state.cols = Number(c); saveState(); recalcGridCells(); }

        function recalcGridCells() {
            const isMobile = window.innerWidth <= 720;
            const cols = isMobile ? 4 : (state.cols || 6);
            const gap = isMobile ? 8 : 12;
            document.querySelectorAll('.bento-grid').forEach(grid => {
                grid.style.setProperty('--cols', cols);
                grid.style.setProperty('--gap', `${gap}px`);
                const w = grid.clientWidth;
                if (w > 0) {
                    const cell = Math.floor((w - gap * (cols - 1)) / cols);
                    grid.style.setProperty('--cell', `${cell}px`);
                }
            });
        }
        window.addEventListener('resize', recalcGridCells);

        /* =========================================================
           4. タイマー / オーディオ / 天気データ
        ========================================================= */
        let durSec = 25 * 60, remSec = durSec, endTime = null, tInt = null;

        function renderTimers() {
            const m = String(Math.floor(remSec / 60)).padStart(2, '0');
            const s = String(remSec % 60).padStart(2, '0');
            document.querySelectorAll('.js-tmr-num').forEach(el => el.textContent = `${m}:${s}`);
            document.querySelectorAll('.js-tmr-btn').forEach(b => b.textContent = tInt ? 'PAUSE' : 'START');
        }
        function tickTimer() {
            if (!endTime) return;
            remSec = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
            if (remSec <= 0) { clearInterval(tInt); tInt = null; endTime = null; }
            renderTimers();
        }
        function toggleTimer() {
            if (tInt) { tickTimer(); clearInterval(tInt); tInt = null; endTime = null; }
            else { if (remSec <= 0) remSec = durSec; endTime = Date.now() + remSec * 1000; tInt = setInterval(tickTimer, 250); }
            renderTimers();
        }
        function setTimerMin(min) {
            clearInterval(tInt); tInt = null; endTime = null; durSec = min * 60; remSec = durSec; renderTimers();
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden && endTime) tickTimer(); });

        // Web Audio Lo-Fi シンセ
        let audioCtx = null, isPlaying = false, songIdx = 0, step = 0, audInt = null;
        const TRACKS = [
            { name: '01 / MIDNIGHT CHORDS', chords: [[261.6,311.1,392,466.2],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,349.2]] },
            { name: '02 / STUDY TAPE', chords: [[293.7,349.2,440,523.3],[246.9,293.7,370,440],[196,246.9,293.7,370],[220,277.2,329.6,415.3]] }
        ];
        function playChord(freqs) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            freqs.forEach(f => {
                const o = audioCtx.createOscillator(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(f, now);
                fl.type = 'lowpass'; fl.frequency.setValueAtTime(750, now);
                g.gain.setValueAtTime(0.001, now);
                g.gain.linearRampToValueAtTime(0.04, now + 0.12);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
                o.connect(fl); fl.connect(g); g.connect(audioCtx.destination);
                o.start(now); o.stop(now + 2.2);
            });
        }
        function toggleAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = !isPlaying; clearInterval(audInt);
            if (isPlaying) {
                playChord(TRACKS[songIdx].chords[step]); step = (step + 1) % 4;
                audInt = setInterval(() => { playChord(TRACKS[songIdx].chords[step]); step = (step + 1) % 4; }, 2200);
            }
            syncAudioUI();
        }
        function nextAudio() {
            songIdx = (songIdx + 1) % TRACKS.length; step = 0;
            if (isPlaying) playChord(TRACKS[songIdx].chords[0]);
            syncAudioUI();
        }
        function syncAudioUI() {
            document.querySelectorAll('.js-disc').forEach(el => el.classList.toggle('playing', isPlaying));
            document.querySelectorAll('.js-aud-btn').forEach(b => b.textContent = isPlaying ? 'STOP' : 'PLAY');
            document.querySelectorAll('.js-aud-name').forEach(el => el.textContent = TRACKS[songIdx].name);
        }

        // 天気データ (Open-Meteo + オフライン標準)
        let weather = { city: 'TOKYO', cond: 'CLEAR / CLOUDY', temp: 18, hi: 21, lo: 12, hours: ['12H','15H','18H','21H','00H'], temps: [18,21,17,14,12], rain: [10,20,40,15,5] };
        async function loadWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=2');
                if (!res.ok) return;
                const d = await res.json();
                const ch = new Date().getHours();
                const hrs = [], tmps = [], rns = [];
                for (let i = 0; i < 5; i++) {
                    const idx = ch + i * 3;
                    hrs.push(`${String(idx % 24).padStart(2,'0')}H`);
                    tmps.push(Math.round(d.hourly.temperature_2m[idx] ?? 18));
                    rns.push(d.hourly.precipitation_probability[idx] ?? 10);
                }
                const c = d.current.weather_code;
                weather = {
                    city: 'TOKYO',
                    cond: c <= 1 ? 'CLEAR' : c <= 3 ? 'PARTLY CLOUDY' : c <= 48 ? 'CLOUDY' : 'RAIN',
                    temp: Math.round(d.current.temperature_2m),
                    hi: Math.round(d.daily.temperature_2m_max[0]),
                    lo: Math.round(d.daily.temperature_2m_min[0]),
                    hours: hrs, temps: tmps, rain: rns
                };
                document.querySelectorAll('.js-weather-panel').forEach(el => el.innerHTML = buildWeatherInner());
            } catch (e) {}
        }

        function buildWeatherInner() {
            const minT = Math.min(...weather.temps) - 1, maxT = Math.max(...weather.temps) + 1;
            const span = Math.max(1, maxT - minT);
            const pts = weather.temps.map((t, i) => [i * 60, Math.round(34 - ((t - minT) / span) * 24)]);
            const poly = pts.map(p => p.join(',')).join(' ');
            return `
                <div class="w-head mono"><span>${weather.city} // ${weather.cond}</span><span>H:${weather.hi}° L:${weather.lo}°</span></div>
                <div class="w-weather-top">
                    <div class="w-weather-temp mono">${weather.temp}°C</div>
                </div>
                <svg class="w-weather-svg" viewBox="0 0 240 42">
                    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${poly}"/>
                    ${pts.map(([x, y], i) => `<rect x="${x-2.5}" y="${y-2.5}" width="5" height="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.8"/><text x="${x}" y="${Math.max(8, y-6)}" text-anchor="${i===0?'start':(i===4?'end':'middle')}" fill="var(--fg)" font-size="9" font-weight="700">${weather.temps[i]}°</text>`).join('')}
                </svg>
                <div class="w-weather-hours mono">${weather.hours.map(h => `<span>${h}</span>`).join('')}</div>
                <div class="w-rain-bars">${weather.rain.map(r => `<div class="w-rain-col"><div class="w-rain-fill" style="height:${Math.max(2, Math.round(r*0.14))}px"></div><span class="w-rain-txt mono">${r}%</span></div>`).join('')}</div>
            `;
        }

        /* =========================================================
           5. ウィジェットビルダー
        ========================================================= */
        let todos = JSON.parse(localStorage.getItem('ipad_dashboard_todos') || '[]');
        function saveTodos() { localStorage.setItem('ipad_dashboard_todos', JSON.stringify(todos)); renderTodos(); }
        function renderTodos() {
            document.querySelectorAll('.js-todo-ul').forEach(ul => {
                ul.innerHTML = '';
                todos.forEach((t, i) => {
                    const row = document.createElement('div');
                    row.className = 'w-todo-row' + (t.done ? ' done' : '');
                    const chk = document.createElement('button');
                    chk.className = 'w-chk';
                    chk.textContent = t.done ? '×' : '';
                    chk.onclick = e => { e.stopPropagation(); todos[i].done = !todos[i].done; saveTodos(); };
                    const sp = document.createElement('span');
                    sp.textContent = t.text;
                    row.append(chk, sp);
                    ul.appendChild(row);
                });
            });
        }

        function buildWidgetPanel(w) {
            const p = document.createElement('div');
            p.className = 'w-panel';
            if (w.widgetType === 'clock') {
                p.innerHTML = `
                    <div class="w-head mono"><span>SYSTEM CLOCK</span><span>JST</span></div>
                    <div>
                        <div class="w-clock-time mono js-clk-time">00:00:00</div>
                        <div class="w-clock-date js-clk-date">---</div>
                    </div>`;
            } else if (w.widgetType === 'weather') {
                p.classList.add('js-weather-panel');
                p.innerHTML = buildWeatherInner();
            } else if (w.widgetType === 'timer') {
                p.innerHTML = `
                    <div class="w-head mono"><span>FOCUS TIMER</span><span>AUTO</span></div>
                    <div class="w-timer-row">
                        <div class="w-timer-num mono js-tmr-num">25:00</div>
                        <button class="btn-sharp primary mono js-tmr-btn" onclick="event.stopPropagation(); toggleTimer()">START</button>
                    </div>
                    <div class="w-timer-btns">
                        <button class="btn-sharp mono" onclick="event.stopPropagation(); setTimerMin(25)">25M</button>
                        <button class="btn-sharp mono" onclick="event.stopPropagation(); setTimerMin(10)">10M</button>
                        <button class="btn-sharp mono" onclick="event.stopPropagation(); setTimerMin(5)">5M</button>
                    </div>`;
            } else if (w.widgetType === 'audio') {
                p.innerHTML = `
                    <div class="w-head mono"><span>AUDIO DECK</span><span class="js-aud-name">${TRACKS[songIdx].name}</span></div>
                    <div class="w-audio-body">
                        <div class="w-disc js-disc ${isPlaying?'playing':''}"><div class="w-disc-inner"></div></div>
                        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
                            <button class="btn-sharp primary mono js-aud-btn" style="justify-content:center;" onclick="event.stopPropagation(); toggleAudio()">${isPlaying?'STOP':'PLAY'}</button>
                            <button class="btn-sharp mono" style="justify-content:center;" onclick="event.stopPropagation(); nextAudio()">NEXT</button>
                        </div>
                    </div>`;
            } else if (w.widgetType === 'note') {
                const key = w.storageKey || `grid_note_${w.id}`;
                p.innerHTML = `<div class="w-head mono"><span>NOTES</span><span>AUTO-SAVE</span></div>`;
                const ta = document.createElement('textarea');
                ta.className = 'w-textarea';
                ta.placeholder = 'メモを入力...';
                ta.value = localStorage.getItem(key) || '';
                ta.oninput = () => localStorage.setItem(key, ta.value);
                ta.addEventListener('pointerdown', e => { if (!isEditMode) e.stopPropagation(); });
                p.appendChild(ta);
            } else if (w.widgetType === 'todo') {
                p.innerHTML = `
                    <div class="w-head mono"><span>TODO</span><button class="btn-sharp" style="padding:2px 6px; font-size:0.65rem;" onclick="event.stopPropagation(); todos=todos.filter(x=>!x.done); saveTodos();">CLEAR</button></div>
                    <form class="w-input-row" onsubmit="event.preventDefault(); const i=this.querySelector('input'); if(i.value.trim()){ todos.unshift({text:i.value.trim(),done:false}); i.value=''; saveTodos(); }">
                        <input class="w-input" placeholder="タスク追加..." onpointerdown="if(!isEditMode) event.stopPropagation()">
                        <button class="btn-sharp primary" type="submit">＋</button>
                    </form>
                    <div class="w-todo-list js-todo-ul"></div>`;
            } else if (w.widgetType === 'schedule') {
                const skey = `grid_sch_${w.id}`;
                const arr = JSON.parse(localStorage.getItem(skey) || '["","","","","",""]');
                p.innerHTML = `<div class="w-head mono"><span>TIMETABLE</span><span>1-6</span></div>`;
                const g = document.createElement('div');
                g.className = 'w-sch-grid';
                for (let i = 0; i < 6; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'w-sch-cell';
                    cell.innerHTML = `<span class="mono">${i + 1}</span>`;
                    const inp = document.createElement('input');
                    inp.placeholder = `${i + 1}限`;
                    inp.value = arr[i] || '';
                    inp.oninput = () => { arr[i] = inp.value; localStorage.setItem(skey, JSON.stringify(arr)); };
                    inp.addEventListener('pointerdown', e => { if (!isEditMode) e.stopPropagation(); });
                    cell.appendChild(inp);
                    g.appendChild(cell);
                }
                p.appendChild(g);
            }
            return p;
        }

        /* =========================================================
           6. 絶対にバグらないドラッグ＆選択システム
              （※ドラッグ中はDOMを一切書き換えず、Drop時に1回だけ確定）
        ========================================================= */
        let dragState = null;

        function startSafeDrag(el, loc, idx, e) {
            const rc = el.getBoundingClientRect();
            const ghost = el.cloneNode(true);
            ghost.className = 'drag-ghost';
            ghost.style.width = `${rc.width}px`;
            ghost.style.height = `${rc.height}px`;
            ghost.style.left = `${e.clientX}px`;
            ghost.style.top = `${e.clientY}px`;
            document.body.appendChild(ghost);

            el.classList.add('is-dragging');
            document.getElementById('pagesTrack').style.overflowX = 'hidden';

            dragState = { el, loc, idx, ghost, dropLoc: null, dropIdx: null };
        }

        window.addEventListener('pointermove', e => {
            if (!dragState) return;
            dragState.ghost.style.left = `${e.clientX}px`;
            dragState.ghost.style.top = `${e.clientY}px`;

            document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
            dragState.dropLoc = null;
            dragState.dropIdx = null;

            const under = document.elementFromPoint(e.clientX, e.clientY);
            const targetTile = under?.closest('.tile, .dock-item');
            if (targetTile && targetTile !== dragState.el) {
                targetTile.classList.add('drop-target');
                dragState.dropLoc = targetTile.dataset.loc === 'dock' ? 'dock' : Number(targetTile.dataset.loc);
                dragState.dropIdx = Number(targetTile.dataset.idx);
            }
        });

        function endSafeDrag() {
            if (!dragState) return;
            const { el, loc, idx, ghost, dropLoc, dropIdx } = dragState;
            ghost.remove();
            el.classList.remove('is-dragging');
            document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
            document.getElementById('pagesTrack').style.overflowX = 'auto';

            if (dropLoc !== null && dropIdx !== null && !(dropLoc === loc && dropIdx === idx)) {
                pushUndo();
                const srcArr = loc === 'dock' ? state.dock : state.pages[loc].items;
                const dstArr = dropLoc === 'dock' ? state.dock : state.pages[dropLoc].items;
                const moving = srcArr[idx];
                // ウィジェットはDockに入れないガード
                if (!(dropLoc === 'dock' && moving.type === 'widget')) {
                    srcArr.splice(idx, 1);
                    dstArr.splice(dropIdx, 0, moving);
                    selected = { loc: dropLoc, idx: dropIdx };
                    saveState();
                    renderAll();
                }
            }
            dragState = null;
        }
        window.addEventListener('pointerup', endSafeDrag);
        window.addEventListener('pointercancel', endSafeDrag);

        /* =========================================================
           7. 全体描画
        ========================================================= */
        function createTile(item, loc, idx) {
            const isSel = selected && selected.loc === loc && selected.idx === idx;
            const el = document.createElement(item.type === 'app' ? 'a' : 'div');
            el.dataset.loc = String(loc);
            el.dataset.idx = String(idx);

            if (loc === 'dock') {
                el.className = 'dock-item' + (isSel ? ' is-selected' : '');
                el.href = isSafeUrl(item.url) ? item.url : '#';
                if (item.newTab) { el.target = '_blank'; el.rel = 'noopener'; }
                el.innerHTML = (GLYPHS[item.icon] || GLYPHS.web) + `<span>${escapeHtml(item.name)}</span>`;
            } else {
                el.className = 'tile ' + (item.type === 'app' ? 'is-app' : `sz-${item.size || '2x2'}`) + (isSel ? ' is-selected' : '');
                if (item.type === 'app') {
                    el.href = isSafeUrl(item.url) ? item.url : '#';
                    if (item.newTab) { el.target = '_blank'; el.rel = 'noopener'; }
                    el.innerHTML = `
                        <div class="app-glyph">${GLYPHS[item.icon] || GLYPHS.web}</div>
                        <div class="app-title">${escapeHtml(item.name)}</div>
                    `;
                } else {
                    el.appendChild(buildWidgetPanel(item));
                }
                const badge = document.createElement('span');
                badge.className = 'tile-badge mono';
                badge.textContent = item.type === 'app' ? `${idx + 1}` : (item.size || '2x2').toUpperCase();
                el.appendChild(badge);
            }

            // ポインター操作（長押しで編集、編集モード時はドラッグで入替、タップで選択）
            let sx = 0, sy = 0, lpTimer = null, moved = false;
            el.addEventListener('pointerdown', e => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                sx = e.clientX; sy = e.clientY; moved = false;
                if (!isEditMode) {
                    lpTimer = setTimeout(() => {
                        toggleEditMode(true);
                        selectItem(loc, idx);
                    }, 450);
                }
            });
            el.addEventListener('pointermove', e => {
                if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
                    clearTimeout(lpTimer);
                    if (isEditMode && !dragState && !moved) {
                        moved = true;
                        startSafeDrag(el, loc, idx, e);
                    }
                }
            });
            const clearLP = () => clearTimeout(lpTimer);
            el.addEventListener('pointerup', clearLP);
            el.addEventListener('pointercancel', clearLP);

            el.addEventListener('click', e => {
                if (isEditMode) {
                    e.preventDefault();
                    if (!moved) selectItem(loc, idx);
                }
            });

            return el;
        }

        function renderAll() {
            // ページタブ
            const tabs = document.getElementById('pageTabs');
            tabs.innerHTML = '';
            state.pages.forEach((pg, i) => {
                const b = document.createElement('button');
                b.className = 'tab-chip mono' + (i === currentPage ? ' active' : '');
                b.textContent = pg.title || `0${i + 1}`;
                b.onclick = () => goToPage(i);
                tabs.appendChild(b);
            });

            // ページ本体
            const track = document.getElementById('pagesTrack');
            track.innerHTML = '';
            state.pages.forEach((pg, pIdx) => {
                const pane = document.createElement('section');
                pane.className = 'page-pane';

                // 空白長押しでも編集モードへ
                let et = null;
                pane.addEventListener('pointerdown', e => {
                    if (e.target === pane || e.target.classList.contains('bento-grid')) {
                        et = setTimeout(() => toggleEditMode(true), 450);
                    }
                });
                pane.addEventListener('pointermove', () => clearTimeout(et));
                pane.addEventListener('pointerup', () => clearTimeout(et));

                const grid = document.createElement('div');
                grid.className = 'bento-grid';
                pg.items.forEach((item, iIdx) => grid.appendChild(createTile(item, pIdx, iIdx)));
                pane.appendChild(grid);
                track.appendChild(pane);
            });

            // Dock
            const dock = document.getElementById('dockBar');
            dock.innerHTML = '';
            state.dock.forEach((app, idx) => dock.appendChild(createTile(app, 'dock', idx)));

            requestAnimationFrame(() => {
                track.scrollTo({ left: currentPage * track.clientWidth, behavior: 'instant' });
                recalcGridCells();
            });
            updateInspector();
            updateClocks();
            renderTimers();
            renderTodos();
        }

        function goToPage(i) {
            currentPage = Math.max(0, Math.min(state.pages.length - 1, i));
            const track = document.getElementById('pagesTrack');
            track.scrollTo({ left: currentPage * track.clientWidth, behavior: 'smooth' });
            document.querySelectorAll('.tab-chip').forEach((c, idx) => c.classList.toggle('active', idx === currentPage));
        }

        document.getElementById('pagesTrack').addEventListener('scroll', () => {
            const track = document.getElementById('pagesTrack');
            const w = track.clientWidth || 1;
            const idx = Math.round(track.scrollLeft / w);
            if (idx !== currentPage) {
                currentPage = idx;
                document.querySelectorAll('.tab-chip').forEach((c, i) => c.classList.toggle('active', i === idx));
            }
        });

        /* =========================================================
           8. 選択・キーボード＆ボタン編集ロジック
        ========================================================= */
        function toggleEditMode(force) {
            isEditMode = typeof force === 'boolean' ? force : !isEditMode;
            document.getElementById('osShell').classList.toggle('editing', isEditMode);
            document.getElementById('editBtn').classList.toggle('primary', isEditMode);
            document.getElementById('editBtn').textContent = isEditMode ? 'DONE [Esc]' : 'EDIT [E]';
            if (isEditMode && !selected && state.pages[currentPage].items.length) {
                selected = { loc: currentPage, idx: 0 };
            }
            if (!isEditMode) selected = null;
            renderAll();
        }

        function selectItem(loc, idx) {
            selected = { loc, idx };
            document.querySelectorAll('.is-selected').forEach(x => x.classList.remove('is-selected'));
            const el = document.querySelector(`[data-loc="${loc}"][data-idx="${idx}"]`);
            if (el) el.classList.add('is-selected');
            updateInspector();
        }

        function getSelectedItem() {
            if (!selected) return null;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc]?.items;
            return arr ? arr[selected.idx] : null;
        }

        function updateInspector() {
            const info = document.getElementById('selInfo');
            const btnResize = document.getElementById('btnResize');
            const btnEdit = document.getElementById('btnEditSel');
            const item = getSelectedItem();
            if (!item) {
                info.innerHTML = '<span>SELECT A TILE (OR ARROWS)</span>';
                btnResize.style.display = 'none';
                btnEdit.style.display = 'none';
                return;
            }
            const label = item.type === 'app' ? item.name : `${item.widgetType.toUpperCase()} [${item.size}]`;
            info.innerHTML = `SELECTED: <strong>${escapeHtml(label)}</strong>`;
            btnResize.style.display = item.type === 'widget' ? 'inline-flex' : 'none';
            btnEdit.style.display = item.type === 'app' ? 'inline-flex' : 'none';
        }

        function moveSelected(dir) {
            if (!selected) return;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc].items;
            const target = selected.idx + dir;
            if (target < 0 || target >= arr.length) return;
            pushUndo();
            [arr[selected.idx], arr[target]] = [arr[target], arr[selected.idx]];
            selected.idx = target;
            saveState();
            renderAll();
        }

        function cycleSelectedSize() {
            const item = getSelectedItem();
            if (!item || item.type !== 'widget') return;
            const sizes = ['2x1', '2x2', '3x2', '4x2', '6x2'];
            const next = sizes[(sizes.indexOf(item.size) + 1) % sizes.length];
            pushUndo();
            item.size = next;
            saveState();
            renderAll();
        }

        function deleteSelectedItem() {
            if (!selected) return;
            const arr = selected.loc === 'dock' ? state.dock : state.pages[selected.loc].items;
            const removed = arr[selected.idx];
            if (!removed) return;
            pushUndo();
            arr.splice(selected.idx, 1);
            if (arr.length === 0) selected = null;
            else selected.idx = Math.min(selected.idx, arr.length - 1);
            saveState();
            renderAll();
            showUndoToast(`REMOVED: ${removed.name || removed.widgetType}`);
        }

        function editSelectedItem() {
            const item = getSelectedItem();
            if (item && item.type === 'app') openAppModal(selected.loc, selected.idx);
        }

        function addPage() {
            pushUndo();
            const num = state.pages.length + 1;
            state.pages.push({ title: `0${num} PAGE`, items: [] });
            saveState();
            currentPage = state.pages.length - 1;
            renderAll();
        }

        /* =========================================================
           9. キーボード操作エンジン（狂いのないナビゲーション＆編集）
        ========================================================= */
        document.addEventListener('keydown', e => {
            const inInput = e.target.matches('input, textarea, select');

            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault(); openSearch(); return;
            }
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !inInput) {
                e.preventDefault(); undoAction(); return;
            }
            if (e.key === 'Escape') {
                const anyOpen = document.querySelector('.modal-bg.open');
                if (anyOpen) anyOpen.classList.remove('open');
                else if (isEditMode) toggleEditMode(false);
                return;
            }
            if (inInput || document.querySelector('.modal-bg.open')) return;

            const k = e.key.toLowerCase();
            if (k === 'e') { e.preventDefault(); toggleEditMode(); return; }
            if (k === 'n') { e.preventDefault(); openAddModal(); return; }
            if (e.key === '/') { e.preventDefault(); openSearch(); return; }

            // Shift + 左右 or [ / ] で順番移動
            if ((e.shiftKey && e.key === 'ArrowLeft') || e.key === '[') {
                e.preventDefault(); if (!isEditMode) toggleEditMode(true); moveSelected(-1); return;
            }
            if ((e.shiftKey && e.key === 'ArrowRight') || e.key === ']') {
                e.preventDefault(); if (!isEditMode) toggleEditMode(true); moveSelected(1); return;
            }

            // 矢印キーでタイル選択移動
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                e.preventDefault();
                const items = state.pages[currentPage].items;
                if (!items.length) return;
                if (!selected || selected.loc !== currentPage) {
                    selectItem(currentPage, 0);
                    return;
                }
                const cols = window.innerWidth <= 720 ? 4 : (state.cols || 6);
                let nextIdx = selected.idx;
                if (e.key === 'ArrowLeft') nextIdx = Math.max(0, selected.idx - 1);
                if (e.key === 'ArrowRight') nextIdx = Math.min(items.length - 1, selected.idx + 1);
                if (e.key === 'ArrowUp') nextIdx = Math.max(0, selected.idx - cols);
                if (e.key === 'ArrowDown') nextIdx = Math.min(items.length - 1, selected.idx + cols);
                selectItem(currentPage, nextIdx);
                return;
            }

            if (e.key === 'Enter' && selected) {
                e.preventDefault();
                const item = getSelectedItem();
                if (!item) return;
                if (isEditMode) {
                    if (item.type === 'app') openAppModal(selected.loc, selected.idx);
                    else cycleSelectedSize();
                } else if (item.type === 'app' && isSafeUrl(item.url)) {
                    if (item.newTab) window.open(item.url, '_blank', 'noopener');
                    else window.location.href = item.url;
                }
                return;
            }

            if ((e.key === 'Backspace' || e.key === 'Delete') && isEditMode && selected) {
                e.preventDefault();
                deleteSelectedItem();
            }
        });

        /* =========================================================
           10. モーダル（追加・アプリ設定・テーマ・JSON・検索）
        ========================================================= */
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        function openAddModal() { document.getElementById('addModal').classList.add('open'); }
        function openThemeModal() { applyTheme(); document.getElementById('themeModal').classList.add('open'); }

        function addWidget(widgetType, size) {
            pushUndo();
            state.pages[currentPage].items.unshift({
                type: 'widget',
                widgetType,
                size,
                id: `w_${widgetType}_${Date.now()}`
            });
            saveState();
            renderAll();
            closeModal('addModal');
        }

        let editRef = null, pickedIcon = 'web';

        function buildIconPicker(activeKey) {
            const box = document.getElementById('iconPicker');
            box.innerHTML = '';
            Object.keys(GLYPHS).forEach(k => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'ip-btn' + (k === activeKey ? ' active' : '');
                b.innerHTML = GLYPHS[k];
                b.title = k;
                b.onclick = () => {
                    pickedIcon = k;
                    box.querySelectorAll('.ip-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                box.appendChild(b);
            });
        }

        function openAppModal(loc = null, idx = -1) {
            editRef = loc !== null ? { loc, idx } : null;
            const app = editRef ? (loc === 'dock' ? state.dock : state.pages[loc].items)[idx] : { name: '', url: 'https://', icon: 'web', newTab: false };
            document.getElementById('appModalTitle').textContent = editRef ? 'EDIT APP' : 'NEW APP';
            document.getElementById('fName').value = app.name;
            document.getElementById('fUrl').value = app.url;
            document.getElementById('fNewTab').checked = !!app.newTab;
            pickedIcon = app.icon || 'web';
            buildIconPicker(pickedIcon);

            const sel = document.getElementById('fTarget');
            sel.innerHTML = '';
            state.pages.forEach((p, i) => {
                const o = document.createElement('option');
                o.value = String(i);
                o.textContent = p.title || `PAGE ${i + 1}`;
                sel.appendChild(o);
            });
            const dOpt = document.createElement('option');
            dOpt.value = 'dock';
            dOpt.textContent = 'BOTTOM DOCK';
            sel.appendChild(dOpt);
            sel.value = editRef ? String(loc) : String(currentPage);

            document.getElementById('appModal').classList.add('open');
        }

        function saveAppModal() {
            const name = document.getElementById('fName').value.trim();
            const url = document.getElementById('fUrl').value.trim();
            const newTab = document.getElementById('fNewTab').checked;
            const rawTarget = document.getElementById('fTarget').value;
            const dest = rawTarget === 'dock' ? 'dock' : Number(rawTarget);
            if (!name || !url) { alert('名前とURLを入力してください'); return; }

            pushUndo();
            const obj = { type: 'app', name, url, icon: pickedIcon, newTab };
            if (editRef) {
                const srcArr = editRef.loc === 'dock' ? state.dock : state.pages[editRef.loc].items;
                if (editRef.loc === dest) srcArr[editRef.idx] = obj;
                else {
                    srcArr.splice(editRef.idx, 1);
                    (dest === 'dock' ? state.dock : state.pages[dest].items).push(obj);
                }
            } else {
                (dest === 'dock' ? state.dock : state.pages[dest].items).push(obj);
            }
            saveState();
            renderAll();
            closeModal('appModal');
        }

        function exportJson() {
            const data = JSON.stringify(state, null, 2);
            navigator.clipboard?.writeText(data).then(
                () => alert('現在の全レイアウトをクリップボードにコピーしました。'),
                () => prompt('以下をコピーして保存してください:', data)
            );
        }

        function importJson() {
            const raw = prompt('書き出したJSONデータを貼り付けてください:');
            if (!raw) return;
            try {
                const parsed = JSON.parse(raw);
                if (!parsed.pages || !parsed.dock) throw new Error();
                pushUndo();
                state = parsed;
                saveState();
                applyTheme();
                renderAll();
                closeModal('themeModal');
            } catch (e) { alert('無効なJSONデータです'); }
        }

        function resetAll() {
            if (!confirm('初期配置に戻しますか？')) return;
            pushUndo();
            state = structuredClone(DEFAULT_STATE);
            saveState();
            currentPage = 0;
            selected = null;
            applyTheme();
            renderAll();
            closeModal('themeModal');
        }

        // クイック検索
        function openSearch() {
            document.getElementById('searchModal').classList.add('open');
            const inp = document.getElementById('searchInput');
            inp.value = '';
            renderSearch('');
            setTimeout(() => inp.focus(), 40);
        }

        function renderSearch(q) {
            const list = document.getElementById('searchList');
            list.innerHTML = '';
            const query = q.trim().toLowerCase();
            const apps = [...state.dock, ...state.pages.flatMap(p => p.items).filter(x => x.type === 'app')];
            const seen = new Set();
            const matches = apps.filter(a => {
                if (seen.has(a.name)) return false;
                seen.add(a.name);
                return !query || a.name.toLowerCase().includes(query) || a.url.toLowerCase().includes(query);
            }).slice(0, 7);

            matches.forEach(a => {
                const row = document.createElement('a');
                row.className = 'search-row';
                row.href = isSafeUrl(a.url) ? a.url : '#';
                if (a.newTab) { row.target = '_blank'; row.rel = 'noopener'; }
                row.onclick = () => closeModal('searchModal');
                row.innerHTML = `${GLYPHS[a.icon] || GLYPHS.web}<span style="font-weight:700; flex:1;">${escapeHtml(a.name)}</span><span class="mono" style="font-size:0.72rem; color:var(--muted);">${escapeHtml(a.url)}</span>`;
                list.appendChild(row);
            });

            if (query) {
                const row = document.createElement('a');
                row.className = 'search-row';
                row.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
                row.target = '_blank';
                row.onclick = () => closeModal('searchModal');
                row.innerHTML = `${GLYPHS.google}<span style="font-weight:700;">Google で「${escapeHtml(q)}」を検索</span>`;
                list.appendChild(row);
            }
        }
        document.getElementById('searchInput').addEventListener('input', e => renderSearch(e.target.value));
        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.querySelector('#searchList .search-row')?.click();
        });

        /* =========================================================
           11. 時計更新＆初期起動
        ========================================================= */
        function updateClocks() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.querySelectorAll('.js-clk-time').forEach(el => el.textContent = `${hh}:${mm}:${ss}`);
            document.querySelectorAll('.js-clk-date').forEach(el => el.textContent = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }));
        }
        setInterval(updateClocks, 1000);

        applyTheme();
        renderAll();
        loadWeather();
    </script>
</body>
</html>
