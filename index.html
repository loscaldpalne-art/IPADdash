<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>iPadOS Home</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#091326">
    <style>
        :root {
            --icon-size: 72px;
            --icon-radius: 22.5%;
            --grid-cols: 6;
            --accent: #0a84ff;
            --text: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.72);
            --icon-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: var(--text);
            background-color: #091326;
            touch-action: manipulation;
        }

        /* 壁紙レイヤー（iPadOS PWAの下部黒帯を防ぐため上下左右を拡張） */
        .wallpaper {
            position: fixed;
            top: -80px;
            left: -40px;
            right: -40px;
            bottom: -80px;
            z-index: 0;
            background-size: cover;
            background-position: center;
            transition: background 0.35s ease;
        }

        .wallpaper.wp-1 {
            background:
                radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.58), transparent 48%),
                radial-gradient(circle at 82% 25%, rgba(99, 102, 241, 0.55), transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.44), transparent 52%),
                radial-gradient(circle at 20% 85%, rgba(30, 64, 175, 0.72), transparent 55%),
                linear-gradient(135deg, #091326 0%, #0f172a 100%);
        }
        .wallpaper.wp-2 {
            background:
                radial-gradient(circle at 25% 25%, rgba(244, 63, 94, 0.5), transparent 48%),
                radial-gradient(circle at 78% 20%, rgba(245, 158, 11, 0.44), transparent 48%),
                radial-gradient(circle at 55% 75%, rgba(139, 92, 246, 0.54), transparent 55%),
                linear-gradient(150deg, #1b1026 0%, #0d111d 100%);
        }
        .wallpaper.wp-3 {
            background:
                radial-gradient(circle at 30% 18%, rgba(34, 211, 238, 0.38), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.38), transparent 50%),
                linear-gradient(160deg, #07090f 0%, #111827 55%, #090d16 100%);
        }
        .wallpaper.wp-4 {
            background:
                radial-gradient(circle at 20% 30%, rgba(52, 211, 153, 0.5), transparent 48%),
                radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.5), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(6, 95, 70, 0.62), transparent 55%),
                linear-gradient(145deg, #06211c 0%, #091522 100%);
        }
        .wallpaper.wp-5 {
            background:
                radial-gradient(circle at 22% 22%, rgba(255, 255, 255, 0.2), transparent 45%),
                radial-gradient(circle at 78% 78%, rgba(148, 163, 184, 0.2), transparent 50%),
                linear-gradient(145deg, #1e232e 0%, #0b0e14 100%);
        }
        .wallpaper.wp-6 {
            background:
                radial-gradient(circle at 30% 25%, rgba(251, 146, 60, 0.55), transparent 48%),
                radial-gradient(circle at 75% 30%, rgba(56, 189, 248, 0.45), transparent 50%),
                radial-gradient(circle at 50% 82%, rgba(15, 23, 42, 0.8), transparent 55%),
                linear-gradient(145deg, #1e293b 0%, #090d16 100%);
        }

        /* 全体レイアウト */
        .os-shell {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding-top: max(28px, calc(env(safe-area-inset-top, 20px) + 6px));
            padding-bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
        }

        /* 上部コントロール（本体ステータスバーと重ならない右寄せ） */
        .top-controls {
            height: 36px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .pill-btn:active { transform: scale(0.95); }
        .pill-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .pill-btn svg { width: 14px; height: 14px; }

        /* スワイプ可能なページコンテナ */
        .pages-viewport {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .pages-viewport::-webkit-scrollbar { display: none; }

        .page {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            padding: 16px 36px 8px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .page::-webkit-scrollbar { display: none; }

        /* アイコン配列グリッド */
        .app-grid {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), 1fr);
            gap: 24px 16px;
            align-content: start;
        }

        .app-slot {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        .app-icon-wrap {
            position: relative;
            width: var(--icon-size);
            height: var(--icon-size);
            border-radius: var(--icon-radius);
            background: var(--icon-bg);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.32),
                0 2px 6px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.15s;
        }

        .app-slot:active .app-icon-wrap {
            transform: scale(0.9);
            filter: brightness(0.85);
        }

        .app-icon-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .app-icon-wrap img.favicon-img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 14%;
        }

        .app-label {
            font-size: 0.76rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
            max-width: 92px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.78);
        }

        .hide-labels .app-label { display: none; }

        /* ====== アイコンテーマ ====== */
        .theme-dark {
            --icon-bg: #151821;
        }
        .theme-dark .app-icon-wrap {
            background: #151821;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 10px 24px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .theme-dark .app-icon-wrap .svg-bg {
            fill: #151821 !important;
        }
        .theme-dark .app-icon-wrap img.favicon-img {
            filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.65));
        }

        /* iOS 26風 クリアガラス & カラーガラス */
        .theme-glass .app-icon-wrap,
        .theme-glass-color .app-icon-wrap {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.06) 100%);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow:
                inset 0 1.5px 2px rgba(255, 255, 255, 0.58),
                inset 0 -2px 4px rgba(0, 0, 0, 0.18),
                0 12px 28px rgba(0, 0, 0, 0.28);
        }
        .theme-glass .app-icon-wrap::after,
        .theme-glass-color .app-icon-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.08) 100%);
            pointer-events: none;
        }
        .theme-glass .app-icon-wrap .svg-bg,
        .theme-glass-color .app-icon-wrap .svg-bg {
            fill: transparent !important;
        }
        .theme-glass .app-icon-wrap svg {
            filter: grayscale(1) brightness(1.38) contrast(1.12) opacity(0.92);
        }
        .theme-glass .app-icon-wrap img.favicon-img {
            filter: grayscale(1) brightness(1.35) contrast(1.15) opacity(0.9);
        }
        .theme-glass-color .app-icon-wrap svg,
        .theme-glass-color .app-icon-wrap img.favicon-img {
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.22));
        }

        /* 編集モード */
        @keyframes jiggle {
            0% { transform: rotate(-1.3deg); }
            50% { transform: rotate(1.3deg); }
            100% { transform: rotate(-1.3deg); }
        }

        .editing .app-slot { animation: jiggle 0.28s infinite ease-in-out; }
        .editing .app-slot:nth-child(2n) { animation-delay: -0.14s; }

        .badge-delete {
            display: none;
            position: absolute;
            top: -6px;
            left: calc(50% - var(--icon-size) / 2 - 6px);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(225, 230, 240, 0.94);
            color: #111827;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .dock .badge-delete { left: -6px; }
        .editing .badge-delete { display: flex; }
        .badge-delete svg { width: 12px; height: 12px; }

        .edit-toolbar {
            display: none;
            justify-content: center;
            gap: 8px;
            padding: 6px 16px 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .editing .edit-toolbar { display: flex; }

        /* ====== ウィジェットページ ====== */
        .widgets-header {
            max-width: 980px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widgets-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.04em;
        }

        .widgets-grid {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 24px;
        }

        .widget {
            background: rgba(22, 28, 42, 0.54);
            backdrop-filter: blur(26px) saturate(165%);
            -webkit-backdrop-filter: blur(26px) saturate(165%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 26px;
            padding: 18px 20px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 12px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            min-height: 165px;
        }

        .widget.wide { grid-column: span 2; }

        .widget-title {
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .widget-edit-bar { display: none; gap: 4px; align-items: center; }
        .editing .widget-edit-bar { display: flex; }

        .w-mini-btn {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
        }
        .w-mini-btn.danger { color: #fca5a5; }

        .widget-clock-big {
            font-size: 3.1rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .widget-clock-sub { margin-top: 6px; font-size: 0.9rem; color: var(--text-sub); }

        .analog-wrap { display: flex; align-items: center; gap: 20px; flex: 1; }
        .analog-face {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            flex-shrink: 0;
        }
        .analog-face svg { width: 100%; height: 100%; }

        .timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .timer-num { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .timer-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

        .w-btn {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .w-btn.primary { background: var(--accent); border-color: var(--accent); }

        .w-textarea {
            width: 100%;
            min-height: 115px;
            flex: 1;
            background: rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 11px;
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .todo-add-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .w-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 7px 11px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            min-width: 0;
        }
        .todo-scroll { max-height: 125px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .todo-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; background: rgba(255, 255, 255, 0.07); border-radius: 10px; font-size: 0.86rem; }
        .todo-row.done span { text-decoration: line-through; color: var(--text-sub); }
        .todo-row span { flex: 1; word-break: break-word; }
        .todo-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.45);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }
        .todo-row.done .todo-check { background: var(--accent); border-color: var(--accent); }

        .cd-body { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 6px 0 10px; }
        .cd-days { font-size: 2.7rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        .cd-unit { font-size: 0.95rem; color: var(--text-sub); margin-left: 4px; }
        .cd-inputs { display: flex; gap: 6px; margin-top: auto; }

        .schedule-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .sch-row { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 4px 8px; }
        .sch-num { font-size: 0.75rem; font-weight: 700; color: var(--accent); width: 18px; text-align: center; }
        .sch-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.85rem; outline: none; min-width: 0; }

        .calc-disp {
            background: rgba(0, 0, 0, 0.28);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: right;
            font-size: 1.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .calc-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 8px 0;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .calc-btn.op { background: rgba(10, 132, 255, 0.45); }
        .calc-btn.eq { background: var(--accent); }
        .calc-btn:active { opacity: 0.7; }

        /* 下部エリア */
        .bottom-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 0;
        }

        .page-dots-bar { display: flex; align-items: center; gap: 10px; }
        .page-dots {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: none;
        }
        .dot.active { background: #ffffff; transform: scale(1.25); }

        .spotlight-trigger {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 0.76rem;
            font-weight: 500;
            cursor: pointer;
        }
        .spotlight-trigger svg { width: 12px; height: 12px; opacity: 0.9; }

        .dock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 30px;
            padding: 11px 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            max-width: calc(100vw - 24px);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .dock::-webkit-scrollbar { display: none; }
        .dock .app-slot { gap: 0; }
        .dock .app-icon-wrap { width: 64px; height: 64px; }
        .dock .app-label { display: none; }

        /* モーダル */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.open { display: flex; }

        .sheet {
            width: 100%;
            max-width: 470px;
            background: rgba(26, 30, 40, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 88vh;
            overflow-y: auto;
        }
        .sheet h3 { font-size: 1.08rem; font-weight: 700; }

        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 0.78rem; color: var(--text-sub); font-weight: 600; }
        .field input, .field select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
        }
        .field select option { background: #1c202a; color: #fff; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .check-line { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; cursor: pointer; }
        .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
        .move-bar { display: flex; gap: 6px; flex-wrap: wrap; }

        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .theme-opt {
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 10px 12px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .theme-opt strong { font-size: 0.86rem; }
        .theme-opt span { font-size: 0.72rem; color: var(--text-sub); }
        .theme-opt.active { border-color: var(--accent); background: rgba(10, 132, 255, 0.2); }

        .widget-picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .wpick-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .wpick-btn:active { transform: scale(0.97); }
        .wpick-btn strong { font-size: 0.88rem; }
        .wpick-btn span { font-size: 0.73rem; color: var(--text-sub); }

        /* Spotlight */
        .spotlight-box { align-items: flex-start; padding-top: 10vh; }
        .spotlight-panel {
            width: 100%;
            max-width: 560px;
            background: rgba(30, 34, 46, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }
        .spotlight-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spotlight-input-row svg { width: 20px; height: 20px; color: var(--text-sub); flex-shrink: 0; }
        .spotlight-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.08rem;
            outline: none;
        }
        .spotlight-results {
            max-height: 50vh;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .spot-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            cursor: pointer;
        }
        .spot-item:hover, .spot-item:active { background: rgba(255, 255, 255, 0.12); }
        .spot-mini-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: var(--icon-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .spot-mini-icon svg { width: 100%; height: 100%; }
        .spot-mini-icon img { width: 72%; height: 72%; object-fit: contain; }
        .spot-meta { display: flex; flex-direction: column; }
        .spot-name { font-size: 0.94rem; font-weight: 600; }
        .spot-sub { font-size: 0.75rem; color: var(--text-sub); }

        .wp-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
        .wp-swatch {
            position: static;
            height: 46px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }
        .wp-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

        @media (max-width: 900px) {
            .app-grid { grid-template-columns: repeat(min(var(--grid-cols), 5), 1fr); }
        }

        @media (max-width: 680px) {
            :root { --icon-size: 62px; }
            .page { padding: 12px 18px 8px; }
            .app-grid { grid-template-columns: repeat(4, 1fr); gap: 18px 10px; }
            .widgets-grid { grid-template-columns: 1fr; }
            .widget.wide { grid-column: span 1; }
            .dock { gap: 12px; padding: 9px 14px; border-radius: 26px; }
            .dock .app-icon-wrap { width: 54px; height: 54px; }
        }
    </style>
</head>
<body>

    <div class="wallpaper wp-1" id="wallpaper"></div>

    <div class="os-shell" id="osShell">
        <header class="top-controls">
            <button class="pill-btn" onclick="openCustomizeModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>カスタマイズ</span>
            </button>
            <button class="pill-btn" onclick="openAddModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>追加</span>
            </button>
            <button class="pill-btn" id="editToggleBtn" onclick="toggleEditMode()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span id="editBtnText">編集</span>
            </button>
        </header>

        <div class="edit-toolbar">
            <button class="pill-btn" onclick="addPage()">＋ ページ追加</button>
            <button class="pill-btn" onclick="openWidgetPickerModal()">＋ ウィジェット追加</button>
            <button class="pill-btn" id="removePageBtn" onclick="removeCurrentPage()">空ページ削除</button>
            <button class="pill-btn" onclick="resetDefaults()">初期化</button>
        </div>

        <main class="pages-viewport" id="pagesViewport"></main>

        <footer class="bottom-area">
            <div class="page-dots-bar">
                <div class="page-dots" id="pageDots"></div>
                <button class="spotlight-trigger" onclick="openSpotlight()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <span>検索</span>
                </button>
            </div>
            <nav class="dock" id="dock"></nav>
        </footer>
    </div>

    <!-- アプリ追加・編集モーダル -->
    <div class="modal-backdrop" id="appModal" onclick="if(event.target===this) closeAppModal()">
        <div class="sheet">
            <h3 id="appModalTitle">アプリを追加</h3>
            <div class="field">
                <label>表示名</label>
                <input type="text" id="fName" placeholder="例：Google ドライブ">
            </div>
            <div class="field">
                <label>URL（アプリを開く場合は https://... 推奨）</label>
                <input type="text" id="fUrl" placeholder="https://drive.google.com/">
            </div>
            <div class="row-2">
                <div class="field">
                    <label>アイコン種類</label>
                    <select id="fIconType">
                        <option value="auto">URLから自動取得</option>
                        <option value="svg:google">Google</option>
                        <option value="svg:drive">Google ドライブ</option>
                        <option value="svg:classroom">Classroom</option>
                        <option value="svg:docs">ドキュメント</option>
                        <option value="svg:sheets">スプレッドシート</option>
                        <option value="svg:slides">スライド</option>
                        <option value="svg:maps">Google マップ</option>
                        <option value="svg:youtube">YouTube</option>
                        <option value="svg:gmail">Gmail</option>
                        <option value="svg:meet">Google Meet</option>
                        <option value="svg:gemini">Gemini</option>
                        <option value="svg:github">GitHub</option>
                        <option value="custom">画像URLを指定</option>
                    </select>
                </div>
                <div class="field">
                    <label>配置先</label>
                    <select id="fTargetLoc"></select>
                </div>
            </div>
            <div class="field" id="customIconField" style="display:none;">
                <label>アイコン画像URL</label>
                <input type="text" id="fIconUrl" placeholder="https://.../icon.png">
            </div>
            <label class="check-line">
                <input type="checkbox" id="fNewTab">
                <span>別タブで開く（Webサイト向け／アプリ起動はOFF推奨）</span>
            </label>
            <div class="field" id="reorderField" style="display:none;">
                <label>並び順の移動</label>
                <div class="move-bar">
                    <button type="button" class="w-btn" onclick="shiftEditingApp(-1)">左へ移動</button>
                    <button type="button" class="w-btn" onclick="shiftEditingApp(1)">右へ移動</button>
                </div>
            </div>
            <div class="sheet-actions">
                <button type="button" class="w-btn" onclick="closeAppModal()">キャンセル</button>
                <button type="button" class="w-btn primary" onclick="saveAppModal()">保存</button>
            </div>
        </div>
    </div>

    <!-- カスタマイズモーダル -->
    <div class="modal-backdrop" id="customModal" onclick="if(event.target===this) closeCustomizeModal()">
        <div class="sheet">
            <h3>ホーム画面をカスタマイズ</h3>
            <div class="field">
                <label>アイコンスタイル</label>
                <div class="theme-grid" id="themeGrid">
                    <button type="button" class="theme-opt" data-theme="standard" onclick="setIconTheme('standard')">
                        <strong>標準（ライト）</strong>
                        <span>オリジナルの明るいデザイン</span>
                    </button>
                    <button type="button" class="theme-opt" data-theme="dark" onclick="setIconTheme('dark')">
                        <strong>ダーク（黒統一）</strong>
                        <span>背景を黒に統一して引き締め</span>
                    </button>
                    <button type="button" class="theme-opt" data-theme="glass" onclick="setIconTheme('glass')">
                        <strong>クリアガラス (iOS 26風)</strong>
                        <span>背景が透けるモノクロ液体ガラス</span>
                    </button>
                    <button type="button" class="theme-opt" data-theme="glass-color" onclick="setIconTheme('glass-color')">
                        <strong>カラーガラス</strong>
                        <span>透けるガラス＋カラーロゴ</span>
                    </button>
                </div>
            </div>
            <div class="row-2">
                <div class="field">
                    <label>アイコンの列数（横）</label>
                    <select id="fGridCols" onchange="setGridCols(this.value)">
                        <option value="5">5列（ゆったり）</option>
                        <option value="6">6列（標準iPad）</option>
                        <option value="7">7列（高密度）</option>
                    </select>
                </div>
                <div class="field">
                    <label>アイコンの大きさ</label>
                    <select id="fIconSize" onchange="setIconSize(this.value)">
                        <option value="64">標準 (64px)</option>
                        <option value="72">大きめ (72px)</option>
                        <option value="80">特大 (80px)</option>
                    </select>
                </div>
            </div>
            <label class="check-line">
                <input type="checkbox" id="fHideLabels" onchange="setHideLabels(this.checked)">
                <span>アイコン下のアプリ名を非表示にする</span>
            </label>
            <div class="field">
                <label>壁紙プリセット</label>
                <div class="wp-swatches" id="wpSwatches">
                    <div class="wp-swatch wallpaper wp-1" data-wp="wp-1" onclick="setWallpaperPreset('wp-1')"></div>
                    <div class="wp-swatch wallpaper wp-2" data-wp="wp-2" onclick="setWallpaperPreset('wp-2')"></div>
                    <div class="wp-swatch wallpaper wp-3" data-wp="wp-3" onclick="setWallpaperPreset('wp-3')"></div>
                    <div class="wp-swatch wallpaper wp-4" data-wp="wp-4" onclick="setWallpaperPreset('wp-4')"></div>
                    <div class="wp-swatch wallpaper wp-5" data-wp="wp-5" onclick="setWallpaperPreset('wp-5')"></div>
                    <div class="wp-swatch wallpaper wp-6" data-wp="wp-6" onclick="setWallpaperPreset('wp-6')"></div>
                </div>
            </div>
            <div class="field">
                <label>カスタム壁紙（URL または 写真を選択）</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="wpCustomUrl" style="flex:1;" placeholder="https://...">
                    <button type="button" class="w-btn primary" onclick="setWallpaperUrl()">適用</button>
                </div>
                <input type="file" id="wpFileInput" accept="image/*" style="margin-top:4px;" onchange="handleWallpaperFile(event)">
            </div>
            <div class="sheet-actions">
                <button type="button" class="w-btn primary" onclick="closeCustomizeModal()">完了</button>
            </div>
        </div>
    </div>

    <!-- ウィジェット追加モーダル -->
    <div class="modal-backdrop" id="widgetPickerModal" onclick="if(event.target===this) closeWidgetPickerModal()">
        <div class="sheet">
            <h3>ウィジェットを追加</h3>
            <div class="widget-picker-grid">
                <button type="button" class="wpick-btn" onclick="addWidget('analog')">
                    <strong>アナログ時計</strong>
                    <span>動く針の文字盤＋日付</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('clock')">
                    <strong>デジタル時計</strong>
                    <span>秒まで見える大きい時計</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('timer')">
                    <strong>集中タイマー</strong>
                    <span>裏に回っても止まらない</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('memo')">
                    <strong>メモパッド</strong>
                    <span>自動保存メモ（複数可）</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('todo')">
                    <strong>ToDoリスト</strong>
                    <span>チェック式タスク管理</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('countdown')">
                    <strong>カウントダウン</strong>
                    <span>テストや予定までの日数</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('schedule')">
                    <strong>今日の時間割</strong>
                    <span>1限〜6限を自由に記入</span>
                </button>
                <button type="button" class="wpick-btn" onclick="addWidget('calc')">
                    <strong>ミニ電卓</strong>
                    <span>サッと使えるシンプル電卓</span>
                </button>
            </div>
            <div class="sheet-actions">
                <button type="button" class="w-btn" onclick="closeWidgetPickerModal()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Spotlight 検索モーダル -->
    <div class="modal-backdrop spotlight-box" id="spotlightModal" onclick="if(event.target===this) closeSpotlight()">
        <div class="spotlight-panel">
            <div class="spotlight-input-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input type="text" id="spotlightInput" class="spotlight-input" placeholder="アプリを検索、またはWeb検索..." autocomplete="off">
            </div>
            <div class="spotlight-results" id="spotlightResults"></div>
        </div>
    </div>

        function escapeXml(str) {
            return String(str).replace(/[<>&'"]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', "'":'&apos;', '"':'&quot;' }[c]));
        }

        function makeMonogramSvg(name, url) {
            const colors = ['#0a84ff', '#5e5ce6', '#bf5af2', '#ff375f', '#ff9f0a', '#30d158', '#64d2ff', '#007aff'];
            let hash = 0;
            const seed = (name || url || 'A');
            for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
            const bg = colors[Math.abs(hash) % colors.length];
            const char = (name.trim()[0] || 'A').toUpperCase();
            return `<svg viewBox="0 0 100 100"><rect class="svg-bg" width="100" height="100" fill="${bg}"/><text x="50" y="64" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="700" font-family="-apple-system, sans-serif">${escapeXml(char)}</text></svg>`;
        }

        function getDomainFromUrl(url) {
            try { if (/^https?:/i.test(url)) return new URL(url).hostname; } catch (e) {}
            return '';
        }

        function renderIconElement(app) {
            const wrap = document.createElement('div');
            wrap.className = 'app-icon-wrap';

            if (app.iconType && app.iconType.startsWith('svg:')) {
                const key = app.iconType.slice(4);
                if (BRAND_SVGS[key]) {
                    wrap.innerHTML = BRAND_SVGS[key];
                    return wrap;
                }
            }
            if (app.iconType === 'custom' && app.iconUrl) {
                const img = document.createElement('img');
                img.className = 'favicon-img';
                img.style.cssText = 'width:100%;height:100%;border-radius:0;object-fit:cover;';
                img.src = app.iconUrl;
                img.onerror = () => { wrap.innerHTML = makeMonogramSvg(app.name, app.url); };
                wrap.appendChild(img);
                return wrap;
            }
            const domain = getDomainFromUrl(app.url);
            if (domain) {
                const img = document.createElement('img');
                img.className = 'favicon-img';
                img.alt = app.name;
                img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128`;
                img.onerror = () => { wrap.innerHTML = makeMonogramSvg(app.name, app.url); };
                wrap.appendChild(img);
                return wrap;
            }
            wrap.innerHTML = makeMonogramSvg(app.name, app.url);
            return wrap;
        }

        function loadInitialState() {
            const savedV2 = localStorage.getItem(STORAGE_KEY);
            if (savedV2) return JSON.parse(savedV2);
            const savedV1 = localStorage.getItem(OLD_STORAGE_KEY);
            if (savedV1) {
                const v1 = JSON.parse(savedV1);
                return { ...structuredClone(DEFAULT_STATE), ...v1 };
            }
            return structuredClone(DEFAULT_STATE);
        }

        let state = loadInitialState();
        let isEditMode = false;
        let currentPageIdx = 0;
        let editingRef = null;

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function isSafeUrl(url) {
            return !/^\s*javascript:/i.test(url);
        }

        /* =========================================================
           3. 外観・テーマ適用
        ========================================================= */
        function applyAppearance() {
            const shell = document.getElementById('osShell');
            shell.classList.remove('theme-standard', 'theme-dark', 'theme-glass', 'theme-glass-color', 'hide-labels');
            shell.classList.add(`theme-${state.iconTheme || 'standard'}`);
            if (state.hideLabels) shell.classList.add('hide-labels');

            document.documentElement.style.setProperty('--grid-cols', state.gridCols || 6);
            document.documentElement.style.setProperty('--icon-size', `${state.iconSize || 72}px`);

            const wpEl = document.getElementById('wallpaper');
            wpEl.className = 'wallpaper';
            wpEl.style.backgroundImage = '';
            if (state.customWallpaper) {
                wpEl.style.backgroundImage = `url("${state.customWallpaper}")`;
            } else {
                wpEl.classList.add(state.wallpaper || 'wp-1');
            }

            document.querySelectorAll('.theme-opt').forEach(b => {
                b.classList.toggle('active', b.dataset.theme === (state.iconTheme || 'standard'));
            });
            document.querySelectorAll('.wp-swatch').forEach(s => {
                s.classList.toggle('active', !state.customWallpaper && s.dataset.wp === state.wallpaper);
            });
            document.getElementById('fGridCols').value = String(state.gridCols || 6);
            document.getElementById('fIconSize').value = String(state.iconSize || 72);
            document.getElementById('fHideLabels').checked = !!state.hideLabels;
        }

        function setIconTheme(theme) { state.iconTheme = theme; saveState(); applyAppearance(); }
        function setGridCols(cols) { state.gridCols = Number(cols); saveState(); applyAppearance(); }
        function setIconSize(size) { state.iconSize = Number(size); saveState(); applyAppearance(); }
        function setHideLabels(hide) { state.hideLabels = hide; saveState(); applyAppearance(); }

        function openCustomizeModal() { applyAppearance(); document.getElementById('customModal').classList.add('open'); }
        function closeCustomizeModal() { document.getElementById('customModal').classList.remove('open'); }

        function setWallpaperPreset(wp) { state.wallpaper = wp; state.customWallpaper = ''; saveState(); applyAppearance(); }
        function setWallpaperUrl() {
            const url = document.getElementById('wpCustomUrl').value.trim();
            if (!url) return;
            state.customWallpaper = url; saveState(); applyAppearance();
        }
        function handleWallpaperFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try { state.customWallpaper = ev.target.result; saveState(); applyAppearance(); }
                catch (err) { alert('画像サイズが大きすぎるため保存できませんでした。'); }
            };
            reader.readAsDataURL(file);
        }

        /* =========================================================
           4. ホーム画面・Dock・ウィジェット描画
        ========================================================= */
        function createAppSlot(app, loc, idx) {
            const slot = document.createElement('a');
            slot.className = 'app-slot';
            slot.href = isSafeUrl(app.url) ? app.url : '#';
            if (app.newTab) { slot.target = '_blank'; slot.rel = 'noopener'; }

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'badge-delete';
            delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>`;
            delBtn.addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation(); deleteApp(loc, idx);
            });

            let pressTimer = null, moved = false;
            slot.addEventListener('pointerdown', () => {
                moved = false;
                if (isEditMode) return;
                pressTimer = setTimeout(() => { if (!moved) toggleEditMode(true); }, 520);
            });
            slot.addEventListener('pointermove', () => { moved = true; clearTimeout(pressTimer); });
            slot.addEventListener('pointerup', () => clearTimeout(pressTimer));
            slot.addEventListener('pointercancel', () => clearTimeout(pressTimer));

            slot.addEventListener('click', e => {
                if (isEditMode) { e.preventDefault(); openEditModal(loc, idx); }
            });

            const iconEl = renderIconElement(app);
            const label = document.createElement('span');
            label.className = 'app-label';
            label.textContent = app.name;

            slot.append(delBtn, iconEl, label);
            return slot;
        }

        function renderAll() {
            const viewport = document.getElementById('pagesViewport');
            const prevScroll = viewport.scrollLeft;
            viewport.innerHTML = '';

            state.pages.forEach((apps, pIdx) => {
                const page = document.createElement('section');
                page.className = 'page';
                const grid = document.createElement('div');
                grid.className = 'app-grid';
                apps.forEach((app, aIdx) => grid.appendChild(createAppSlot(app, pIdx, aIdx)));
                page.appendChild(grid);
                viewport.appendChild(page);
            });

            const widgetPage = document.createElement('section');
            widgetPage.className = 'page';
            widgetPage.innerHTML = `
                <div class="widgets-header">
                    <h2>WIDGETS</h2>
                    <button type="button" class="pill-btn" onclick="openWidgetPickerModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        <span>ウィジェット追加</span>
                    </button>
                </div>
                <div class="widgets-grid" id="widgetsGrid"></div>
            `;
            viewport.appendChild(widgetPage);

            const dock = document.getElementById('dock');
            dock.innerHTML = '';
            state.dock.forEach((app, idx) => dock.appendChild(createAppSlot(app, 'dock', idx)));

            const totalPages = state.pages.length + 1;
            const dotsEl = document.getElementById('pageDots');
            dotsEl.innerHTML = '';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = 'dot' + (i === currentPageIdx ? ' active' : '');
                dot.onclick = () => goToPage(i);
                dotsEl.appendChild(dot);
            }

            viewport.scrollLeft = prevScroll;
            renderWidgets();
            updateRemovePageButton();
        }

        function goToPage(idx) {
            const viewport = document.getElementById('pagesViewport');
            viewport.scrollTo({ left: idx * viewport.clientWidth, behavior: 'smooth' });
        }

        document.getElementById('pagesViewport').addEventListener('scroll', () => {
            const viewport = document.getElementById('pagesViewport');
            const w = viewport.clientWidth || 1;
            const idx = Math.round(viewport.scrollLeft / w);
            if (idx !== currentPageIdx) {
                currentPageIdx = idx;
                document.querySelectorAll('#pageDots .dot').forEach((d, i) => d.classList.toggle('active', i === idx));
                updateRemovePageButton();
            }
        });

        function updateRemovePageButton() {
            const btn = document.getElementById('removePageBtn');
            const isAppPage = currentPageIdx < state.pages.length;
            const isEmpty = isAppPage && state.pages[currentPageIdx].length === 0;
            btn.style.display = (isAppPage && isEmpty && state.pages.length > 1) ? 'inline-flex' : 'none';
        }

        /* =========================================================
           5. モジュラーウィジェットシステム
        ========================================================= */
        function renderWidgets() {
            const grid = document.getElementById('widgetsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            state.widgets.forEach((w, idx) => {
                const card = document.createElement('div');
                card.className = 'widget' + (w.wide ? ' wide' : '');

                const header = document.createElement('div');
                header.className = 'widget-title';

                const titleSpan = document.createElement('span');
                titleSpan.textContent = w.title;

                const editBar = document.createElement('div');
                editBar.className = 'widget-edit-bar';

                    <button type="button" class="w-mini-btn" onclick="moveWidget(${idx},-1)">◀</button>
                    <button type="button" class="w-mini-btn" onclick="moveWidget(${idx},1)">▶</button>
                    <button type="button" class="w-mini-btn" onclick="toggleWidgetWide(${idx})">${w.wide ? '標準幅' : '横長'}</button>
                    <button type="button" class="w-mini-btn danger" onclick="deleteWidget(${idx})">削除</button>

                card.appendChild(header);

                const body = document.createElement('div');

                if (w.type === 'clock') {
                    body.innerHTML = `<div class="widget-clock-big js-clock-time">00:00:00</div><div class="widget-clock-sub js-clock-date">---</div>`;
                } else if (w.type === 'analog') {
                    body.innerHTML = `
                        <div class="analog-wrap">
                            <div class="analog-face">
                                <svg viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
                                    ${[0,30,60,90,120,150,180,210,240,270,300,330].map(a => `<line x1="50" y1="6" x2="50" y2="${a%90===0?13:10}" stroke="rgba(255,255,255,${a%90===0?0.85:0.4})" stroke-width="${a%90===0?2:1.2}" transform="rotate(${a} 50 50)"/>`).join('')}
                                    <line class="js-hand-h" x1="50" y1="50" x2="50" y2="24" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
                                    <line class="js-hand-m" x1="50" y1="50" x2="50" y2="15" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
                                    <line class="js-hand-s" x1="50" y1="56" x2="50" y2="13" stroke="#ff9f0a" stroke-width="1.4" stroke-linecap="round"/>
                                    <circle cx="50" cy="50" r="3" fill="#ff9f0a"/>
                                </svg>
                            </div>
                            <div>
                                <div class="js-clock-time" style="font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;">00:00</div>
                                <div class="widget-clock-sub js-clock-date">---</div>
                            </div>
                        </div>`;
                } else if (w.type === 'timer') {
                    body.innerHTML = `
                        <div class="timer-row">
                            <div class="timer-num js-timer-num">25:00</div>
                            <button type="button" class="w-btn primary js-timer-btn" onclick="toggleTimer()">開始</button>
                        </div>
                        <div class="timer-btns">
                            <button type="button" class="w-btn" onclick="setTimer(25)">25分</button>
                            <button type="button" class="w-btn" onclick="setTimer(10)">10分</button>
                            <button type="button" class="w-btn" onclick="setTimer(5)">5分</button>
                            <button type="button" class="w-btn" onclick="addMinute()">+1分</button>
                            <button type="button" class="w-btn" onclick="resetTimer()">リセット</button>
                        </div>`;
                } else if (w.type === 'memo') {
                    const key = w.storageKey || `ipad_widget_memo_${w.id}`;
                    const ta = document.createElement('textarea');
                    ta.className = 'w-textarea';
                    ta.placeholder = 'メモを入力（自動保存）...';
                    ta.value = localStorage.getItem(key) || '';
                    ta.oninput = () => localStorage.setItem(key, ta.value);
                    body.appendChild(ta);
                } else if (w.type === 'todo') {
                    body.innerHTML = `
                        <form class="todo-add-row" onsubmit="addTodo(event, this)">
                            <input type="text" class="w-input" placeholder="タスクを追加..." autocomplete="off">
                            <button type="submit" class="w-btn primary">追加</button>
                        </form>
                        <div class="todo-scroll js-todo-list"></div>`;
                } else if (w.type === 'countdown') {
                    const days = calcCountdownDays(w.targetDate);
                    body.innerHTML = `
                        <div class="cd-body">
                            <div>
                                <div style="font-size:0.88rem;color:var(--text-sub);" class="js-cd-label">${escapeXml(w.label || '目標日まで')}</div>
                                <div><span class="cd-days js-cd-days">${days}</span><span class="cd-unit">${days === '--' ? '' : (days >= 0 ? '日後' : '日経過')}</span></div>
                            </div>
                        </div>
                        <div class="cd-inputs">
                            <input type="text" class="w-input" value="${escapeXml(w.label || '')}" placeholder="イベント名" oninput="updateCountdown(${idx}, 'label', this.value)">
                            <input type="date" class="w-input" value="${escapeXml(w.targetDate || '')}" onchange="updateCountdown(${idx}, 'targetDate', this.value)">
                        </div>`;
                } else if (w.type === 'schedule') {
                    const schKey = `ipad_widget_sch_${w.id}`;
                    const items = JSON.parse(localStorage.getItem(schKey) || '["","","","","",""]');
                    const list = document.createElement('div');
                    list.className = 'schedule-list';
                    for (let p = 0; p < 6; p++) {
                        const row = document.createElement('div');
                        row.className = 'sch-row';
                        row.innerHTML = `<span class="sch-num">${p + 1}</span>`;
                        const inp = document.createElement('input');
                        inp.className = 'sch-input';
                        inp.placeholder = `${p + 1}限`;
                        inp.value = items[p] || '';
                        inp.oninput = () => {
                            items[p] = inp.value;
                            localStorage.setItem(schKey, JSON.stringify(items));
                        };
                        row.appendChild(inp);
                        list.appendChild(row);
                    }
                    body.appendChild(list);
                } else if (w.type === 'calc') {
                    const keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','C','+','(',')','DEL','='];
                    const disp = document.createElement('div');
                    disp.className = 'calc-disp';
                    disp.textContent = '0';
                    const cgrid = document.createElement('div');
                    cgrid.className = 'calc-grid';
                    let expr = '';
                    keys.forEach(k => {
                        const b = document.createElement('button');
                        b.type = 'button';
                        b.className = 'calc-btn' + (['+','-','*','/'].includes(k) ? ' op' : '') + (k === '=' ? ' eq' : '');
                        b.textContent = k === '*' ? '×' : (k === '/' ? '÷' : k);
                        b.onclick = () => {
                            if (k === 'C') { expr = ''; disp.textContent = '0'; }
                            else if (k === 'DEL') { expr = expr.slice(0, -1); disp.textContent = expr || '0'; }
                            else if (k === '=') {
                                try {
                                    if (/^[0-9+\-*/().\s]+$/.test(expr)) {
                                        const val = Function(`"use strict"; return (${expr})`)();
                                        expr = Number.isFinite(val) ? String(Math.round(val * 1e8) / 1e8) : '';
                                        disp.textContent = expr || 'Error';
                                    }
                                } catch (e) { disp.textContent = 'Error'; expr = ''; }
                            } else {
                                expr += k;
                                disp.textContent = expr;
                            }
                        };
                        cgrid.appendChild(b);
                    });
                    body.append(disp, cgrid);
                }

                card.appendChild(body);
                grid.appendChild(card);
            });

            updateClocks();
            renderTimerDisplay();
            renderTodos();
        }

        function openWidgetPickerModal() { document.getElementById('widgetPickerModal').classList.add('open'); }
        function closeWidgetPickerModal() { document.getElementById('widgetPickerModal').classList.remove('open'); }

        function addWidget(type) {
            const titles = {
                analog: 'アナログ時計', clock: 'デジタル時計', timer: '集中タイマー',
                memo: 'メモ', todo: 'ToDo', countdown: 'カウントダウン',
                schedule: '今日の時間割', calc: 'ミニ電卓'
            };
            const id = 'w_' + Date.now();
            const newW = { id, type, title: titles[type] || 'Widget', wide: type === 'schedule' };
            if (type === 'countdown') { newW.label = '予定まで'; newW.targetDate = ''; }
            state.widgets.push(newW);
            saveState();
            renderWidgets();
            closeWidgetPickerModal();
            goToPage(state.pages.length);
        }

        function moveWidget(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= state.widgets.length) return;
            [state.widgets[idx], state.widgets[target]] = [state.widgets[target], state.widgets[idx]];
            saveState(); renderWidgets();
        }

        function toggleWidgetWide(idx) {
            state.widgets[idx].wide = !state.widgets[idx].wide;
            saveState(); renderWidgets();
        }

        function deleteWidget(idx) {
            state.widgets.splice(idx, 1);
            saveState(); renderWidgets();
        }

        function calcCountdownDays(dateStr) {
            if (!dateStr) return '--';
            const today = new Date(); today.setHours(0, 0, 0, 0);
            const target = new Date(dateStr + 'T00:00:00');
            if (isNaN(target)) return '--';
            return Math.round((target - today) / 86400000);
        }

        function updateCountdown(idx, field, val) {
            state.widgets[idx][field] = val;
            saveState();
            renderWidgets();
        }

        /* =========================================================
           6. 編集モード・アプリ追加・移動・削除
        ========================================================= */
        function toggleEditMode(force) {
            isEditMode = typeof force === 'boolean' ? force : !isEditMode;
            document.getElementById('osShell').classList.toggle('editing', isEditMode);
            document.getElementById('editToggleBtn').classList.toggle('active', isEditMode);
            document.getElementById('editBtnText').textContent = isEditMode ? '完了' : '編集';
        }

        function addPage() {
            state.pages.push([]); saveState(); renderAll(); goToPage(state.pages.length - 1);
        }

        function removeCurrentPage() {
            if (currentPageIdx >= state.pages.length || state.pages.length <= 1) return;
            if (state.pages[currentPageIdx].length > 0) return;
            state.pages.splice(currentPageIdx, 1);
            saveState();
            currentPageIdx = Math.max(0, currentPageIdx - 1);
            renderAll();
            goToPage(currentPageIdx);
        }

        function deleteApp(loc, idx) {
            const arr = loc === 'dock' ? state.dock : state.pages[loc];
            arr.splice(idx, 1);
            saveState();
            renderAll();
        }

        function resetDefaults() {
            if (!confirm('初期状態に戻しますか？')) return;
            state = structuredClone(DEFAULT_STATE);
            saveState();
            applyAppearance();
            renderAll();
            goToPage(0);
        }

        function populateLocSelect(selected) {
            const sel = document.getElementById('fTargetLoc');
            sel.innerHTML = '';
            state.pages.forEach((_, i) => {
                const opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = `ホーム ${i + 1}ページ目`;
                sel.appendChild(opt);
            });
            const dockOpt = document.createElement('option');
            dockOpt.value = 'dock';
            dockOpt.textContent = '下部のDock';
            sel.appendChild(dockOpt);
            sel.value = String(selected);
        }

        document.getElementById('fIconType').addEventListener('change', e => {
            document.getElementById('customIconField').style.display = e.target.value === 'custom' ? 'flex' : 'none';
        });

        function openAddModal() {
            editingRef = null;
            document.getElementById('appModalTitle').textContent = 'アプリを追加';
            document.getElementById('fName').value = '';
            document.getElementById('fUrl').value = 'https://';
            document.getElementById('fIconType').value = 'auto';
            document.getElementById('fIconUrl').value = '';
            document.getElementById('fNewTab').checked = false;
            document.getElementById('customIconField').style.display = 'none';
            document.getElementById('reorderField').style.display = 'none';
            const defaultPage = Math.min(currentPageIdx, state.pages.length - 1);
            populateLocSelect(defaultPage);
            document.getElementById('appModal').classList.add('open');
        }

        function openEditModal(loc, idx) {
            editingRef = { loc, index: idx };
            const app = (loc === 'dock' ? state.dock : state.pages[loc])[idx];
            document.getElementById('appModalTitle').textContent = 'アプリを編集';
            document.getElementById('fName').value = app.name;
            document.getElementById('fUrl').value = app.url;
            document.getElementById('fIconType').value = app.iconType || 'auto';
            document.getElementById('fIconUrl').value = app.iconUrl || '';
            document.getElementById('fNewTab').checked = !!app.newTab;
            document.getElementById('customIconField').style.display = app.iconType === 'custom' ? 'flex' : 'none';
            document.getElementById('reorderField').style.display = 'flex';
            populateLocSelect(loc);
            document.getElementById('appModal').classList.add('open');
        }

        function closeAppModal() { document.getElementById('appModal').classList.remove('open'); }

        function shiftEditingApp(dir) {
            if (!editingRef) return;
            const arr = editingRef.loc === 'dock' ? state.dock : state.pages[editingRef.loc];
            const target = editingRef.index + dir;
            if (target < 0 || target >= arr.length) return;
            [arr[editingRef.index], arr[target]] = [arr[target], arr[editingRef.index]];
            editingRef.index = target;
            saveState();
            renderAll();
        }

        function saveAppModal() {
            const name = document.getElementById('fName').value.trim();
            const url = document.getElementById('fUrl').value.trim();
            const iconType = document.getElementById('fIconType').value;
            const iconUrl = document.getElementById('fIconUrl').value.trim();
            const newTab = document.getElementById('fNewTab').checked;
            const rawLoc = document.getElementById('fTargetLoc').value;
            const targetLoc = rawLoc === 'dock' ? 'dock' : Number(rawLoc);

            if (!name || !url) {
                alert('表示名とURLを入力してください');
                return;
            }

            const newApp = { name, url, iconType, iconUrl, newTab };

            if (editingRef) {
                const oldArr = editingRef.loc === 'dock' ? state.dock : state.pages[editingRef.loc];
                if (editingRef.loc === targetLoc) {
                    oldArr[editingRef.index] = newApp;
                } else {
                    oldArr.splice(editingRef.index, 1);
                    const newArr = targetLoc === 'dock' ? state.dock : state.pages[targetLoc];
                    newArr.push(newApp);
                }
            } else {
                const newArr = targetLoc === 'dock' ? state.dock : state.pages[targetLoc];
                newArr.push(newApp);
            }

            saveState();
            renderAll();
            closeAppModal();
        }

        /* =========================================================
           7. Spotlight検索
        ========================================================= */
        function openSpotlight() {
            document.getElementById('spotlightModal').classList.add('open');
            const inp = document.getElementById('spotlightInput');
            inp.value = '';
            renderSpotlightResults('');
            setTimeout(() => inp.focus(), 50);
        }

        function closeSpotlight() { document.getElementById('spotlightModal').classList.remove('open'); }

        function getAllAppsUnique() {
            const map = new Map();
            [...state.dock, ...state.pages.flat()].forEach(a => {
                if (!map.has(a.name + a.url)) map.set(a.name + a.url, a);
            });
            return Array.from(map.values());
        }

        function renderSpotlightResults(query) {
            const box = document.getElementById('spotlightResults');
            box.innerHTML = '';
            const q = query.trim().toLowerCase();

            const matches = getAllAppsUnique().filter(a =>
                !q || a.name.toLowerCase().includes(q) || a.url.toLowerCase().includes(q)
            ).slice(0, 6);

            matches.forEach(app => {
                const a = document.createElement('a');
                a.className = 'spot-item';
                a.href = isSafeUrl(app.url) ? app.url : '#';
                if (app.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
                a.onclick = () => closeSpotlight();

                const iconWrap = renderIconElement(app);
                iconWrap.className = 'spot-mini-icon';

                const meta = document.createElement('div');
                meta.className = 'spot-meta';
                const n = document.createElement('span');
                n.className = 'spot-name';
                n.textContent = app.name;
                const s = document.createElement('span');
                s.className = 'spot-sub';
                s.textContent = app.url;
                meta.append(n, s);

                a.append(iconWrap, meta);
                box.appendChild(a);
            });

            if (q) {
                const engines = [
                    { label: `Google で「${query}」を検索`, sub: 'Webブラウザで開く', url: `https://www.google.com/search?q=${encodeURIComponent(query)}`, icon: 'svg:google', newTab: true },
                    { label: `Googleアプリ で「${query}」を検索`, sub: 'Googleアプリを起動', url: `google://search?q=${encodeURIComponent(query)}`, icon: 'svg:google', newTab: false },
                    { label: `Googleドライブ で「${query}」を検索`, sub: 'ドライブ内を検索', url: `https://drive.google.com/drive/search?q=${encodeURIComponent(query)}`, icon: 'svg:drive', newTab: false },
                    { label: `YouTube で「${query}」を検索`, sub: 'YouTubeを開く', url: `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, icon: 'svg:youtube', newTab: false }
                ];
                engines.forEach(eng => {
                    const a = document.createElement('a');
                    a.className = 'spot-item';
                    a.href = eng.url;
                    if (eng.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
                    a.onclick = () => closeSpotlight();

                    const iconWrap = renderIconElement({ name: eng.label, url: eng.url, iconType: eng.icon });
                    iconWrap.className = 'spot-mini-icon';

                    const meta = document.createElement('div');
                    meta.className = 'spot-meta';
                    const n = document.createElement('span');
                    n.className = 'spot-name';
                    n.textContent = eng.label;
                    const s = document.createElement('span');
                    s.className = 'spot-sub';
                    s.textContent = eng.sub;
                    meta.append(n, s);

                    a.append(iconWrap, meta);
                    box.appendChild(a);
                });
            }
        }

        document.getElementById('spotlightInput').addEventListener('input', e => {
            renderSpotlightResults(e.target.value);
        });

        document.getElementById('spotlightInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const first = document.querySelector('#spotlightResults .spot-item');
                if (first) first.click();
            } else if (e.key === 'Escape') {
                closeSpotlight();
            }
        });

        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openSpotlight();
            } else if (e.key === 'Escape') {
                closeSpotlight();
                closeAppModal();
                closeCustomizeModal();
                closeWidgetPickerModal();
            }
        });

        /* =========================================================
           8. 時計・タイマー・ToDo機能
        ========================================================= */
        function updateClocks() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            const hh = String(h).padStart(2, '0');
            const mm = String(m).padStart(2, '0');
            const ss = String(s).padStart(2, '0');

            const dateStr = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

            document.querySelectorAll('.js-clock-time').forEach(el => el.textContent = `${hh}:${mm}:${ss}`);
            document.querySelectorAll('.js-clock-date').forEach(el => el.textContent = dateStr);

            const hDeg = (h % 12 + m / 60) * 30;
            const mDeg = (m + s / 60) * 6;
            const sDeg = s * 6;
            document.querySelectorAll('.js-hand-h').forEach(el => el.setAttribute('transform', `rotate(${hDeg} 50 50)`));
            document.querySelectorAll('.js-hand-m').forEach(el => el.setAttribute('transform', `rotate(${mDeg} 50 50)`));
            document.querySelectorAll('.js-hand-s').forEach(el => el.setAttribute('transform', `rotate(${sDeg} 50 50)`));
        }
        setInterval(updateClocks, 1000);

        let durationSec = 25 * 60;
        let remainingSec = durationSec;
        let endTime = null;
        let timerInterval = null;

        function renderTimerDisplay() {
            const m = String(Math.floor(remainingSec / 60)).padStart(2, '0');
            const s = String(remainingSec % 60).padStart(2, '0');
            document.querySelectorAll('.js-timer-num').forEach(el => el.textContent = `${m}:${s}`);
            document.querySelectorAll('.js-timer-btn').forEach(btn => btn.textContent = timerInterval ? '停止' : '開始');
        }

        function tickTimer() {
            if (!endTime) return;
            remainingSec = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
            if (remainingSec <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                endTime = null;
            }
            renderTimerDisplay();
        }

        function toggleTimer() {
            if (timerInterval) {
                tickTimer();
                clearInterval(timerInterval);
                timerInterval = null;
                endTime = null;
            } else {
                if (remainingSec <= 0) remainingSec = durationSec;
                endTime = Date.now() + remainingSec * 1000;
                timerInterval = setInterval(tickTimer, 250);
            }
            renderTimerDisplay();
        }

        function setTimer(min) {
            clearInterval(timerInterval);
            timerInterval = null;
            endTime = null;
            durationSec = min * 60;
            remainingSec = durationSec;
            renderTimerDisplay();
        }

        function addMinute() {
            remainingSec += 60;
            if (endTime) endTime += 60000;
            renderTimerDisplay();
        }

        function resetTimer() { setTimer(durationSec / 60); }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && endTime) tickTimer();
        });

        // ToDo機能
        let todos = JSON.parse(localStorage.getItem('ipad_dashboard_todos') || '[]');

        function saveTodos() {
            localStorage.setItem('ipad_dashboard_todos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            document.querySelectorAll('.js-todo-list').forEach(list => {
                list.innerHTML = '';
                todos.forEach((t, i) => {
                    const row = document.createElement('div');
                    row.className = 'todo-row' + (t.done ? ' done' : '');

                    const chk = document.createElement('button');
                    chk.type = 'button';
                    chk.className = 'todo-check';
                    if (t.done) chk.innerHTML = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>`;
                    chk.onclick = () => {
                        todos[i].done = !todos[i].done;
                        saveTodos();
                    };

                    const span = document.createElement('span');
                    span.textContent = t.text;

                    row.append(chk, span);
                    list.appendChild(row);
                });
            });
        }

        function addTodo(e, form) {
            e.preventDefault();
            const inp = form.querySelector('input');
            const text = inp.value.trim();
            if (!text) return;
            todos.unshift({ text, done: false });
            inp.value = '';
            saveTodos();
        }

        function clearDoneTodos() {
            todos = todos.filter(t => !t.done);
            saveTodos();
        }

        // 初期化実行
        applyAppearance();
        renderAll();
    </script>
</body>
</html>
